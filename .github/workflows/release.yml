# Build the Figma plugin and attach a ready-to-import zip to the GitHub Release.
# Trigger: push a version tag, e.g. git tag v1.0.1 && git push origin v1.0.1
name: Release plugin zip

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # build:production validates too, but running it as its own step means a bad tag
      # fails here by name instead of somewhere inside the build log — and it fails
      # before any zip is produced, so a broken asset never reaches the release.
      - name: Validate scripts
        run: npm run validate

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build:production

      # Must match pack-plugin.js: the manifest is generated into dist/ and its main/ui paths are
      # bare filenames, so we zip the contents of dist/, not the directory itself.
      - name: Create plugin zip
        run: cd dist && zip -r "../codefig-${{ github.ref_name }}-plugin.zip" .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: codefig-${{ github.ref_name }}-plugin.zip
          generate_release_notes: true
