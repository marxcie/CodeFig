        // Update last opened script
        post('SET_LAST_OPENED', { name: generatedName, scriptType: 'user' });
        
        // Update button states and sidebar
        updateButtonStates();
        updateScriptList(searchInput.value);
      }

      // Generate a simple sequential name: Untitled, Untitled 2, Untitled 3, etc.
      function generateUntitledName() {
        let baseName = 'Untitled';
        let counter = 0;
        let scriptName = baseName;
        
        while (allScripts.some(s => s.name === scriptName)) {
          counter++;
          scriptName = `${baseName} ${counter}`;
        }
        
        return scriptName;
      }

      // Save current script (with prompts for naming)
      function saveCurrentScript() {
        if (!currentScript) return;
        
        let scriptName = currentScript.name;
        
        // If it's temporary or starts with "Untitled", prompt for new name
        if (currentScript.isTemporary || currentScript.name.startsWith('Untitled')) {
          scriptName = prompt('Enter script name:', currentScript.name);
          if (!scriptName || scriptName.trim() === '') {
            post('NOTIFY', { message: 'Save cancelled - no name provided' });
            return;
          }
          scriptName = scriptName.trim();
          
          // Check for duplicates
          if (allScripts.some(s => s.name === scriptName && s !== currentScript)) {
            post('NOTIFY', { message: 'A script with that name already exists' });
            return;
          }
        }
        
        const scriptCode = getFullCode();
        
        // Normalize the name if it contains a slash
        const slashMatch = scriptName.match(/^(.+?)\s*\/\s*(.+)$/);
        const normalizedName = slashMatch ? `${slashMatch[1].trim()} / ${slashMatch[2].trim()}` : scriptName;
        
        const scriptData = {
          name: normalizedName,
          code: scriptCode,
          type: 'user'
        };
        
        // Update current script
        currentScript.name = normalizedName;
        currentScript.code = scriptCode;
        currentScript.type = 'user';
        currentScript.isTemporary = false;
        
        originalCode = scriptCode;
        
        // Update title (script name already contains group info if applicable)
        scriptTitle.textContent = normalizedName;
        
        post('SAVE', scriptData);
        updateButtonStates();
        updateScriptList(searchInput.value);
        
        post('NOTIFY', { message: `Saved: ${scriptName}` });
      }

      // Debounced autosave function
      function scheduleAutosave() {
        debugLog('scheduleAutosave called');
        debugLog('scheduleAutosave - currentScript:', currentScript ? {name: currentScript.name, type: currentScript.type, isTemporary: currentScript.isTemporary} : 'null');
        
        // Don't schedule autosave for empty scripts
        if (!getEffectiveContentLength()) {
          debugLog('scheduleAutosave - skipping: empty script');
          return;
        }
        
        // Clear any existing timeout
        if (autosaveTimeout) {
          clearTimeout(autosaveTimeout);
          debugLog('scheduleAutosave - cleared existing timeout');
        }
        
        debugLog('scheduleAutosave - scheduling autosave in 2 seconds...');
        
        // Schedule autosave after 2 seconds of inactivity
        autosaveTimeout = setTimeout(() => {
          debugLog('scheduleAutosave - timeout triggered, calling autoSaveCurrentScript');
          autoSaveCurrentScript();
        }, 2000);
      }

      // Delete current script
      function deleteCurrentScript() {
        if (!currentScript || currentScript.type !== 'user') return;
        
        // Handle temporary scripts with content differently
        if (currentScript.isTemporary) {
          // For temporary scripts, just clear and reset
          currentScript = null;
          code.setValue('');
          if (configEditor) configEditor.setValue('');
          if (configUIInstance) { configUIInstance.destroy(); configUIInstance = null; }
          originalCode = '';
          scriptHasDocs = false;
          scriptHasConfig = false;
          updateTabVisibility(['script']);
          currentTab = 'source';
          switchTab('source');
          scriptTitle.textContent = 'Select a script';
          scriptTitle.classList.remove('editable');
          scriptStatus.textContent = 'Ready';
          scriptStatus.style.display = 'block';
          
          // Hide info panel button when no script is selected
          infoPanelAvailable = false;
          updateInfoPanelButtonVisibility();
          
          updateButtonStates();
          updateScriptList(searchInput.value);
          
          // Open Help & Documentation after discarding temporary script
          const helpScript = allScripts.find(s => s.name === 'CodeFig - help & documentation');
          if (helpScript) {
            selectScriptDirectly(helpScript);
          }
          
          post('NOTIFY', { message: 'Discarded untitled script' });
          return;
        }
        
        // For saved scripts, confirm deletion
        if (confirm(`Delete "${currentScript.name}"?`)) {
          const scriptName = currentScript.name;
          post('DELETE', { name: scriptName });
          
          // Remove from local array
          allScripts = allScripts.filter(s => s.name !== scriptName);
          
          // Clear editor and tab state
          currentScript = null;
          code.setValue('');
          if (configEditor) configEditor.setValue('');
          if (configUIInstance) { configUIInstance.destroy(); configUIInstance = null; }
          originalCode = '';
          scriptHasDocs = false;
          scriptHasConfig = false;
          updateTabVisibility(['script']);
          currentTab = 'source';
          switchTab('source');
          scriptTitle.textContent = 'Select a script';
          scriptTitle.classList.remove('editable');
          scriptStatus.textContent = 'Ready';
          scriptStatus.style.display = 'block';
          
          // Hide info panel button when no script is selected
          infoPanelAvailable = false;
          updateInfoPanelButtonVisibility();
          
          updateButtonStates();
          updateScriptList(searchInput.value);
          
          // Open Help & Documentation after deletion
          const helpScript = allScripts.find(s => s.name === 'CodeFig - help & documentation');
          if (helpScript) {
            selectScriptDirectly(helpScript);
          }
          
          post('NOTIFY', { message: `Deleted: ${scriptName}` });
        }
      }

      // Runtime imports are resolved by src/import-resolver.js, inlined above as
      // <script id="import-resolver-js">. The same module backs validate-scripts.js at
      // build time, so there is no second copy of the @import logic to keep in sync.
      function processRuntimeImports(code) {
        const imports = window.CodeFigImports;
        if (!imports || typeof imports.resolveImports !== 'function') {
          // Fail loudly. Without the resolver every @import degrades to a comment,
          // which shows up as "scripts mysteriously do nothing".
          throw new Error('CodeFigImports missing: src/import-resolver.js was not inlined into dist/ui.html');
        }
        return imports.resolveImports(code, allScripts, {
          log: function (message) { console.log(message); },
          warn: function (message) { console.warn(message); },
          notify: function (message) { post('NOTIFY', { message: message }); }
        });
      }

      // Run current script
      function runCurrentScript() {
        if (currentScript && currentScript.type === 'library') {
          post('NOTIFY', { message: 'Libraries are imported, not run directly.' });
          return;
        }
        // Clear the internal error console for a clean "last run" view
        _codefigResetConsole();
        let scriptCode = getFullCode();
        if (scriptCode.trim()) {
          // Process runtime imports before execution
          scriptCode = processRuntimeImports(scriptCode);
          beginRunSession();
          post('RUN', { code: scriptCode, modeIntents: currentModeIntents() });
        }
      }

      // Export current script
      function exportCurrentScript() {
        if (!currentScript) return;
        
        const scriptData = {
          name: currentScript.name,
          code: getFullCode(),
          type: currentScript.type
        };
        
        const dataStr = JSON.stringify(scriptData, null, 2);
        const dataBlob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(dataBlob);
        
        const link = document.createElement('a');
        link.href = url;
        link.download = `${currentScript.name.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.json`;
        link.click();
        
        URL.revokeObjectURL(url);
        post('NOTIFY', { message: `Exported: ${currentScript.name}` });
      }

      function normalizeImportedScriptEntry(raw) {
        if (!raw || typeof raw !== 'object') return null;
        const name = raw.name != null ? String(raw.name).trim() : '';
        if (!name || raw.code === undefined || raw.code === null) return null;
        const code = typeof raw.code === 'string' ? raw.code : String(raw.code);
        const isAtLib = name.startsWith('@');
        let type = isAtLib ? 'library' : 'user';
        if (raw.type === 'library' || raw.type === 'user') {
          type = isAtLib ? 'library' : raw.type;
        }
        return { name, code, type };
      }

      // Import script (single object or array from "export all user scripts")
      function importScript() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (ev) => {
              try {
                const parsed = JSON.parse(ev.target.result);
                let items = [];
                if (Array.isArray(parsed)) {
                  items = parsed;
                } else if (parsed && typeof parsed === 'object' && parsed.name && parsed.code !== undefined) {
                  items = [parsed];
                } else {
                  post('NOTIFY', { message: 'Invalid script file format' });
                  return;
                }
                const normalized = [];
                const seenNames = new Set();
                let invalidCount = 0;
                for (const raw of items) {
                  const n = normalizeImportedScriptEntry(raw);
                  if (!n) {
                    invalidCount++;
                    continue;
                  }
                  if (seenNames.has(n.name)) continue;
                  seenNames.add(n.name);
                  normalized.push(n);
                }
                const toAdd = [];
                let skippedDup = 0;
                for (const n of normalized) {
                  if (allScripts.some(s => s.name === n.name)) {
                    skippedDup++;
                  } else {
                    toAdd.push(n);
                  }
                }
                if (toAdd.length === 0) {
                  let msg = 'No scripts were imported';
                  if (skippedDup > 0 && invalidCount === 0) {
                    msg = skippedDup === 1
                      ? 'A script with that name already exists'
                      : `All ${skippedDup} scripts already exist`;
                  } else if (invalidCount > 0 && normalized.length === 0) {
                    msg = 'Invalid script file format';
                  } else if (invalidCount > 0) {
                    msg = 'No scripts were imported (invalid entries)';
                  }
                  post('NOTIFY', { message: msg });
                  return;
                }
                pendingBatchImportSummary = { skipped: skippedDup, invalid: invalidCount };
                post('SAVE_BATCH', { scripts: toAdd });
              } catch (error) {
                post('NOTIFY', { message: 'Error reading script file' });
              }
            };
            reader.readAsText(file);
          }
        };
        input.click();
      }

      // Export all user scripts
      function exportAllUserScripts() {
        const userScriptsData = allScripts.filter(s => s.type === 'user' || s.type === 'library');
        
        if (userScriptsData.length === 0) {
          post('NOTIFY', { message: 'No user scripts or libraries to export' });
          return;
        }
        
        const dataStr = JSON.stringify(userScriptsData, null, 2);
        const dataBlob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(dataBlob);
        
        const link = document.createElement('a');
        link.href = url;
        link.download = 'codefig_user_scripts.json';
        link.click();
        
        URL.revokeObjectURL(url);
        post('NOTIFY', { message: `Exported ${userScriptsData.length} user script(s) and library(ies)` });
      }

      // Initialize resizing functionality
      function initResizing() {
        resizer.addEventListener('mousedown', (e) => {
          isResizing = true;
          startX = e.clientX;
          startWidth = sidebar.offsetWidth;
          resizer.classList.add('resizing');
          document.addEventListener('mousemove', handleResize);
          document.addEventListener('mouseup', stopResize);
          e.preventDefault();
        });
      }

      function handleResize(e) {
        if (!isResizing) return;
        
        const deltaX = e.clientX - startX;
        const newWidth = Math.max(200, Math.min(400, startWidth + deltaX));
        sidebar.style.width = newWidth + 'px';
        
        // Refresh CodeMirror after resize
        setTimeout(() => {
          code.refresh();
          code.setSize(null, '100%');
          if (configEditor) { configEditor.refresh(); configEditor.setSize(null, '100%'); }
        }, 0);
      }

      function stopResize() {
        isResizing = false;
        resizer.classList.remove('resizing');
        document.removeEventListener('mousemove', handleResize);
        document.removeEventListener('mouseup', stopResize);
        
        // Final CodeMirror refresh
        setTimeout(() => {
          code.refresh();
          code.setSize(null, '100%');
          if (configEditor) { configEditor.refresh(); configEditor.setSize(null, '100%'); }
        }, 0);
      }

      // ============================================================================
      // WINDOW MEMORY FUNCTIONALITY
      // ============================================================================

      function saveWindowMemory() {
        try {
          const memory = {
            width: window.innerWidth,
            height: window.innerHeight,
            timestamp: Date.now()
          };
          
          // Use a simple approach - store in a global variable and send to backend
          window._codefigWindowMemory = memory;
          
          // Send to backend for persistence
          parent.postMessage({
            pluginMessage: {
              type: 'SAVE_WINDOW_MEMORY',
              memory: memory
            }
          }, '*');
          
          console.log('💾 Window memory saved:', memory);
        } catch (e) {
          console.warn('Failed to save window memory:', e);
        }
      }

      function loadWindowMemory() {
        try {
          // Check if we have memory from backend
          if (window._codefigWindowMemory) {
            const memory = window._codefigWindowMemory;
            
            // Check if memory is not too old (7 days)
            const maxAge = 7 * 24 * 60 * 60 * 1000; // 7 days in milliseconds
            if (Date.now() - memory.timestamp > maxAge) {
              console.log('⏰ Window memory too old, ignoring');
              return null;
            }
            
            console.log('📂 Window memory loaded:', memory);
            return memory;
          }
          
          console.log('❌ No window memory found');
          return null;
        } catch (e) {
          console.warn('Failed to load window memory:', e);
          return null;
        }
      }

      function restoreWindowSize() {
        console.log('🔄 Attempting to restore window size...');
        const memory = loadWindowMemory();
        if (!memory) {
          console.log('❌ No memory to restore');
          return;
        }
        
        // Validate window size is reasonable
        const minWidth = 800;
        const maxWidth = 2000;
        const minHeight = 400;
        const maxHeight = 1200;
        
        const width = Math.max(minWidth, Math.min(maxWidth, memory.width));
        const height = Math.max(minHeight, Math.min(maxHeight, memory.height));
        
        console.log('📏 Current size:', window.innerWidth, 'x', window.innerHeight);
        console.log('📏 Saved size:', memory.width, 'x', memory.height);
        console.log('📏 Target size:', width, 'x', height);
        
        // Only restore if size changed significantly
        if (Math.abs(width - window.innerWidth) > 50 || 
            Math.abs(height - window.innerHeight) > 50) {
          
          console.log('✅ Restoring window size:', { width, height });
          
          // Send restore message to backend
          parent.postMessage({
            pluginMessage: {
              type: 'RESTORE_WINDOW',
              width: width,
              height: height
            }
          }, '*');
        } else {
          console.log('ℹ️ Window size is already correct, no need to restore');
        }
      }

      // ============================================================================
      // WINDOW RESIZING FUNCTIONALITY
      // ============================================================================

      function initWindowResizing() {
        // Corner resize (both width and height)
        resizeHandleCorner.addEventListener('mousedown', (e) => {
          isWindowResizing = true;
          resizeType = 'both';
          startWindowX = e.clientX;
          startWindowY = e.clientY;
          startWindowWidth = window.innerWidth;
          startWindowHeight = window.innerHeight;
          document.body.classList.add('resizing');
          document.addEventListener('mousemove', handleWindowResize);
          document.addEventListener('mouseup', stopWindowResize);
          e.preventDefault();
        });
      }

      function handleWindowResize(e) {
        if (!isWindowResizing) return;

        let newWidth = startWindowWidth;
        let newHeight = startWindowHeight;

        if (resizeType === 'width' || resizeType === 'both') {
          const deltaX = e.clientX - startWindowX;
          newWidth = Math.max(800, Math.min(2000, startWindowWidth + deltaX));
        }

        if (resizeType === 'height' || resizeType === 'both') {
          const deltaY = e.clientY - startWindowY;
          newHeight = Math.max(400, Math.min(1200, startWindowHeight + deltaY));
        }

        // Throttle to ~60fps to reduce position jumping
        const now = Date.now();
        if (now - lastResizeTime < 16) return;
        lastResizeTime = now;

        // Send resize message to backend
        parent.postMessage({
          pluginMessage: {
            type: 'RESIZE_WINDOW',
            width: newWidth,
            height: newHeight
          }
        }, '*');
      }

      function stopWindowResize() {
        isWindowResizing = false;
        resizeType = null;
        document.body.classList.remove('resizing');
        document.removeEventListener('mousemove', handleWindowResize);
        document.removeEventListener('mouseup', stopWindowResize);
        
        // Save window memory after resize is complete
        setTimeout(() => {
          saveWindowMemory();

      // Toggle section collapse/expand
      function toggleSection(sectionId) {
        const contentElement = document.getElementById(`content-${sectionId}`);
        const toggleElement = document.querySelector(`[onclick="toggleSection('${sectionId}')"] .section-toggle`);
        
        if (!contentElement || !toggleElement) return;
        
        const isCollapsed = collapsedSections.has(sectionId);
        
        if (isCollapsed) {
          // Expand
          collapsedSections.delete(sectionId);
          contentElement.classList.remove('collapsed');
          toggleElement.classList.remove('collapsed');
          
          // Remove max-height to allow full expansion
          contentElement.style.maxHeight = 'none';
          
          // Store expanded state
          post('SAVE_COLLAPSED_SECTIONS', { collapsedSections: [...collapsedSections] });
        } else {
          // Collapse
          collapsedSections.add(sectionId);
          contentElement.classList.add('collapsed');
          toggleElement.classList.add('collapsed');
          contentElement.style.maxHeight = '0';
          
          // Store collapsed state
          post('SAVE_COLLAPSED_SECTIONS', { collapsedSections: [...collapsedSections] });
        }
      }

      // Toggle line comments for selected lines in CodeMirror
      function toggleLineComments() {
        // Determine which editor is active
        const activeEditor = currentTab === 'configCode' ? configEditor : code;
        if (!activeEditor) return;

        const doc = activeEditor.getDoc();
        const selections = doc.listSelections();

        activeEditor.operation(() => {
          for (const selection of selections) {
            const from = selection.from();
            const to = selection.to();
            const startLine = from.line;
            const endLine = to.line;

            // Get all lines in the selection
            const lines = [];
            for (let i = startLine; i <= endLine; i++) {
              lines.push({
                lineNum: i,
                text: doc.getLine(i)
              });
            }

            // Check if all non-empty lines are commented
            const nonEmptyLines = lines.filter(l => l.text.trim().length > 0);
            const allCommented = nonEmptyLines.length > 0 && nonEmptyLines.every(l => 
              l.text.trimStart().startsWith('//')
            );

            if (allCommented) {
              // Uncomment all lines
              for (const line of lines) {
                const trimmedStart = line.text.length - line.text.trimStart().length;
                const afterTrim = line.text.trimStart();
                
                if (afterTrim.startsWith('// ')) {
                  // Remove "// " (with space)
                  const newText = line.text.substring(0, trimmedStart) + afterTrim.substring(3);
                  doc.replaceRange(newText, 
                    { line: line.lineNum, ch: 0 }, 
                    { line: line.lineNum, ch: line.text.length }
                  );
                } else if (afterTrim.startsWith('//')) {
                  // Remove "//" (without space)
                  const newText = line.text.substring(0, trimmedStart) + afterTrim.substring(2);
                  doc.replaceRange(newText, 
                    { line: line.lineNum, ch: 0 }, 
                    { line: line.lineNum, ch: line.text.length }
                  );
                }
              }
            } else {
              // Comment all lines
              for (const line of lines) {
                const trimmedStart = line.text.length - line.text.trimStart().length;
                const newText = line.text.substring(0, trimmedStart) + '// ' + line.text.substring(trimmedStart);
                doc.replaceRange(newText, 
                  { line: line.lineNum, ch: 0 }, 
                  { line: line.lineNum, ch: line.text.length }
                );
              }
            }
          }
        });
      }

      // Handle title editing
      function initTitleEditing() {
        scriptTitle.addEventListener('click', () => {
          if (!currentScript || currentScript.type !== 'user' || !scriptTitle.classList.contains('editable')) return;
          
          const originalText = scriptTitle.textContent;
          scriptTitle.contentEditable = true;
          scriptTitle.classList.add('editing');
          scriptTitle.focus();
          
          // Select all text
          const range = document.createRange();
          range.selectNodeContents(scriptTitle);
          const selection = window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          
          function finishEditing(save = false) {
            scriptTitle.contentEditable = false;
            scriptTitle.classList.remove('editing');
            
            if (save) {
              const newName = scriptTitle.textContent.trim();
              if (newName && newName !== originalText) {
                // Check for duplicates
                if (allScripts.some(s => s.name === newName && s !== currentScript)) {
                  post('NOTIFY', { message: 'A script with that name already exists' });
                  scriptTitle.textContent = originalText;
                  syncScriptStructureFromEditor();
                  return;
                }
                
                // Normalize the name if it contains a slash
                const slashMatch = newName.match(/^(.+?)\s*\/\s*(.+)$/);
                const normalizedName = slashMatch ? `${slashMatch[1].trim()} / ${slashMatch[2].trim()}` : newName;
                
                // Update script name
                currentScript.name = normalizedName;
                post('SAVE', {
                  name: normalizedName,
                  oldName: originalText,
                  code: currentScript.code,
                  type: 'user'
                });
                // Update last opened script with new name
                post('SET_LAST_OPENED', { name: normalizedName, scriptType: 'user' });
                updateScriptList(searchInput.value);
                // post('NOTIFY', { message: `Renamed to: ${newName}` });
              }
            } else {
              scriptTitle.textContent = originalText;
            }
            syncScriptStructureFromEditor();
          }
          
          scriptTitle.addEventListener('blur', () => finishEditing(true), { once: true });
          const handleKeyDown = (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              finishEditing(true);
              scriptTitle.removeEventListener('keydown', handleKeyDown);
            } else if (e.key === 'Escape') {
              e.preventDefault();
              finishEditing(false);
              scriptTitle.removeEventListener('keydown', handleKeyDown);
            }
          };
          
          scriptTitle.addEventListener('keydown', handleKeyDown);
        });
      }

      code.on('change', () => {

      // Config editor change (when script has config tab)
      if (configEditor) {
        configEditor.on('change', () => {
          updateButtonStates();
          scheduleAutosave();
          scheduleConfigPreview();
        });
      }

      // Message handling
        window.onmessage = (event) => {
          const msg = event.data.pluginMessage;
          if (!msg) return;
          
          console.log('UI: Received message type:', msg.type);
          
          switch (msg.type) {
          case 'EXAMPLE_SCRIPTS':
            uiDebugLog('EXAMPLE_SCRIPTS received, items.length:', msg.items ? msg.items.length : 0);
            
            prebuiltScripts = msg.items.map(script => ({
              name: script.name || 'Unnamed',
              code: script.code || '',
              type: script.type || 'prebuilt',
              // Kept for `npm run figma:run -- <script>`: display names are
              // "Category / Title (WIP)", so the filename is the stable handle.
              filename: script.filename || ''
            }));
            allScripts = [...prebuiltScripts, ...userScripts];
            updateScriptList();
            uiDebugLog('EXAMPLE_SCRIPTS applied, allScripts.length:', allScripts.length);
            break;
            
          case 'LIST':
            uiDebugLog('LIST received, user items:', msg.items ? msg.items.length : 0);
            
            userScripts = msg.items.map(script => ({
              name: script.name || 'Unnamed',
              code: script.code || '',
              type: (script.type === 'library' || (script.name && String(script.name).startsWith('@'))) ? 'library' : 'user'
            }));
            allScripts = [...prebuiltScripts, ...userScripts];
            updateScriptList();
            uiDebugLog('LIST applied, allScripts.length:', allScripts.length);
            
            // Open the last opened script or default to Help & Documentation
            // Add a small delay to ensure everything is fully initialized
            setTimeout(() => {
              openInitialScript(msg.lastOpenedScript);
            }, 50);
            break;
            
          case 'COLLAPSED_SECTIONS':
            collapsedSections = new Set(msg.collapsedSections || []);
            // Update the script list to apply the collapsed state
            updateScriptList();
            break;
            
            case 'SAVE_CONFIRMED':
            debugLog('Save confirmed for:', msg.scriptData.name);
            // Immediately add/update the script in allScripts so it's available for import
            if (msg.scriptData) {
              // Get the current code from the editor if scriptData doesn't have it
              const scriptCode = msg.scriptData.code || (currentScript && currentScript.code) || getFullCode() || '';
              
              const derivedType = (msg.scriptData.name && String(msg.scriptData.name).startsWith('@')) ? 'library' : (msg.scriptData.type || 'user');
              const confirmedName = msg.scriptData.name;
              const existingIndex = allScripts.findIndex(s => s.name === confirmedName && (s.type === 'user' || s.type === 'library'));
              if (existingIndex >= 0) {
                // Mutate in place so currentScript stays the same reference as allScripts[i] after renames/saves
                const target = allScripts[existingIndex];
                target.name = confirmedName;
                target.code = scriptCode;
                target.type = derivedType;
              } else {
                // Late SAVE_CONFIRMED for a filename we already renamed away (autosave vs inline title edit race).
                // Pushing would duplicate the script (e.g. "Untitled" + new name) and break the sidebar.
                if (currentScript && (currentScript.type === 'user' || currentScript.type === 'library') &&
                    confirmedName !== currentScript.name) {
                  debugLog('SAVE_CONFIRMED ignored (stale name vs current script):', confirmedName, 'current:', currentScript.name);
                  break;
                }
                allScripts.push({
                  name: confirmedName,
                  code: scriptCode,
                  type: derivedType
                });
              }
              // Update userScripts array as well (user + library)
              userScripts = allScripts.filter(s => s.type === 'user' || s.type === 'library');
              debugLog('Script added to allScripts for immediate import availability:', msg.scriptData.name);
            }
            break;

          case 'BATCH_SAVE_CONFIRMED':
            {
              const list = msg.scripts || [];
              for (const scriptData of list) {
                const derivedType = (scriptData.name && String(scriptData.name).startsWith('@'))
                  ? 'library'
                  : (scriptData.type === 'library' ? 'library' : 'user');
                const existingIndex = allScripts.findIndex(
                  s => s.name === scriptData.name && (s.type === 'user' || s.type === 'library')
                );
                if (existingIndex >= 0) {
                  const target = allScripts[existingIndex];
                  target.name = scriptData.name;
                  target.code = scriptData.code;
                  target.type = derivedType;
                } else {
                  allScripts.push({
                    name: scriptData.name,
                    code: scriptData.code,
                    type: derivedType
                  });
                }
              }
              userScripts = allScripts.filter(s => s.type === 'user' || s.type === 'library');
              updateScriptList(searchInput.value);
              if (list.length) {
                const last = list[list.length - 1];
                const sel = allScripts.find(
                  s => s.name === last.name && (s.type === 'user' || s.type === 'library')
                );
                if (sel) selectScriptDirectly(sel);
              }
              const summary = pendingBatchImportSummary;
              pendingBatchImportSummary = null;
              const n = list.length;
              let message = n === 1 ? `Imported: ${list[0].name}` : `Imported ${n} scripts`;
              const parts = [];
              if (summary && summary.skipped) parts.push(`${summary.skipped} already existed`);
              if (summary && summary.invalid) parts.push(`${summary.invalid} invalid`);
              if (parts.length) message += ' · ' + parts.join(', ');
              post('NOTIFY', { message });
            }
            break;

          case 'BATCH_SAVE_FAILED':
            pendingBatchImportSummary = null;
            post('NOTIFY', { message: msg.error ? `Import failed: ${msg.error}` : 'Import failed' });
            break;
            
          case 'SAVE_FAILED':
            debugError('Save failed for:', msg.scriptName, msg.error);
            post('NOTIFY', { message: `Failed to save script: ${msg.error}` });
            break;

          case 'OPTIONS':
            const optionSource = msg.optionSource;
            const options = msg.options || [];
            const optionGroups = msg.optionGroups;
            function collectionOptionLabel(opt, source) {
              if (source === 'variableCollections' && opt === '') return '(all collections)';
              return opt;
            }
            const useGroupedCollections =
              optionGroups &&
              Array.isArray(optionGroups) &&
              optionGroups.length > 0 &&
              (optionSource === 'variableCollections' ||
                optionSource === 'localVariableCollections');
            document.querySelectorAll('select[data-option-source="' + optionSource + '"]').forEach(function (sel) {
              const initial = sel.getAttribute('data-initial-value') || '';
              sel.innerHTML = '';
              if (useGroupedCollections) {
                sel.setAttribute('data-collection-groups', 'true');
                function appendOption(value, label) {
                  const o = document.createElement('option');
                  o.value = value;
                  o.textContent = label;
                  sel.appendChild(o);
                }
                if (optionSource === 'variableCollections') {
                  appendOption('', '(all collections)');
                }
                optionGroups.forEach(function (grp) {
                  const label = grp && grp.label ? String(grp.label) : '';
                  const values = grp && Array.isArray(grp.values) ? grp.values : [];
                  if (!values.length) return;
                  const og = document.createElement('optgroup');
                  og.label = label;
                  values.forEach(function (val) {
                    const o = document.createElement('option');
                    o.value = val;
                    o.textContent = collectionOptionLabel(val, optionSource);
                    og.appendChild(o);
                  });
                  sel.appendChild(og);
                });
              } else {
                sel.removeAttribute('data-collection-groups');
                options.forEach(function (opt) {
                  const o = document.createElement('option');
                  o.value = opt;
                  o.textContent = collectionOptionLabel(opt, optionSource);
                  sel.appendChild(o);
                });
              }
              if (options.indexOf(initial) !== -1) sel.value = initial;
              else if (options.length) sel.value = options[0];
            });

            function populateMultiselectBox(box, selectedNames) {
              box.innerHTML = '';
              var selected = Array.isArray(selectedNames) ? selectedNames : [];
              function appendCheckbox(value, labelText) {
                if (!value) return;
                var lbl = document.createElement('label');
                lbl.className = 'config-ui-multiselect-item';
                var cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.className = 'config-ui-multiselect-cb';
                cb.value = value;
                cb.checked = selected.indexOf(value) !== -1;
                lbl.appendChild(cb);
                var sp = document.createElement('span');
                sp.textContent = labelText || value;
                lbl.appendChild(sp);
                box.appendChild(lbl);
              }
              if (useGroupedCollections) {
                optionGroups.forEach(function (grp) {
                  var label = grp && grp.label ? String(grp.label) : '';
                  var values = grp && Array.isArray(grp.values) ? grp.values : [];
                  if (!values.length) return;
                  var groupWrap = document.createElement('div');
                  groupWrap.className = 'config-ui-multiselect-group';
                  var gl = document.createElement('div');
                  gl.className = 'config-ui-multiselect-group__label';
                  gl.textContent = label;
                  groupWrap.appendChild(gl);
                  values.forEach(function (val) {
                    var lbl = document.createElement('label');
                    lbl.className = 'config-ui-multiselect-item';
                    var cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.className = 'config-ui-multiselect-cb';
                    cb.value = val;
                    cb.checked = selected.indexOf(val) !== -1;
                    lbl.appendChild(cb);
                    var sp = document.createElement('span');
                    sp.textContent = val;
                    lbl.appendChild(sp);
                    groupWrap.appendChild(lbl);
                  });
                  box.appendChild(groupWrap);
                });
              } else {
                options.forEach(function (opt) {
                  if (opt === '' && optionSource === 'variableCollections') return;
                  appendCheckbox(opt, opt);
                });
              }
            }

            // The collection pickers. Filled here rather than at render time because the list is a
            // backend round trip, and the control has to exist before it can be waited on.
            document
              .querySelectorAll('.config-ui-collection[data-option-source="' + optionSource + '"]')
              .forEach(function (wrap) {
                var current = wrap.getAttribute('data-initial-value') || '';
                var live = window.CodeFigConfigUI && window.CodeFigConfigUI.readCollectionControl
                  ? window.CodeFigConfigUI.readCollectionControl(wrap)
                  : current;
                if (window.CodeFigConfigUI && window.CodeFigConfigUI.populateCollectionControl) {
                  // `true`: the list is real now, so a name that is not in it genuinely is not here.
                  window.CodeFigConfigUI.populateCollectionControl(wrap, options, live || current, true);
                }
              });

            // The mode pickers, matched by the collection they are currently showing rather than by
            // the option source: this answer is about one collection, and a second picker pointed at
            // another one must not take it.
            if (optionSource === 'collectionModes') {
              var answeredFor = msg.collection == null ? '' : String(msg.collection);
              document
                .querySelectorAll('[data-mode-field]')
                .forEach(function (wrap) {
                  if ((wrap.getAttribute('data-mode-collection') || '') !== answeredFor) return;
                  if (!window.CodeFigConfigUI || !window.CodeFigConfigUI.populateModeControl) return;
                  var value = window.CodeFigConfigUI.currentModeValue
                    ? window.CodeFigConfigUI.currentModeValue(wrap)
                    : wrap.getAttribute('data-initial-value') || '';
                  window.CodeFigConfigUI.populateModeControl(wrap, options, value, {
                    collection: answeredFor,
                    exists: !!msg.exists
                  });
                });
            }

            document
              .querySelectorAll('.config-ui-multiselect[data-option-source="' + optionSource + '"]')
              .forEach(function (box) {
                var initialRaw = box.getAttribute('data-initial-value') || '[]';
                var selected = [];
                try {
                  selected = JSON.parse(initialRaw);
                  if (!Array.isArray(selected)) selected = [];
                } catch (e) {
                  selected = [];
                }
                populateMultiselectBox(box, selected);
              });
            break;
            
          case 'CONFIG_UI_RENDER':
            if (msg.schema && typeof window.CodeFigConfigUI !== 'undefined') {
              try {
                const container = document.getElementById('configUIContainer');
                if (container) {
                  if (configUIInstance) configUIInstance.destroy();
                  configUIInstance = window.CodeFigConfigUI.render(msg.schema, {
                    container: container,
                    onChange: function () { /* Library-sent UI: no sync back to editor */ }
                  });
                  if (configCodeContainer) configCodeContainer.style.display = 'none';
                  container.style.display = 'flex';
                  if (scriptHasConfig) switchTab(scriptHasUIConfig ? 'configUI' : 'configCode');
                }
              } catch (e) { console.warn('CodeFigUI render failed', e); }
            }
            break;

          case 'INFO_PANEL_RESULTS':
            console.log('UI: Received INFO_PANEL_RESULTS message:', msg);
            displayInfoResults(msg);
            break;
            
          case 'INFO_PANEL_SUCCESS':
            console.log('UI: Received INFO_PANEL_SUCCESS message:', msg);
            // Only update if panel is currently open
            if (infoPanel.classList.contains('open')) {
              console.log('UI: Panel is open, showing success message');
              displayInfoResults(msg);
            } else {
              console.log('UI: Panel is closed, ignoring success message');
            }
            break;
            
          case 'PROGRESS_RESET':
            hideProgress();
            break;
            
          case 'PROGRESS_UPDATE':
            updateProgress(msg.operation, msg.processed, msg.total, msg.percentage);
            break;
            
          case 'PROGRESS_COMPLETE':
            hideProgress();
            break;

          case 'CODEFIG_RUN_COMPLETE':
            hideProgress();
            _codefigQueueFinishIfActive();
            break;

          case 'CONFIG_LOAD_RESULT':
            (function () {
              var data = msg.result || {};
              // Every silent run clears the flag itself, whatever it was for: a debounced preview
              // must not leave the next auto-import believing something is still in flight.
              silentRunInFlight = false;
              if (data.error) {
                debugError('A silent run failed: ' + data.error);
                return;
              }
              if (data.autoImport !== undefined) {
                if (data.autoImportSeq === autoImportSeq) {
                  applyFileModes(data.fileModes);
                  if (data.detectOnly) {
                    // Read-only half: point the panel at a grid if this address holds none, and
                    // otherwise leave everything exactly as the person left it — bar the modes, which
                    // are a view of the collection rather than something the person set here.
                    if (!offerGridGroup(data.autoImport)) {
                      var onProbe = orderConfigModesToFile();
                      setAutoImportNote(insertedModesNote(onProbe.added, onProbe.dropped));
                    }
                  } else {
                    // `applyAutoImport` writes the fill and the ordering as one text, so there is no
                    // separate ordering step here to race with it.
                    applyAutoImport(data.autoImport);
                  }
                }
                return;
              }
              // The mode table on its own — a panel opening on an address it did not change.
              if (data.fileModes !== undefined) {
                if (data.fileModesSeq === fileModesSeq) {
                  applyFileModes(data.fileModes);
                  var onTable = orderConfigModesToFile();
                  setAutoImportNote(insertedModesNote(onTable.added, onTable.dropped));
                }
                return;
              }
              if (data.preview !== undefined) {
                if (data.previewSeq === _previewSeq) {
                  renderConfigPreview(data.preview);
                  renderConfigSuggestions(data.suggestions);
                }
                return;
              }
              debugError('CONFIG_LOAD_RESULT with nothing this UI asked for: ' +
                Object.keys(data).join(', '));
            })();
            break;

          case 'COPY_TO_CLIPBOARD':
            _codefigCopyTextToClipboard(msg.text, msg.notifyMessage);
            break;

          case 'CONSOLE_FORWARD':
            (function () {
              const level = msg.level || 'log';
              const payload = msg.payload != null ? String(msg.payload) : '';
              const d = new Date();
              const pad = (n, len) => String(n).padStart(len || 2, '0');
              const localTs = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + '.' + pad(d.getMilliseconds(), 3);
              const line = '[' + localTs + '] [' + level.toUpperCase() + '] ' + payload + '\n';
              
              // Dev-only: a queued job reports this run's output back to the bridge.
              try { _codefigQueueCaptureLine(level, payload); } catch (_) {}

              // Capture CodeFig-related console output for the internal "last run" console.
              try {
                if (_codefigShouldCapture(payload)) {
                  _codefigAppendConsoleLine(level, payload);
                  updateInfoPanelButtonVisibility();
                  // If InfoPanel is open, keep it up to date live.
                  if (infoPanel && infoPanel.classList.contains('open')) {
                    _codefigRenderConsoleBlock();
                  }
                  // Auto-open on errors so the console is immediately visible
                  if (level === 'error' && infoPanel && !infoPanel.classList.contains('open')) {
                    toggleInfoPanel();
                    _codefigRenderConsoleBlock();
                  }
                }
              } catch (_) {}

              // Dev-only: forward to local console server (writes figma-console.log)
              _codefigBridgeFetch('', {
                method: 'POST',
                body: line,
                headers: { 'Content-Type': 'text/plain; charset=utf-8' }
              });
            })();
            break;
            
          case 'WINDOW_MEMORY_LOADED':
            console.log('📥 UI: Window memory loaded from backend:', msg);
            // Store the loaded memory and restore window size with minimal delay
            window._codefigWindowMemory = msg.memory;
            setTimeout(() => {
              restoreWindowSize();
            }, 10);
            break;
        }
      };

      // === PROGRESS INDICATOR & RUN SESSION ===

      var CODEFIG_RUN_INDETERMINATE_DELAY_MS = 2000;
      var codefigRunSession = {
        active: false,
        id: 0,
        mode: 'hidden',
        indeterminateTimer: null
      };

      function beginRunSession() {
        if (codefigRunSession.indeterminateTimer) {
          clearTimeout(codefigRunSession.indeterminateTimer);
          codefigRunSession.indeterminateTimer = null;
        }
        codefigRunSession.id += 1;
        var sessionId = codefigRunSession.id;
        codefigRunSession.active = true;
        codefigRunSession.mode = 'hidden';
        hideProgressBarOnly();
        codefigRunSession.indeterminateTimer = setTimeout(function () {
          if (!codefigRunSession.active || codefigRunSession.id !== sessionId) return;
          if (codefigRunSession.mode === 'determinate') return;
          showIndeterminateProgress('Running script…');
        }, CODEFIG_RUN_INDETERMINATE_DELAY_MS);
      }

      function endRunSession() {
        codefigRunSession.active = false;
        codefigRunSession.mode = 'hidden';
        if (codefigRunSession.indeterminateTimer) {
          clearTimeout(codefigRunSession.indeterminateTimer);
          codefigRunSession.indeterminateTimer = null;
        }
      }

      // ======================================================================
      // Dev-only: run jobs posted to the console bridge (`npm run test:figma`)
      // ======================================================================
      // Figma has no headless mode, so a real in-Figma run cannot be started from
      // outside Figma. This closes the loop the other way: the plugin polls a
      // localhost queue, runs what it is given, and posts the result back, so a
      // terminal command can drive a real run and get an exit code.
      //
      // This lives in the UI rather than the backend because the UI is already the
      // side that reaches localhost (console forwarding) and already the side that
      // dispatches RUN — no new plumbing, no extra network permission.
      //
      // Everything here is behind CODEFIG_BUILD_IS_DEV. The queue has no auth, so a
      // production build must never reach it; `build:production` also leaves
      // localhost out of the manifest, which stops the fetch at the platform level.
      var CODEFIG_JOB_POLL_MS = 1000;
      var CODEFIG_JOB_TIMEOUT_MS = 120000;
      /** Trailing console lines can arrive just after the completion message. */
      var CODEFIG_JOB_SETTLE_MS = 150;

      var codefigJob = { active: null, lines: [], firstError: null, timeoutTimer: null };

      /** Collect a run's console output while a queued job owns the plugin. */
      function _codefigQueueCaptureLine(level, payload) {
        if (!codefigJob.active) return;
        codefigJob.lines.push('[' + String(level).toUpperCase() + '] ' + payload);
        if (level === 'error' && !codefigJob.firstError) codefigJob.firstError = payload;
      }

      /** "Utility Scripts / Variable inspector (WIP)" -> "variable-inspector-wip" */
      function _codefigScriptSlug(text) {
        var last = String(text == null ? '' : text).split('/').pop();
        return last.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      }

      /**
       * Resolve a job's `script`. Tried in order: filename, full display name, the slug of
       * the display name's last segment, then a prefix match. A prefix match that hits more
       * than one script is reported as ambiguous rather than guessed at — picking one and
       * running it against a real document is not a coin worth flipping.
       *
       * Returns { script } or { error }.
       */
      function _codefigResolveJobScript(name) {
        var wanted = String(name == null ? '' : name).trim().toLowerCase();
        if (!wanted) return { error: 'The job did not name a script.' };
        var bare = wanted.replace(/\.js$/, '');
        var slug = _codefigScriptSlug(bare);
        var i, script;

        for (i = 0; i < allScripts.length; i++) {
          script = allScripts[i];
          var file = String(script.filename || '').toLowerCase().replace(/\.js$/, '');
          if (file && file === bare) return { script: script };
          if (String(script.name || '').toLowerCase() === wanted) return { script: script };
          if (_codefigScriptSlug(script.name) === slug) return { script: script };
        }

        var partial = [];
        for (i = 0; i < allScripts.length; i++) {
          script = allScripts[i];
          var fileSlug = _codefigScriptSlug(String(script.filename || '').replace(/\.js$/, ''));
          if (_codefigScriptSlug(script.name).indexOf(slug) === 0 || (fileSlug && fileSlug.indexOf(slug) === 0)) {
            partial.push(script);
          }
        }
        if (partial.length === 1) return { script: partial[0] };
        if (partial.length > 1) {
          return {
            error: '"' + name + '" matches ' + partial.length + ' scripts: ' +
              partial.map(function (s) { return s.filename || s.name; }).join(', ') +
              '. Use the exact filename.'
          };
        }

        // Nothing matched: say what is available rather than only what is not.
        var nearby = [];
        for (i = 0; i < allScripts.length && nearby.length < 6; i++) {
          var candidate = allScripts[i].filename || allScripts[i].name;
          if (_codefigScriptSlug(candidate).indexOf(slug.split('-')[0]) !== -1) nearby.push(candidate);
        }
        return {
          error: 'No script named "' + name + '" in this build (' + allScripts.length + ' loaded).' +
            (nearby.length ? ' Did you mean: ' + nearby.join(', ') + '?' : '') +
            ' Names are matched against the filename, e.g. "rename-styles".'
        };
      }

      function _codefigQueueReport(ok, error) {
        var job = codefigJob.active;
        if (!job) return;
        codefigJob.active = null;
        if (codefigJob.timeoutTimer) {
          clearTimeout(codefigJob.timeoutTimer);
          codefigJob.timeoutTimer = null;
        }
        var body = JSON.stringify({
          ok: ok === true,
          output: codefigJob.lines.join('\n'),
          error: error != null ? String(error) : null,
          buildId: CODEFIG_BUILD_ID
        });
        codefigJob.lines = [];
        codefigJob.firstError = null;
        _codefigBridgeFetch('/jobs/' + job.id + '/result', {
          method: 'POST',
          body: body,
          headers: { 'Content-Type': 'application/json' }
        });
      }

      /** Called on CODEFIG_RUN_COMPLETE. A run that logged an error counts as a failure. */
      function _codefigQueueFinishIfActive() {
        if (!codefigJob.active) return;
        setTimeout(function () {
          if (!codefigJob.active) return;
          _codefigQueueReport(!codefigJob.firstError, codefigJob.firstError);
        }, CODEFIG_JOB_SETTLE_MS);
      }

      function _codefigQueueStart(job) {
        codefigJob.active = job;
        codefigJob.lines = [];
        codefigJob.firstError = null;

        var code = job.code;
        if (!code) {
          var resolved = _codefigResolveJobScript(job.script);
          if (resolved.error) {
            _codefigQueueReport(false, resolved.error);
            return;
          }
          code = resolved.script.code;
        }

        // `--from-file` and `--config` arrive as a prelude: a `var` that the script's own
        // `typeof x !== 'undefined' ? x : {…}` guard picks up, so the literal below is
        // unreachable. With no flag there is no prelude and the source runs as written.
        if (job.args && typeof job.args.prelude === 'string' && job.args.prelude) {
          code = job.args.prelude + '\n' + code;
        }

        try {
          var resolved = processRuntimeImports(code);
          _codefigResetConsole();
          beginRunSession();
          post('RUN', { code: resolved });
        } catch (e) {
          _codefigQueueReport(false, 'Could not prepare the script: ' + (e && e.message ? e.message : String(e)));
          return;
        }

        codefigJob.timeoutTimer = setTimeout(function () {
          _codefigQueueReport(
            false,
            'No completion within ' + CODEFIG_JOB_TIMEOUT_MS + 'ms. A queued script must signal it is ' +
              'done — call window.codefigRunComplete(), or displayResults() from @InfoPanel, which does it for you.'
          );
        }, CODEFIG_JOB_TIMEOUT_MS);
      }

      // ======================================================================
      // UI COMMANDS FROM THE DEV BRIDGE
      //
      // Plan 12 made scripts runnable from a terminal. Everything it could not reach — button
      // state, the import path, panel refresh, the config editor — stayed reachable only by a
      // person clicking, which made that person the instrument. Five bugs this month lived there.
      //
      // Commands are **named, not evaluated**. Every case calls the same function the button
      // calls, so the channel drives the UI rather than a copy of it: a command that reimplemented
      // an action would pass while the button stayed broken, which is worse than no command.
      //
      // Dev only, through _codefigBridgeFetch like every other bridge call.
      // ======================================================================

      function _codefigUiCommandNames() {
        return ['selectScript', 'listScripts', 'readConfig', 'writeConfig', 'readInfoPanel',
          'readPreview', 'readTabs', 'readForm', 'switchTab', 'setField', 'clickControl',
          'readModeIntents', 'readAutoImport'];
      }

      /** Resolvers waiting for a form change to be folded into the config. */
      var _codefigUiSettleWaiters = [];

      function _codefigUiSettle() {
        if (_codefigUiSettleWaiters.length === 0) return;
        var waiters = _codefigUiSettleWaiters;
        _codefigUiSettleWaiters = [];
        waiters.forEach(function (resolve) { resolve('change'); });
      }

      /**
       * Do something to the form, then wait for it to land.
       *
       * The settle point is `syncUIToCode` finishing: a read straight after a write must not observe
       * the state before the change reached the config. The
       * frame fallback is for actions that change no value — clicking a tab inside a control moves
       * what is visible and fires no change.
       */
      function actAndSettle(action) {
        return new Promise(function (resolve, reject) {
          var settled = false;
          function finish(how) {
            if (settled) return;
            settled = true;
            resolve(how);
          }
          _codefigUiSettleWaiters.push(finish);
          try {
            action();
          } catch (e) {
            settled = true;
            reject(e);
            return;
          }
          if (typeof requestAnimationFrame === 'function') {
            requestAnimationFrame(function () {
              requestAnimationFrame(function () { finish('frame'); });
            });
          } else {
            setTimeout(function () { finish('frame'); }, 32);
          }
        });
      }

      /**
       * The element a named control uses, addressed by **field name and control identity only**.
       *
       * No selectors from outside. A selector channel is a short step from an eval channel, and it
       * would let a command act on something the UI does not regard as a control at all — including
       * Run, which must stay unreachable: a UI click would bypass the codefig-test filename guard
       * that `figma:run` carries, and that guard is the only thing standing between a command and
       * someone's real document.
       */
      function uiControlTarget(name, part, index) {
        var container = document.getElementById('configUIContainer');
        if (!container) throw new Error('The configuration form is not open');
        // **Coerced, not trusted, and never silently zero.** `index=1` arrives from the CLI as the
        // string "1", and `typeof index === 'number'` sent it to index 0 — so a verification run
        // renamed the wrong chip and read as a pass. On a `chip-remove` that would remove the wrong
        // mode, and that one reaches the document at Run. A value that is present and not a number is
        // refused rather than defaulted.
        var at = 0;
        if (index !== undefined && index !== null && index !== '') {
          at = Number(index);
          if (!isFinite(at) || at < 0 || Math.floor(at) !== at) {
            throw new Error('index must be a whole number, got "' + index + '"');
          }
        }

        // A suggestion card, addressed by position in the list the panel is showing. `name` is the
        // section rather than a field, because the cards belong to no field — they *offer* values to
        // one. A click applies margin and gap to the mode on screen and writes nothing else.
        if (name === 'suggestions') {
          var cards = container.querySelectorAll('.grid-suggestion');
          return cards[at] || null;
        }

        // **Chips first, and by their own part names.** The chips and the tabbed rows control are
        // both named `modes` — deliberately, because the chips are a view of that same array — so the
        // rows branch below matched first and the chips were unreachable from outside. `chip-`
        // prefixed parts say which of the two controls is meant, rather than adding a second argument
        // that would have to be remembered.
        var chips = container.querySelector('[data-chips-field="' + name + '"]');
        if (chips && String(part || '').indexOf('chip') === 0) {
          var chipList = chips.querySelectorAll('.config-ui-chip');
          if (part === 'chip-add') return chips.querySelector('.config-ui-chip-add');
          if (part === 'chip-input') return chips.querySelector('.config-ui-chip-input');
          if (part === 'chip-remove') {
            return chipList[at] ? chipList[at].querySelector('.config-ui-chip-remove') : null;
          }
          // `chip` and `chip-label`: the label, which is the rename affordance.
          return chipList[at] ? chipList[at].querySelector('.config-ui-chip-label') : null;
        }

        var rows = container.querySelector('[data-rows-field="' + name + '"]');
        if (rows) {
          var items = rows.querySelectorAll('.config-ui-rows-item');
          if (part === 'add') return rows.querySelector('.config-ui-rows-add');
          if (part === 'remove') {
            return items[at] ? items[at].querySelector('.config-ui-rows-remove') : null;
          }
          if (part === 'tab') {
            var tabs = rows.querySelectorAll('.config-ui-rows-tab');
            return tabs[at] || null;
          }
          if (part) {
            // **`cellKey:inner` — the cell, then the thing inside it that has no address of its own.**
            // A radio group and a curve editor both carry the cell's `data-row-field` on a *wrapper*, so
            // an address stops at the wrapper and `target.value = 'bezier'` on a `<div>` is a no-op that
            // reports success. That is the failure this whole tool exists to stop, one layer in from the
            // flat radio it already handled — and it made every `scaleType` in Spacing, Corner radius and
            // Typography undrivable from the terminal.
            //
            // Resolved here rather than in `setField` because addressing lives in one place: a command
            // that can build its own selector is a short step from one that can reach Run.
            var colon = part.indexOf(':');
            var cellKey = colon === -1 ? part : part.slice(0, colon);
            var inner = colon === -1 ? '' : part.slice(colon + 1);
            var cell = items[at] ? items[at].querySelector('[data-row-field="' + cellKey + '"]') : null;
            if (!cell || !inner) return cell;
            // The curve editor's coordinate field — the paste path a person uses, so setting a curve from
            // the terminal exercises the parse and the redraw rather than going round them.
            if (inner === 'text') return cell.querySelector('.config-ui-curve__text');
            // The editor's two buttons. Named suffixes rather than a free-form selector, for the reason the
            // whole addressing scheme exists — and without them the shape toggle was the one part of this
            // control that could not be driven, and therefore the one part that could not be verified.
            if (inner === 'shape') return cell.querySelector('.config-ui-curve__toggle--shape');
            if (inner === 'middle') {
              var buttons = cell.querySelectorAll('.config-ui-curve__toggle');
              for (var b = 0; b < buttons.length; b++) {
                if (!buttons[b].classList.contains('config-ui-curve__toggle--shape')) return buttons[b];
              }
              return null;
            }
            var options = cell.querySelectorAll('input[type="radio"]');
            for (var o = 0; o < options.length; o++) {
              if (options[o].value === inner) return options[o];
            }
            return null;
          }
          return null;
        }

        var picker = container.querySelector('[data-collection-field="' + name + '"]');
        if (picker) {
          if (part === 'new') return picker.querySelector('.config-ui-collection-new');
          return picker.querySelector('.config-ui-collection-select');
        }

        var modePicker = container.querySelector('[data-mode-field="' + name + '"]');
        if (modePicker) {
          if (part === 'new') return modePicker.querySelector('.config-ui-mode-new');
          return modePicker.querySelector('.config-ui-mode-select');
        }

        var flat = container.querySelectorAll('[data-field="' + name + '"]');
        if (flat.length === 0) return null;
        if (flat.length === 1) return flat[0];
        // A radio group, or a multiselect's checkboxes: the part names the option.
        for (var i = 0; i < flat.length; i++) {
          if (flat[i].value === part) return flat[i];
        }
        return flat[0];
      }

      /**
       * Run one named UI command. Returns a promise of its answer.
       * Throws on an unknown name — a channel that silently ignored one would report success.
       */
      function handleUiCommand(command, args) {
        var a = args || {};
        switch (command) {
          case 'listScripts':
            return Promise.resolve(allScripts.map(function (s) {
              return { name: s.name, type: s.type };
            }));

          case 'selectScript': {
            if (!a.name) throw new Error('selectScript needs { name }');
            var found = allScripts.filter(function (s) { return s.name === a.name; })[0];
            if (!found) {
              // Same forgiveness the CLI gives, and the same refusal to guess between two.
              var matches = allScripts.filter(function (s) {
                return s.name.toLowerCase().indexOf(String(a.name).toLowerCase()) !== -1;
              });
              if (matches.length === 1) found = matches[0];
              else if (matches.length > 1) {
                throw new Error('"' + a.name + '" matches ' + matches.length + ' scripts: ' +
                  matches.map(function (s) { return s.name; }).join(', '));
              }
            }
            if (!found) throw new Error('No script named "' + a.name + '"');
            selectScriptDirectly(found);
            return Promise.resolve({ name: found.name, tab: currentTab });
          }

          case 'readConfig':
            return Promise.resolve({
              text: currentConfigBlock(),
              hasUiConfig: !!scriptHasUIConfig,
              script: currentScript ? currentScript.name : null
            });

          case 'writeConfig': {
            if (typeof a.text !== 'string') throw new Error('writeConfig needs { text }');
            if (!configEditor) throw new Error('The configuration editor is not open');
            // Form scripts used to be refused here, which slice 1 made wrong: both tabs are now
            // editable views of one config, and the block text is the canonical one. Writing it and
            // re-projecting is exactly what typing into Configuration code does.
            var previousTab = currentTab;
            // Always through Configuration code: that is the view whose content the merge takes,
            // and writing the canonical text is what this command means.
            if (currentTab !== 'configCode') switchTab('configCode');
            configEditor.setValue(a.text);
            mergeConfigIntoMain();
            if (scriptHasUIConfig) projectConfigIntoForm();
            if (isConfigTab(previousTab)) switchTab(previousTab);
            return Promise.resolve({ text: currentConfigBlock() });
          }

          case 'readInfoPanel':
            // innerText, not innerHTML: the questions worth asking here are about content, and
            // markup assertions would break on a style change.
            return Promise.resolve({
              title: (document.querySelector('.info-title') || {}).textContent || null,
              text: infoContent ? infoContent.innerText : '',
              open: !!(infoPanel && infoPanel.classList.contains('open')),
              showingResultsFrom: _infoPanelScript
            });

          case 'readPreview': {
            // Two places a preview can live, and the answer must not depend on knowing which. A
            // `@preview` marker row puts it **inside the form**, and the panel-level region is hidden
            // in that case — so reading only the region reported "visible: false, text: ''" for a
            // preview that was on screen. A reporting gap reads exactly like a broken preview.
            // Both halves. The preview and the suggestions are computed by one silent run from one
            // config, so reading one without the other invites the conclusion that the missing one is
            // broken — which is exactly what "suggestions block present: False" meant a moment ago,
            // when the section was on screen and this command simply did not look at it.
            var suggestSlot = document.querySelector('[data-suggestions-slot]');
            var suggestions = suggestSlot ? {
              visible: !!suggestSlot.innerHTML,
              cards: [].map.call(suggestSlot.querySelectorAll('.grid-suggestion'), function (card) {
                return {
                  margin: Number(card.getAttribute('data-suggestion-margin')),
                  gap: Number(card.getAttribute('data-suggestion-gap')),
                  selected: card.classList.contains('is-selected'),
                  badges: [].map.call(card.querySelectorAll('.grid-suggestion-badge'), function (b) {
                    return b.textContent;
                  }),
                  text: card.innerText || ''
                };
              }),
              note: (suggestSlot.querySelector('.grid-suggestions-more') ||
                suggestSlot.querySelector('.grid-suggestions-empty') || {}).textContent || null,
              // **The slot is the second computed section, not "the cards".** Grid fills it with clickable
              // suggestions; Typography fills it with its Overview table. Reading only cards reported
              // `visible: true, cards: []` for a section holding ten rows of numbers — which reads exactly
              // like a section that computed nothing. Same gap as the one the comment above describes,
              // one section along.
              text: suggestSlot.innerText || ''
            } : null;

            // **Every slot, not the first one.** The same reporting gap as the two above, one level along:
            // `@preview` can be a *column* of a `@blocks` control, so there is a slot per row plus the
            // section-level one — and reading only the first reported an empty preview whenever the first
            // happened to be the panel-wide slot, which in HSL mode holds nothing. That is precisely how the
            // colour strips looked broken from here while they were on screen, and how they looked fine from
            // here while they were empty.
            var slots = [].slice.call(document.querySelectorAll('[data-preview-slot]'));
            if (slots.length) {
              var reported = slots.map(function (one) {
                return {
                  key: one.hasAttribute('data-preview-row')
                    ? one.getAttribute('data-preview-row') : '__panel__',
                  name: one.getAttribute('data-preview-name') || null,
                  visible: !!one.innerHTML,
                  cards: one.querySelectorAll('.color-ramp-preview-card').length,
                  text: one.innerText || ''
                };
              });
              return Promise.resolve({
                // True when *anything* rendered, so a panel with one empty slot and one full one does not
                // report itself as blank.
                visible: reported.some(function (one) { return one.visible; }),
                where: 'form',
                slots: reported,
                text: reported.map(function (one) { return one.text; }).filter(Boolean).join('\n'),
                suggestions: suggestions
              });
            }
            var body = document.getElementById('configPreviewBody');
            var region = document.getElementById('configPreview');
            return Promise.resolve({
              visible: !!(region && region.style.display !== 'none'),
              where: 'panel',
              text: body ? body.innerText : '',
              suggestions: suggestions
            });
          }

          case 'switchTab': {
            // Calls the function the tab button calls, so the command drives the UI rather than a
            // copy of it. Refuses a name no button offers: silently doing nothing would report
            // success and leave a verifier reading the wrong pane.
            var wanted = a.name;
            var offered = [];
            [].forEach.call(document.querySelectorAll('.editor-tab'), function (btn) {
              if (btn.style.display !== 'none') offered.push(btn.getAttribute('data-tab'));
            });
            if (offered.indexOf(wanted) === -1) {
              throw new Error('No tab "' + wanted + '" for this script. Offered: ' + offered.join(', '));
            }
            switchTab(wanted);
            return Promise.resolve({ current: currentTab });
          }

          case 'setField': {
            if (!a.name) throw new Error('setField needs { name }');
            var target = uiControlTarget(a.name, a.part, a.index);
            if (!target) {
              throw new Error('No control named "' + a.name + '"' +
                (a.part ? ' part "' + a.part + '"' : ''));
            }
            // **A chip rename is three events, not one.** Click the label, type, press Enter — which is
            // what a person does, and the only path that exercises the listeners that matter. Setting
            // a value and firing `change` would pass on a control that could not rename at all.
            if (String(a.part || '').indexOf('chip') === 0) {
              return actAndSettle(function () {
                // **A chip edit is three events, not one.** Open the input — by clicking the label to
                // rename, or the plus to add — then type, then press Enter. That is what a person
                // does, and the only path that exercises the listeners that matter: setting a value
                // and firing `change` would pass on a control that could not rename at all.
                target.dispatchEvent(new Event('click', { bubbles: true }));
                // Through `uiControlTarget` like every other address, not a selector of its own:
                // addressing lives in one place, and a command that can build its own selector is a
                // short step from one that can reach Run.
                var editor = uiControlTarget(a.name, 'chip-input', a.index);
                if (!editor) throw new Error('That chip gesture opened no input');
                editor.value = a.value == null ? '' : String(a.value);
                editor.dispatchEvent(new Event('input', { bubbles: true }));
                var enter = new KeyboardEvent('keydown', { key: 'Enter', bubbles: true });
                editor.dispatchEvent(enter);
              }).then(function (how) {
                return { settled: how, text: currentConfigBlock() };
              });
            }

            // **A radio group inside a `@rows` cell.** The *cell* carries `data-row-field`, so an address
            // lands on the group wrapper and the input a person actually clicks has no address at all —
            // `target.value = 'bezier'` on a `<div>` is a no-op that reports success. That is the exact
            // failure this tool exists to stop, one layer further in than the flat radio it already
            // handles, and it made every `scaleType` in Spacing, Corner radius and Typography
            // undrivable from the terminal.
            var rowRadioOption = null;
            if (target.getAttribute && target.getAttribute('data-row-radio') && a.value != null) {
              rowRadioOption = uiControlTarget(a.name, a.part + ':' + String(a.value), a.index);
              if (!rowRadioOption) {
                throw new Error('"' + a.name + '" cell "' + a.part + '" has no option called "' +
                  String(a.value) + '"');
              }
              target = rowRadioOption;
            }

            // **A curve cell** takes coordinates through its own text field, which is the paste path a
            // person uses — so the parse and the redraw are exercised rather than bypassed. Assigning to
            // the wrapper would set an attribute nothing reads back.
            if (target.getAttribute && target.getAttribute('data-curve-value') !== null) {
              var coords = uiControlTarget(a.name, a.part + ':text', a.index);
              if (!coords) throw new Error('That curve control has no coordinate field');
              target = coords;
            }

            var tag = target.tagName.toLowerCase();

            // **A name that is not in a picker's list is two events, not one.** Choose "New
            // collection" / "New mode", then type. Assigning a value a `<select>` has no option for
