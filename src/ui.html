<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/default.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/midnight.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <!-- INLINE_MARKED -->
    <!-- CodeFigUI CSS lives in src/ui.css (section 9), not here -->
    <style id="config-ui-css">/* Placeholder - actual styles in src/ui.css */</style>
    <script id="config-ui-stub">
      (function () {
        var g =
          (typeof self !== "undefined" && self) ||
          (typeof window !== "undefined" && window) ||
          (typeof global !== "undefined" && global) ||
          this;
        if (!g) return;
        g.CodeFigConfigUI = {
          parse: function () { return { rows: [] }; },
          serialize: function () { return ""; },
          render: function (schema, opts) {
            var c = opts && opts.container;
            if (c) {
              c.innerHTML = '<div class="config-ui-empty">CodeFigUI failed to load. Check figma-console.log for errors.</div>';
            }
            return {
              getValues: function () { return {}; },
              setValues: function () {},
              destroy: function () {}
            };
          }
        };
      })();
    </script>
    <script id="bezier-js">/* generated at build time from scripts/CODEFIG_LIBRARIES/@bezier.js - do not edit */</script>
    <script id="config-ui-js">/* generated at build time from src/config-ui/ - do not edit */</script>
    <script id="import-resolver-js">/* generated at build time from src/import-resolver.js - do not edit */</script>
    <style id="app-css">/* generated at build time from src/ui.css - do not edit */</style>
  </head>
  <body>
    <div class="resizable-container">
      <!-- Window resize handle (corner only) -->
      <div class="resize-handle resize-handle-corner" id="resizeHandleCorner"></div>
      <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
          <div class="sidebar-header">
            <div class="search-container">
              <input type="text" id="searchInput" class="search-input" placeholder="Search..." title="Search scripts (⌘/)">
            </div>
          </div>
          <div class="script-list" id="scriptList">
            <!-- Scripts will be populated here -->
          </div>
        </div>
        
        <!-- Resizer -->
        <div class="resizer" id="resizer"></div>
        
        <!-- Main Content -->
        <div class="main-content">
          <div class="editor-header">
            <div class="header-left">
              <div class="script-title" id="scriptTitle">Select a script</div>
              <div class="script-status" id="scriptStatus">Ready</div>
            </div>
            <div class="header-right">
              <div class="button-group">
                <button class="icon-btn" id="infoPanelBtn" title="Results & Information">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <polyline points="14,2 14,8 20,8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>
              <div class="action-buttons">
                <button class="btn danger" id="deleteBtn" disabled title="Delete script">Delete</button>
                <button class="btn primary" id="runBtn" title="Run script (⌘R)">Run</button>
              </div>
            </div>
          </div>
          
          <div class="editor-tabs" id="editorTabs">
            <button class="editor-tab" data-tab="configUI" type="button">Configuration UI</button>
            <button class="editor-tab" data-tab="configCode" type="button">Configuration code</button>
            <button class="editor-tab" data-tab="docs" type="button">Documentation</button>
            <button class="editor-tab active" data-tab="source" type="button">Source code</button>
          </div>
          
          <div class="editor-container">
            <div class="tab-content" id="tabDocs">
              <div id="docsRenderer" class="docs-rendered"></div>
            </div>
            <div class="tab-content" id="tabConfigUI">
              <div class="config-stale-note" id="configStaleNote" style="display: none;"></div>
              <div class="config-ui-container" id="configUIContainer" style="display: none;">
                <!-- Rendered when script uses // @UI_CONFIG_START … // @UI_CONFIG_END -->
              </div>
              <div class="config-no-form" id="configNoForm" style="display: none;"></div>
            </div>
            <div class="tab-content" id="tabConfigCode">
              <div class="config-code-container" id="configCodeContainer">
                <textarea id="codeConfig" placeholder="// Configuration section"></textarea>
              </div>
            </div>
            <!-- Moved into whichever config tab is active: it belongs beside the thing you edit,
                 and there is one of it. Rendered when the script declares // @PREVIEW: <fn>. -->
            <div class="config-preview" id="configPreview" style="display: none;">
              <div class="config-preview-title">Preview</div>
              <div class="config-preview-body" id="configPreviewBody"></div>
            </div>
            <div class="tab-content active" id="tabSource">
              <textarea id="code" placeholder="// Select a script from the sidebar or create a new one"></textarea>
            </div>
            
            <!-- Info Panel -->
            <div class="info-panel" id="infoPanel">
              <div class="info-panel-scroll">
                <div class="info-header">
                  <span class="info-title">Results & Information</span>
                </div>
                <div class="info-filtering" id="infoFiltering">
                  <!-- Filtering controls will be added here later -->
                </div>
                <div class="info-list" id="infoContent">
                  <div class="info-placeholder">
                    <p>No results yet. Run a script to see information here.</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>           

      <!-- Progress Indicator -->
      <div class="progress-indicator" id="progressIndicator" style="display: none;">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">Processing...</div>
      </div>
      
      <!-- Footer outside main container for full width -->
      <div class="plugin-footer">
        <div class="footer-left">
          <button class="btn secondary" id="newScript" title="Create new script (⌘N)">New script</button>
          <button type="button" class="bmc-btn" id="buyMeACoffeeBtn" title="Support CodeFig on Buy Me a Coffee (opens in browser)" aria-label="Buy me a coffee">
            <!-- INLINE_BMC_SVG -->
          </button>
        </div>
        <div class="footer-right">
          <button class="btn secondary" id="exportBtn" title="Export current script (⌘E)">Export script</button>
          <button class="btn secondary" id="exportAllBtn" title="Export all user scripts">Export all user scripts</button>
          <button class="btn secondary" id="importBtn" title="Import script (⌘I)">Import script</button>
        </div>
      </div>
    </div>

    <script>
      // Build flag injected by `build-scripts.js` (dev build allows localhost console forwarding)
      // In source it stays a string placeholder; build replaces it with "true"/"false".
      var CODEFIG_BUILD_IS_DEV = "__CODEFIG_BUILD_IS_DEV__" === "true";
      // Which build this running plugin came from. Reported with job results so the CLI can
      // say "reload the plugin" instead of leaving you to guess why an import vanished.
      var CODEFIG_BUILD_ID = "__CODEFIG_BUILD_ID__";

      // === Dev bridge (figma-console-server.js) ===
      // The ONE place this UI reaches localhost. Everything dev-only — console forwarding
      // and the job queue — goes through here, so the guard is in a single auditable spot
      // and tests/ui-dev-guard.test.js can assert no ungated path exists. A production
      // build also has no localhost entry in its manifest, so Figma blocks it regardless.
      var CODEFIG_BRIDGE_ORIGIN = 'http://localhost:8765';

      function _codefigBridgeFetch(pathname, options) {
        if (!CODEFIG_BUILD_IS_DEV) return Promise.resolve(null);
        try {
          return fetch(CODEFIG_BRIDGE_ORIGIN + (pathname || ''), options).catch(function () { return null; });
        } catch (e) {
          return Promise.resolve(null);
        }
      }

      /**
       * Tell the dev bridge this window exists, and which build it is running.
       *
       * **Figma cannot reload a plugin from outside it**, so a dev loop is: build, somebody clicks
       * reload, verify. The middle step used to be found by *asking* — `figma-sync` queued a UI
       * command and waited for this iframe to poll for it, and a backgrounded Figma throttles that
       * poll to about once a minute. A one-second reload was reported minutes later, which is long
       * enough that the loop was not worth using.
       *
       * Announcing inverts it: the news travels the moment the window opens, before anything can be
       * asked of it. Fire and forget — `_codefigBridgeFetch` is a no-op outside dev builds and
       * swallows a bridge that is not running, which is the normal case.
       */
      _codefigBridgeFetch('/hello', {
        method: 'POST',
        body: JSON.stringify({ buildId: CODEFIG_BUILD_ID }),
        headers: { 'Content-Type': 'application/json' }
      });

      // === UI debug: send to backend (shows in figma-console.log when npm run dev) ===
      var DEBUG_UI = false; // Set true for verbose logging; errors always forwarded
      function uiDebugLog() {
        const args = Array.prototype.slice.call(arguments);
        const message = args.map(function(a) {
          if (typeof a === 'object') try { return JSON.stringify(a); } catch(e) { return String(a); }
          return String(a);
        }).join(' ');
        if (!DEBUG_UI && message.indexOf('ERROR') === -1 && message.indexOf('error') === -1) return;
        try {
          if (window.parent && window.parent.postMessage) {
            window.parent.postMessage({ pluginMessage: { type: 'UI_DEBUG', message: message } }, '*');
          }
        } catch (e) {}
        _codefigBridgeFetch('', {
          method: 'POST',
          body: '[UI] ' + message + '\n',
          headers: { 'Content-Type': 'text/plain; charset=utf-8' }
        });
      }
      window.onerror = function(msg, url, line, col, err) {
        uiDebugLog('window.onerror:', msg, 'at', line + ':' + col, err ? err.stack : '');
        try {
          const payload = String(msg || 'Unknown UI error') + (err && err.stack ? '\n' + err.stack : '');
          _codefigAppendConsoleLine('error', '[UI] ' + payload);
          // Keep InfoPanel button visible when errors exist
          updateInfoPanelButtonVisibility();
          _codefigRenderConsoleBlock();
        } catch (_) {}
        return false;
      };
      window.onunhandledrejection = function (event) {
        try {
          const reason = event && event.reason;
          let payload = '';
          if (reason instanceof Error) payload = reason.name + ': ' + reason.message + (reason.stack ? '\n' + reason.stack : '');
          else payload = reason != null ? String(reason) : 'Unknown rejection reason';
          _codefigAppendConsoleLine('error', '[UI] Unhandled rejection: ' + payload);
          updateInfoPanelButtonVisibility();
          _codefigRenderConsoleBlock();
        } catch (_) {}
      };

      // === Internal "Error console" (last run) ===
      var _codefigLastRunConsole = [];
      var _codefigLastRunMaxLines = 2000;
      var _codefigConsoleDirty = false;

      function _codefigFormatTs(d) {
        try {
          const pad = (n, len) => String(n).padStart(len || 2, '0');
          return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + '.' + pad(d.getMilliseconds(), 3);
        } catch (_) {
          return '';
        }
      }

      function _codefigAppendConsoleLine(level, text) {
        const safeLevel = (level === 'error' || level === 'warn' || level === 'log') ? level : 'log';
        const line = {
          ts: Date.now(),
          level: safeLevel,
          text: text != null ? String(text) : ''
        };
        _codefigLastRunConsole.push(line);
        if (_codefigLastRunConsole.length > _codefigLastRunMaxLines) {
          _codefigLastRunConsole.splice(0, _codefigLastRunConsole.length - _codefigLastRunMaxLines);
        }
        _codefigConsoleDirty = true;
      }

      function _codefigResetConsole(opts) {
        var closePanel = !!(opts && opts.closePanel);
        _codefigLastRunConsole = [];
        _codefigConsoleDirty = true;
        // Keep the InfoPanel button visible if errors exist; after reset, visibility may change.
        try { updateInfoPanelButtonVisibility(); } catch (_) {}
        _codefigRenderConsoleBlock();
        if (closePanel) {
          try {
            if (typeof infoPanelOpen !== 'undefined' && infoPanelOpen) {
              toggleInfoPanel();
            }
          } catch (_) {}
        }
      }

      function _codefigShouldCapture(payload) {
        const s = payload != null ? String(payload) : '';
        // Script logs are already tagged by backend as "[Script]"
        if (s.indexOf('[Script]') !== -1) return true;
        // Backend errors are prefixed with "CodeFig:" and/or "Backend:"
        if (s.indexOf('CodeFig:') !== -1) return true;
        if (s.indexOf('Backend:') !== -1) return true;
        // UI debug helper prefixes with [UI]
        if (s.indexOf('[UI]') !== -1) return true;
        return false;
      }

      function _codefigGetConsoleText() {
        return _codefigLastRunConsole.map(function (l) {
          const d = new Date(l.ts);
          return '[' + _codefigFormatTs(d) + '] [' + String(l.level || 'log').toUpperCase() + '] ' + (l.text || '');
        }).join('\n');
      }

      function _codefigCopyTextToClipboard(text, notifyMessage) {
        if (!text) return;
        var notify = notifyMessage || 'Copied to clipboard';
        if (navigator && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text)
            .then(function () {
              try { post('NOTIFY', { message: notify }); } catch (_) {}
            })
            .catch(function () {});
          return;
        }
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', 'true');
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          ta.style.top = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          try { post('NOTIFY', { message: notify }); } catch (_) {}
        } catch (_) {}
      }

      function _codefigCopyConsoleToClipboard() {
        _codefigCopyTextToClipboard(_codefigGetConsoleText());
      }

      function _codefigEnsureConsoleContainer() {
        if (!infoContent) return null;
        let container = document.getElementById('codefigConsoleBlock');
        if (container) return container;
        container = document.createElement('div');
        container.id = 'codefigConsoleBlock';
        container.className = 'codefig-console-block';
        // Insert at top, before any other info content
        if (infoContent.firstChild) infoContent.insertBefore(container, infoContent.firstChild);
        else infoContent.appendChild(container);
        return container;
      }

      function _codefigEscapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function _codefigRenderConsoleBlock() {
        if (!infoContent) return;
        const container = _codefigEnsureConsoleContainer();
        if (!container) return;

        const lines = _codefigLastRunConsole.slice();
        const errorCount = lines.filter(function (l) { return l.level === 'error'; }).length;
        const warnCount = lines.filter(function (l) { return l.level === 'warn'; }).length;
        const total = lines.length;

        // **Errors and warnings only.** This block is where you find out something went wrong; a run that
        // went fine has nothing to say here, and filling it with a summary of what happened buried the one
        // case it exists for. Márton: *"it should be reserved for errors, not for general log — I don't
        // need a general log."* The lines are still captured and still reach the dev bridge, which is where
        // a full trace belongs.
        if (!errorCount && !warnCount) {
          container.style.display = 'none';
          container.innerHTML = '';
          return;
        }

        container.style.display = 'block';

        const titleBits = [];
        if (errorCount) titleBits.push(errorCount + ' error' + (errorCount === 1 ? '' : 's'));
        if (warnCount) titleBits.push(warnCount + ' warning' + (warnCount === 1 ? '' : 's'));
        if (!titleBits.length) titleBits.push(total + ' message' + (total === 1 ? '' : 's'));

        var consoleTitle = 'Script log';
        if (errorCount) {
          consoleTitle = 'Script error' + (errorCount === 1 ? '' : 's');
        } else if (warnCount) {
          consoleTitle = 'Script warning' + (warnCount === 1 ? '' : 's');
        }

        const header = [
          '<div class="codefig-console-header">',
            '<div class="codefig-console-title">' + consoleTitle + '</div>',
            '<div class="codefig-console-meta">' + titleBits.join(' · ') + '</div>',
            '<div class="codefig-console-actions">',
              '<button type="button" class="btn secondary codefig-console-btn" id="codefigConsoleCopyBtn" title="Copy to console">Copy to console</button>',
              '<button type="button" class="btn secondary codefig-console-btn" id="codefigConsoleClearBtn" title="Clear log">Clear log</button>',
            '</div>',
          '</div>'
        ].join('');

        var htmlLines = '';
        for (var i = 0; i < lines.length; i++) {
          var l = lines[i];
          var ts = _codefigFormatTs(new Date(l.ts));
          var lvl = String(l.level || 'log');
          var txt = _codefigEscapeHtml(l.text || '');
          htmlLines += '<div class="codefig-console-line codefig-console-line--' + lvl + '">'
            + '<span class="codefig-console-line__ts">[' + _codefigEscapeHtml(ts) + ']</span> '
            + '<span class="codefig-console-line__lvl">[' + _codefigEscapeHtml(lvl.toUpperCase()) + ']</span> '
            + '<span class="codefig-console-line__msg">' + txt.replace(/\n/g, '<br>') + '</span>'
            + '</div>';
        }

        const body = '<div class="codefig-console-body" id="codefigConsoleBody">' + htmlLines + '</div>';
        container.innerHTML = header + body;

        const copyBtn = document.getElementById('codefigConsoleCopyBtn');
        if (copyBtn) copyBtn.onclick = _codefigCopyConsoleToClipboard;
        const clearBtn = document.getElementById('codefigConsoleClearBtn');
        if (clearBtn) clearBtn.onclick = function () { _codefigResetConsole({ closePanel: true }); };

        _codefigConsoleDirty = false;
      }

      // Help scripts will be populated by the build process from HELP folder

      // Pre-built scripts
      // Prebuilt scripts will be loaded from backend at runtime
      let prebuiltScripts = [];
      uiDebugLog('Main script block started');

      // State
      let currentScript = null;
      let userScripts = [];
      let allScripts = [];
      let userGroups = new Map(); // Map of groupName -> {scripts: [], collapsed: false}
      let originalCode = '';
      let isResizing = false;
      let startX, startWidth; // Global scope for resizing
      let autosaveTimeout = null; // For debounced autosave
      let collapsedSections = new Set(); // Track collapsed sections
      let pendingBatchImportSummary = null; // { skipped, invalid } for import batch notifications
      
      // Window resizing state
      let isWindowResizing = false;
      let resizeType = null; // 'width', 'height', or 'both'
      let startWindowX, startWindowY, startWindowWidth, startWindowHeight;
      let lastResizeTime = 0;
      
      // Window memory state
      let windowMemory = {
        width: 1000,
        height: 600,
        x: 100,
        y: 100,
        displayWidth: window.screen.width,
        displayHeight: window.screen.height
      };

      // DOM elements
      const scriptList = document.getElementById('scriptList');
      const scriptTitle = document.getElementById('scriptTitle');
      const scriptStatus = document.getElementById('scriptStatus');
      const codeTextarea = document.getElementById('code');
      const codeConfigTextarea = document.getElementById('codeConfig');
      const editorTabsEl = document.getElementById('editorTabs');
      const tabSourceEl = document.getElementById('tabSource');
      const tabConfigUIEl = document.getElementById('tabConfigUI');
      const tabConfigCodeEl = document.getElementById('tabConfigCode');
      const tabDocsEl = document.getElementById('tabDocs');
      // Kept as an alias so the older references below keep meaning "a config tab is showing".
      const tabConfigEl = tabConfigUIEl;
      const docsRendererEl = document.getElementById('docsRenderer');
      const buyMeACoffeeBtn = document.getElementById('buyMeACoffeeBtn');
      const newScriptBtn = document.getElementById('newScript');
      const runBtn = document.getElementById('runBtn');
      const deleteBtn = document.getElementById('deleteBtn');
      const exportBtn = document.getElementById('exportBtn');
      const importBtn = document.getElementById('importBtn');
      const infoPanelBtn = document.getElementById('infoPanelBtn');
      const infoPanel = document.getElementById('infoPanel');
      const infoContent = document.getElementById('infoContent');
      const exportAllBtn = document.getElementById('exportAllBtn');
      const resizer = document.getElementById('resizer');
      const sidebar = document.getElementById('sidebar');
      const searchInput = document.getElementById('searchInput');
      
      // Window resize handle (corner only)
      const resizeHandleCorner = document.getElementById('resizeHandleCorner');

      // Initialize CodeMirror (main script editor)
      const code = CodeMirror.fromTextArea(codeTextarea, {
        mode: 'javascript',
        theme: 'default',
        lineNumbers: true,
        indentUnit: 2,
        tabSize: 2,
        lineWrapping: true,
        autoCloseBrackets: true,
        matchBrackets: true,
        foldGutter: true,
        gutters: ['CodeMirror-linenumbers', 'CodeMirror-foldgutter'],
        scrollbarStyle: 'native'
      });

      // Initialize CodeMirror for config tab
      let configEditor = null;
      if (codeConfigTextarea) {
        configEditor = CodeMirror.fromTextArea(codeConfigTextarea, {
          mode: 'javascript',
          theme: 'default',
          lineNumbers: true,
          indentUnit: 2,
          tabSize: 2,
          lineWrapping: true,
          autoCloseBrackets: true,
          matchBrackets: true,
          gutters: ['CodeMirror-linenumbers'],
          scrollbarStyle: 'native'
        });
      }

      let configUIInstance = null;
      /** The values as last seen, so a change can be attributed to a field. */
      /**
       * The Collection and Group the form was last seen holding, and nothing else.
       *
       * This was `configLastValues`, a whole copy of the form's values doing two jobs — address detection
       * and last-values-seen — and a third was then assumed of it by a check that wanted "the values at
       * projection time". It is not that: it is reassigned on every change, *before* the change is handled.
       * One variable, one job, and the name says which.
       */
      let configLastAddress = null;
      const configCodeContainer = document.getElementById('configCodeContainer');
      const configUIContainer = document.getElementById('configUIContainer');

      // ======================================================================
      // MODE CHIPS — panel session state
      //
      // A chip is a 1:1 view of a Figma mode, and this is the only place a `modeId` lives in the UI.
      // Ids never travel in a config: they are file-specific, and a config is something you paste
      // between files. So the panel remembers which chip came from which mode, and a run is told.
      //
      // Two things held, and the difference matters:
      //   `fileModes`   — facts, re-read whenever the address changes.
      //   `chipModeIds` — parallel to the config's `modes` array; `null` where a mode is not in the
      //                   file yet. Transformed by the same operation that transforms the array, so
      //                   the two cannot drift apart.
      //   `removedModeIds` / `addedModeNames` — the **only remembered intents** in the feature.
      //                   Everything else is derived. They exist because state cannot answer either
      //                   question: "the config has no mode with this id" cannot tell a deliberate
      //                   removal from a config pasted out of another file, and deleting on the latter
      //                   would destroy values nobody offered up; "this entry has no id" cannot tell a
      //                   mode somebody typed with `+` from one the script's template shipped, and
      //                   creating a mode on the latter is how a run adds a viewport nobody asked for.
      //                   Two questions, two records — one variable answering both is the mistake this
      //                   file has already made twice.
      // ======================================================================
      // `document` is part of the identity, not decoration. CodeFig reopens in whatever file you are
      // in, and a collection called "Responsive System" in one file is not the one in another — the
      // guard compared names, decided it already had the table, and ordered Márton's real five-viewport
      // system against a *throwaway file's* three modes, `Pad` rename and all. The wrong order it
      // produced was correct arithmetic on the wrong facts.
      //
      // The first attempt at this stamped `figma.root.id`, which is `0:0` in **every** file — a guard
      // that cannot fail is a guard that does nothing. `@Foundation` supplies the file's name and the
      // collection's own id instead.
      let fileModes = {
        document: null, collection: null, collectionId: null, modes: [], found: false
      };
      let chipModeIds = [];
      /** Which document the panel last heard from, so a same-named collection elsewhere cannot pass. */
      let currentDocumentId = null;
      let removedModeIds = [];
      /**
       * Modes typed with the chips' `+`, by name, at this address.
       *
       * The counterpart to `removedModeIds`, and it exists for the same reason. A mode you added and a

        if (isConfigTab(previous) && !isConfigTab(tabName) && scriptHasConfig) mergeConfigIntoMain();

        if (tabSourceEl) tabSourceEl.classList.toggle('active', tabName === 'source');
        if (tabConfigUIEl) tabConfigUIEl.classList.toggle('active', tabName === 'configUI');
        if (tabConfigCodeEl) tabConfigCodeEl.classList.toggle('active', tabName === 'configCode');
        if (tabDocsEl) tabDocsEl.classList.toggle('active', tabName === 'docs');

        if (tabName === 'configUI' && scriptHasConfig) {
          projectConfigIntoForm();
        }
        if (tabName === 'configCode' && scriptHasConfig) {
          if (configCodeContainer) configCodeContainer.style.display = 'block';
          if (configEditor) configEditor.setValue(currentConfigBlock());
        }

        // One preview, moved to whichever config tab is showing: it belongs beside the thing you
        // are editing, and both views edit the same config.
        const preview = document.getElementById('configPreview');
        if (preview) {
          const host = tabName === 'configUI' ? tabConfigUIEl
            : tabName === 'configCode' ? tabConfigCodeEl : null;
          if (host && preview.parentNode !== host) host.appendChild(preview);
          if (!host) preview.style.display = 'none';
          else updateConfigPreviewVisibility();
        }

        [].forEach.call(editorTabsEl ? editorTabsEl.querySelectorAll('.editor-tab') : [], btn => {
          btn.classList.toggle('active', btn.getAttribute('data-tab') === tabName);
        });
        if (tabName === 'configCode' && scriptHasConfig && configEditor) {
          setTimeout(() => { configEditor.refresh(); configEditor.setSize(null, '100%'); }, 10);
        }
        if (tabName === 'source') {
          setTimeout(() => { code.refresh(); code.setSize(null, '100%'); }, 10);
        }
      }

      /**
       * Render the form from the canonical text, and say when it cannot hold all of it.
       *
       * Two states worth showing, and neither is the user's fault, so neither is styled as an error:
       * the block carries settings no control represents, and the block does not parse at all — in
       * which case the form goes read-only, because writing through it would overwrite the broken
       * text with a projection of the last version that parsed.
       */
      function projectConfigIntoForm() {
        const note = document.getElementById('configStaleNote');
        const noForm = document.getElementById('configNoForm');
        const block = currentConfigBlock();
        // **Which mode you were looking at survives the rebuild.**
        //
        // Every programmatic write re-projects the form, and a fresh form draws its first tab active.
        // So applying a suggestion while standing in Tablet wrote Tablet correctly and then threw you
        // back to Desktop — with the preview and the suggestion list following, which reads as the
        // click having gone to the wrong mode. Chip edits do the same thing. The tab is remembered by
        // *name* rather than index, because the rebuild may have added, removed or reordered them.
        const wasShowing = activeModeName();

        if (configCodeContainer) configCodeContainer.style.display = 'none';

        // **Whether a form exists is decided by whether the block parses to fields**, not by which
        // marker the script uses. The parser reads property lists now, so a `@CONFIG_START` block
        // has a form too — which is the whole point: the block stays the thing you paste, and it is
        // also a form. `scriptHasUIConfig` still says which *marker* is in use, which is what
        // `extractConfigSection` needs; it stopped meaning "has a form".
        var parsedForForm = null;
        try {
          parsedForForm = window.CodeFigConfigUI ? window.CodeFigConfigUI.parse(block) : null;
        } catch (e) {
          parsedForForm = null;
        }
        var formFields = parsedForForm && parsedForForm.rows
          ? parsedForForm.rows.filter(function (r) { return r.type === 'field'; })
          : [];

        if (parsedForForm && formFields.length === 0) {
          // A config with no fields at all — nothing a form could show.
          //
          // Emptied, not just hidden. A hidden container kept the previous script's controls in the
          // DOM, which `readForm` reported as this script's. Nothing reads them today, but a stale
          // form is a loaded gun: the next thing that collects values from it collects someone else's.
          if (configUIContainer) {
            configUIContainer.style.display = 'none';
            configUIContainer.innerHTML = '';
          }
          configUIInstance = null;
          if (note) note.style.display = 'none';
          if (noForm) {
            noForm.style.display = 'block';
            noForm.textContent = "This script's config has no settings a form can show. " +
              'Configuration code has it, and they are the same config.';
          }
          return;
        }
        if (noForm) noForm.style.display = 'none';
        if (configUIContainer) {
          configUIContainer.style.display = 'flex';
          configUIContainer.style.flexDirection = 'column';
        }

        var schema = parsedForForm;

        if (!schema) {
          configFormReadOnly = true;
          if (note) {
            note.style.display = 'block';
            note.textContent = 'Configuration code has an error, so the form is showing the last ' +
              'version it could read. Fix it there and this will catch up.';
          }
          return;
        }

        configFormReadOnly = false;
        initConfigUI(block || '');
        // Recorded *after* the build, so it names the text the controls on screen actually came from.
        configProjectedFrom = block || '';

        // **Put the strip back in the same frame the form came back in.**
        //
        // The preview's slots are *inside* the form — every Colors mode block carries its own — so a
        // rebuild empties them, and the picture only returns when the next debounced run finishes 400ms
        // later. That gap is the flicker: the ramp appears, the form is rebuilt under it, the ramp vanishes,
        // and it comes back a beat later. Márton, watching a collection load: *"mode names and chart appears
        // and disappears in milliseconds"*.
        //
        // The last render is already held for exactly this kind of question, so redrawing it costs nothing
        // and nothing can be stale: a *newer* run overwrites this the moment it lands, and if the config
        // changed, the run that changed it is already scheduled.
        if (_previewLastHtml) renderConfigPreview(_previewLastHtml);
        if (configUIInstance) {
          var projected = configUIInstance.getValues();
          configLastAddress = { collectionName: projected.collectionName, group: projected.group };
        } else {
          configLastAddress = null;
        }
        restoreActiveMode(wasShowing);
        syncChipsToPanelState();
        scheduleFileModes(0);
        scheduleGroupDetection();
        // **Rendering the form does not trigger a load.** It used to, and applying a load re-rendered
        // the form, which triggered another — a rebuild every 350ms that destroyed any open inline
        // input or select dropdown between one lap and the next. Loading is a response to the address
        // changing, and nothing else.

        const unsupported = (schema.rows || []).filter(function (r) {
          return r.type === 'field' && r.inputType === 'unsupported';
        });
        if (note) {
          if (unsupported.length > 0) {
            note.style.display = 'block';
            note.textContent = unsupported.length === 1
              ? '"' + unsupported[0].label + '" is only editable in Configuration code.'
              : unsupported.length + ' settings are only editable in Configuration code: ' +
                unsupported.map(function (r) { return r.label; }).join(', ') + '.';
          } else {
            note.style.display = 'none';
          }
        }
      }

      /**
       * Put the mode tab back after a rebuild, through the same click a person would make.
       *
       * Dispatching the real event rather than setting a class: the tab strip's own listener is what
       * shows the matching fields, and reproducing that here would be a second implementation of it —
       * one that stops matching the first time the strip changes.
       */
      function restoreActiveMode(name) {
        if (!name || !configUIContainer) return;
        const tabs = configUIContainer.querySelectorAll('.config-ui-rows-tab');
        for (let i = 0; i < tabs.length; i++) {
          if (tabs[i].textContent !== name) continue;
          if (!tabs[i].classList.contains('is-active')) {
            tabs[i].dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
          }
          return;
        }
        // The mode is gone — removed, or renamed by the very edit that caused this rebuild. The first
        // tab is then the right answer, and it is already active.
      }

      let structureSyncTimeout = null;

      function scheduleStructureSync() {
        if (structureSyncTimeout) clearTimeout(structureSyncTimeout);
        structureSyncTimeout = setTimeout(function () {
          structureSyncTimeout = null;
          syncScriptStructureFromEditor();
        }, 320);
      }

      /** Re-parse the main editor and refresh docs/config tabs when @DOC_ / @CONFIG_ / @UI_CONFIG_ markers are added or removed (no script re-select needed). */
      function syncScriptStructureFromEditor() {
        if (!code || typeof code.getValue !== 'function') return;

        const hadDocs = scriptHasDocs;
        const hadConfig = scriptHasConfig;
        const hadUI = scriptHasUIConfig;

        // **`code.getValue()`, not `getFullCode()`** — a write hidden inside a read is what reverted
        // every automatic load. `getFullCode` merges the *form* over the block before returning, and
        // this function runs on a debounce after every editor change: so a programmatic write landed,
        // the editor changed, this ran, and the form — which had not caught up, or held a different
        // script's values — was serialised straight back over it. Eight merges in three seconds in the
        // write trace, all undoing the fill.
        //
        // Nothing is lost by reading. An edit in the form already reaches the text through
        // `syncUIToCode`, which is the path that is *supposed* to write; a structure sniff only needs
        // to notice whether `@DOC_`/`@CONFIG_` markers came or went.
        const fullCode = code.getValue();
        const next = parseScriptSections(fullCode);
        const nextHasDocs = next.hasDocs;
        const nextHasConfig = next.hasConfig;
        const nextHasUI = !!next.hasUIConfig;

        const structureChanged =
          hadDocs !== nextHasDocs || hadConfig !== nextHasConfig || hadUI !== nextHasUI;

        parsedSections = next;
        scriptHasDocs = nextHasDocs;
        scriptHasConfig = nextHasConfig;
        scriptHasUIConfig = nextHasUI;

        const tabs = [];
        if (nextHasConfig) { tabs.push('configUI'); tabs.push('configCode'); }
        if (nextHasDocs) tabs.push('docs');
        tabs.push('source');
        updateTabVisibility(tabs);

        if (structureChanged && nextHasDocs && docsRendererEl) {
          renderSimpleMarkdown(next.docContent || '');
        }

        if (structureChanged && nextHasConfig && configEditor && !nextHasUI) {
          configEditor.setValue(next.configContent || '');
        }

        if (structureChanged && nextHasUI && isConfigTab(currentTab)) {
          initConfigUI(next.configContent || '');
        }

        if (currentTab === 'docs' && !nextHasDocs) switchTab('source');
        else if (isConfigTab(currentTab) && !nextHasConfig) switchTab('source');

        updateButtonStates();
      }

      function renderSimpleMarkdown(text) {
        if (!text || !docsRendererEl) return;
        if (typeof window.marked !== 'undefined') {
          try {
            docsRendererEl.innerHTML = window.marked.parse(text, { gfm: true });
            return;
          } catch (e) {
            console.warn('marked parse failed, using fallback', e);
          }
        }
        var escape = function(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
        var html = escape(text)
          .replace(/^### (.+)$/gm, '<h3>$1</h3>')
          .replace(/^## (.+)$/gm, '<h2>$1</h2>')
          .replace(/^# (.+)$/gm, '<h1>$1</h1>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.+?)\*/g, '<em>$1</em>')
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/^- (.+)$/gm, '<li>$1</li>')
          .replace(/(<li>.*?<\/li>\n?)+/g, '<ul>$&</ul>');
        var blocks = html.split(/\n\n+/);
        html = blocks.map(function(block) {
          var t = block.trim();
          if (!t) return '';
          if (t.startsWith('<h') || t.startsWith('<ul')) return t;
          return '<p>' + t.replace(/\n/g, ' ') + '</p>';
        }).join('\n');
        docsRendererEl.innerHTML = html;
      }

      function applyColorScheme() {
        const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = isDark ? 'midnight' : 'default';
        code.setOption('theme', theme);
        if (configEditor) configEditor.setOption('theme', theme);
      }

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyColorScheme);

      // Ensure CodeMirror fills the container properly
      setTimeout(() => {
        applyColorScheme();
        code.refresh();
        code.setSize(null, '100%');
        if (configEditor) { configEditor.refresh(); configEditor.setSize(null, '100%'); }
        
        // Initialize the app after CodeMirror is ready
        init();
      }, 100);

      function post(type, data = {}) {
        // Ensure the message type doesn't get overwritten by data.type
        const { type: dataType, ...cleanData } = data;
        const message = { pluginMessage: { type, ...cleanData } };
        debugLog('Posting message:', type, 'with data keys:', Object.keys(cleanData));
        debugLog('Full message being sent:', JSON.stringify(message, null, 2));
        parent.postMessage(message, '*');
      }

      // Debug logging functions to remove source references
      function debugLog(message, ...args) {
        // const log = console.log.bind(console);
        // setTimeout(() => log('%cCodeFig: ' + message, 'color: #0066cc; font-weight: bold;', ...args), 0);
      }

      function debugError(message, ...args) {
        const error = console.error.bind(console);
        setTimeout(() => error('%cCodeFig: ' + message, 'color: #cc0000; font-weight: bold;', ...args), 0);
      }

      // Update script list in sidebar
      function updateScriptList(searchTerm = '') {
        const filteredScripts = allScripts.filter(script =>
          script.name.toLowerCase().includes(searchTerm.toLowerCase()) &&
          !script.isTemporary // Don't show temporary scripts in the list
        );

        if (filteredScripts.length === 0 && searchTerm) {
          scriptList.innerHTML = '<div class="no-results">No scripts found</div>';
          return;
        }

        // Group scripts by type and sort alphabetically
        const helpScripts = filteredScripts.filter(s => s.type === 'help');
        const prebuiltScripts = filteredScripts.filter(s => s.type === 'prebuilt')
          .sort((a, b) => a.name.localeCompare(b.name));
        const userScripts = filteredScripts.filter(s => s.type === 'user' || s.type === 'library')
          .sort((a, b) => a.name.localeCompare(b.name));

        let html = '';

        // <system-scripts>
        if (helpScripts.length > 0 || prebuiltScripts.length > 0) {
          html += '<div class="system-scripts">';
          
          // Help scripts (no grouping)
          if (helpScripts.length > 0) {
            helpScripts.forEach(script => {
              const isActive = currentScript && currentScript.name === script.name;
              html += `
                <div class="script-item ${isActive ? 'active' : ''}" onclick="selectScript('${script.name}')">
                  <div class="name">${script.name}</div>
                </div>
              `;
            });
          }
          
          // Utility Scripts (with grouping)
          if (prebuiltScripts.length > 0) {
            html += createScriptsWithGroups(prebuiltScripts, 'prebuilt');
          }
          
          html += '</div>'; // Close system-scripts
        }
        
        // <divider>
        if ((helpScripts.length > 0 || prebuiltScripts.length > 0) && userScripts.length > 0) {
          html += '<div class="divider"></div>';
        }

        // <user-scripts>
        if (userScripts.length > 0) {
          html += '<div class="user-scripts">';
          html += createUserScriptsWithGroups(userScripts);
          html += '</div>'; // Close user-scripts
        }

        scriptList.innerHTML = html;
      }

      function createScriptSection(scripts, title, hideHeader = false) {
        let html = '';
        
        if (!hideHeader && title) {
          const headerClass = title === 'Utility Scripts' ? 'utility-scripts' : 'user-scripts';
          const sectionId = title.replace(/\s+/g, '-').toLowerCase();
          const isCollapsed = collapsedSections.has(sectionId);
          const toggleClass = isCollapsed ? 'collapsed' : '';
          
          // Check if any script in this section is selected
          const hasSelectedScript = scripts.some(s => currentScript && currentScript.name === s.name);
          const sectionHeaderClass = hasSelectedScript ? 'selected' : '';
          
          const expandedChevron = `<svg class="chevron-expanded" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 7.5L6 4.5L3 7.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" /></svg>`;
          const collapsedChevron = `<svg class="chevron-collapsed" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" /></svg>`;
          
          html += `
            <div class="section-header ${headerClass} ${sectionHeaderClass}" onclick="toggleSection('${sectionId}')">
              <div class="section-toggle ${toggleClass}">
                ${expandedChevron}
                ${collapsedChevron}
              </div>
              <span>${title}</span>
            </div>
          `;
          
          // Handle regular sections (Utility Scripts, etc.)
          {
            // Regular section for Utility Scripts
            const contentMaxHeight = isCollapsed ? '0' : `${scripts.length * 32 + 20}px`;
            const hasSelectedScript = scripts.some(s => currentScript && currentScript.name === s.name);
            const sectionContentClass = hasSelectedScript ? 'selected' : '';
            
            html += `<div class="section-content ${isCollapsed ? 'collapsed' : ''} ${sectionContentClass}" id="content-${sectionId}">`;
            
            // Use createScriptsWithGroups for proper grouping and alphabetical sorting
            html += createScriptsWithGroups(scripts, 'prebuilt');
            
            html += '</div>';
          }
        }
        
        // Don't add divider here - it's handled in updateScriptList
        
        return html;
      }
      
      function createScriptsWithGroups(scripts, scriptType) {
        let html = '';
        const ungroupedScripts = [];
        const groupedScripts = new Map();
        
        // Parse script names to extract groups and separate grouped/ungrouped scripts
        // Handle all slash variations: Test/Script, Test / Script, Test /Script, Test/ Script, etc.
        scripts.forEach(script => {
          const fullName = script.name;
          
          // Look for any slash (with or without spaces)
          const slashMatch = fullName.match(/^(.+?)\s*\/\s*(.+)$/);
          
          if (slashMatch) {
            // Script has group format - extract and normalize
            const groupName = slashMatch[1].trim();
            const scriptName = slashMatch[2].trim();
            
            // Normalize the full name to standard format "Group / Script"
            const normalizedFullName = `${groupName} / ${scriptName}`;
            
            if (!groupedScripts.has(groupName)) {
              groupedScripts.set(groupName, []);
            }
            groupedScripts.get(groupName).push({
              ...script,
              name: normalizedFullName, // Store normalized name
              displayName: scriptName,
              groupName: groupName
            });
          } else {
            // Ungrouped script
            ungroupedScripts.push({
              ...script,
              displayName: fullName,
              groupName: null
            });
          }
        });
        
        // Create a mixed array of ungrouped scripts and groups for alphabetical sorting
        const allItems = [];
        
        // Add ungrouped scripts
        ungroupedScripts.forEach(script => {
          allItems.push({
            type: 'script',
            name: script.displayName,
            script: script,
            sortKey: script.displayName
          });
        });
        
        // Add groups
        for (const [groupName, groupScripts] of groupedScripts) {
          allItems.push({
            type: 'group',
            name: groupName,
            scripts: groupScripts,
            sortKey: groupName
          });
        }
        
        // Sort all items alphabetically
        allItems.sort((a, b) => a.sortKey.localeCompare(b.sortKey));
        
        // Render items in sorted order
        allItems.forEach(item => {
          if (item.type === 'script') {
            // Render ungrouped script
            const script = item.script;
            const isActive = currentScript && currentScript.name === script.name;
            const scriptClass = scriptType === 'prebuilt' ? 'system-script' : 'user-script';
            html += `
              <div class="script-item ${scriptClass} ${isActive ? 'active' : ''}" onclick="selectScript('${script.name}')">
                <div class="name">${script.displayName}</div>
              </div>
            `;
          } else {
            // Render group
            const groupName = item.name;
            const scripts = item.scripts;
            const groupId = `group-${groupName.replace(/\s+/g, '-').toLowerCase()}`;
            const isGroupCollapsed = collapsedSections.has(groupId);
            const toggleClass = isGroupCollapsed ? 'collapsed' : '';
            const hasSelectedScript = scripts.some(s => currentScript && currentScript.name === s.name);
            const groupHeaderClass = hasSelectedScript ? 'selected' : '';
            const groupClass = hasSelectedScript ? 'selected' : '';
            const expandedChevron = `<svg class="chevron-expanded" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 7.5L6 4.5L3 7.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg>`;
            const collapsedChevron = `<svg class="chevron-collapsed" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg>`;
            
            html += `
              <div class="script-group ${groupClass}">
                <div class="group-header ${groupHeaderClass}" onclick="toggleSection('${groupId}')">
                  <div class="section-toggle ${toggleClass}">
                    ${expandedChevron}
                    ${collapsedChevron}
                  </div>
                  <span>${groupName}</span>
                </div>
                <div class="group-content ${isGroupCollapsed ? 'collapsed' : ''}" id="content-${groupId}">
            `;
            
            scripts.forEach(script => {
              const isActive = currentScript && currentScript.name === script.name;
              const scriptClass = scriptType === 'prebuilt' ? 'system-script' : 'user-script';
              html += `
                <div class="script-item ${scriptClass} grouped ${isActive ? 'active' : ''}" onclick="selectScript('${script.name}')">
                  <div class="name">${script.displayName}</div>
                </div>
              `;
            });
            
            html += `
                </div>
              </div>
            `;
          }
        });
        
        return html;
      }
      
      // Legacy function for backward compatibility
      function createUserScriptsWithGroups(userScripts) {
        return createScriptsWithGroups(userScripts, 'user');
      }

      // Select script
      function selectScript(scriptName) {
        const script = allScripts.find(s => s.name === scriptName);
        if (script) {
          selectScriptDirectly(script);
        }
      }

      function selectScriptDirectly(script) {
        // **A script selection is a fresh question.** Detection is guarded per address so a render
        // cannot poll, but that guard outlived the script: switching to another script and back asked
        // nothing, because the address had been asked about *once, ever*. Márton reported it as
        // detection only working when the plugin opens — the guard is per session and the question is
        // per opening, and those are not the same thing.
        detectedFor = {};
        groupsAdopted = {};
        // Facts about the file are re-read, not carried over. Cheap — one read — and it is the only way
        // a panel opened in a different file cannot inherit the last one's modes.
        fileModes = { document: null, collection: null, collectionId: null, modes: [], found: false };
        chipModeIds = [];
        removedModeIds = [];
        addedModeNames = [];

        debugLog('Selecting script:', script);
        currentScript = script;

        // **Clear the form first.** `projectConfigIntoForm` empties it when a config has no showable
        // fields, but that only runs when Configuration UI is the tab shown — so a script with no config
        // at all left the previous script's controls in the hidden container, and `readForm` reported
        // Grid's fields while sitting on a script that has none.
        //
        // Order matters and cost a round trip to learn: doing this *after* `switchTab` below wiped the
        // form that switch had just built, on every script in the plugin.
        if (configUIContainer) configUIContainer.innerHTML = '';
        configUIInstance = null;
        const fullCode = script.code || '';
        
        parsedSections = parseScriptSections(fullCode);
        scriptHasDocs = parsedSections.hasDocs;
        scriptHasConfig = parsedSections.hasConfig;
        scriptHasUIConfig = !!parsedSections.hasUIConfig;
        
        const tabs = [];
        // Two views of one config, both listed whenever the script has a config at all. The form
        // tab exists even for a script with no form yet: it says so, which is a truer answer than
        // hiding the tab and making the structure change per script.
        if (parsedSections.hasConfig) { tabs.push('configUI'); tabs.push('configCode'); }
        if (parsedSections.hasDocs) tabs.push('docs');
        tabs.push('source');
        updateTabVisibility(tabs);
        
        if (code && code.setValue) {
          code.setValue(fullCode);
          if (scriptHasConfig && configEditor && !scriptHasUIConfig) {
            configEditor.setValue(parsedSections.configContent || '');
          }
          if (scriptHasDocs && docsRendererEl) {
            renderSimpleMarkdown(parsedSections.docContent || '');
          }
          setTimeout(() => {
            code.refresh();
            code.setSize(null, '100%');
            if (configEditor) { configEditor.refresh(); configEditor.setSize(null, '100%'); }
          }, 10);
        }
        // First view: Configuration if script has config, otherwise Script
        // Configuration UI is the default for any script with a config, now that a property-list
        // block builds a form as readily as a `var`-row one. A config with no showable settings still
        // lands on Configuration code, because an empty form tab is not a default worth having.
        const initialTab = scriptHasConfig ? 'configUI' : 'source';
        currentTab = initialTab;
        switchTab(initialTab);
        originalCode = fullCode;
        
        // Check if this script uses @InfoPanel
        // A different script is a different question: what was edited about the last one is not an
        // edit to this one.
        setAutoImportNote(null);

        infoPanelAvailable = checkInfoPanelAvailability(script.code || '');
        updateInfoPanelButtonVisibility();
        updateInfoPanelOwnership();
        updateConfigPreviewVisibility();
        scheduleConfigPreview();
        // The script name already contains the group info if it exists (Group / Script Name)
        scriptTitle.textContent = script.name;
        
        // Only show badge for Utility Scripts, hide for User Scripts
        if (script.type === 'prebuilt') {
          scriptStatus.textContent = 'Utility Script';
          scriptStatus.style.display = 'block';
          // Remove editable class for utility scripts
          scriptTitle.classList.remove('editable');
        } else if (script.type === 'help') {
          scriptStatus.textContent = 'Help';
          scriptStatus.style.display = 'block';
          // Remove editable class for help scripts
          scriptTitle.classList.remove('editable');
        } else {
          // Hide badge for user scripts (including new/temporary scripts)
          scriptStatus.style.display = 'none';
          // Add editable class for user scripts (but not temporary ones)
          if (!script.isTemporary) {
            scriptTitle.classList.add('editable');
          } else {
            scriptTitle.classList.remove('editable');
          }
        }
        
        // Save this as the last opened script (but not for temporary scripts)
        if (!script.isTemporary) {
          post('SET_LAST_OPENED', { name: script.name, scriptType: script.type });
        }
        
        updateButtonStates();
        updateScriptList(searchInput.value);
      }

      // Open the initial script based on last opened or default to Help
      function openInitialScript(lastOpenedScript) {
        let scriptToOpen = null;
        
        if (lastOpenedScript) {
          // Try to find the last opened script by name and type
          scriptToOpen = allScripts.find(s => 
            s.name === lastOpenedScript.name && 
            s.type === lastOpenedScript.type
          );
        }
        
        // If no last opened script or it doesn't exist, default to Help & Documentation
        if (!scriptToOpen) {
          scriptToOpen = allScripts.find(s => s.name === 'CodeFig - help & documentation');
        }
        
        // Fallback to first script if Help & Documentation doesn't exist
        if (!scriptToOpen && allScripts.length > 0) {
          scriptToOpen = allScripts[0];
        }
        
        if (scriptToOpen) {
          selectScriptDirectly(scriptToOpen);
        }
      }

      // Update button states
      function updateButtonStates() {
        const hasContent = !!getEffectiveContentLength();
        const isTemporary = currentScript && currentScript.isTemporary;
        const isPrebuilt = currentScript && (currentScript.type === 'prebuilt' || currentScript.type === 'help');
        const isLibrary = currentScript && currentScript.type === 'library';
        const isEmptyTemporary = isTemporary && !hasContent;

        // Run button: enabled if there's content and not a library (libraries are imported, not run)
        runBtn.disabled = !hasContent || isLibrary;
        runBtn.title = isLibrary ? 'Libraries are imported, not run directly.' : 'Run script (⌘R)';

        // Delete button: enabled for user scripts and libraries that aren't empty temporary scripts
        deleteBtn.disabled = isEmptyTemporary || !currentScript || (currentScript.type !== 'user' && currentScript.type !== 'library');

        // Hide Delete button for prebuilt scripts
        if (isPrebuilt) {
          deleteBtn.style.display = 'none';
        } else {
          deleteBtn.style.display = 'flex';
        }
      }

      // Info Panel functionality
      let infoPanelOpen = false;
      let infoPanelAvailable = false;

      function checkInfoPanelAvailability(scriptCode) {
        // Does the script actually import @InfoPanel? Asked through the shared resolver
        // rather than sniffed with a regex, so this agrees with what a run will do: an
        // @import inside a // @DOC_START block is documentation and does not count. The
        // HELP script used to show this button on the strength of its own import examples.
        //
        // findImports only — never resolveImports: this runs on every keystroke.
        //
        // A missing resolver hides the button instead of throwing. processRuntimeImports
        // is the loud one, on the path where a missing resolver actually breaks something;
        // taking out script loading over a button would be the wrong trade.
        const imports = window.CodeFigImports;
        if (!imports || typeof imports.findImports !== 'function') return false;
        return imports.findImports(scriptCode || '').some(function (imp) {
          return imp.scriptName.indexOf('InfoPanel') !== -1;
        });
      }

      // ---------------------------------------------------------------------
      // Load this file's config, on request
      //
      // The form never fills itself. Nothing here reads the document until the button is
      // pressed, which is what keeps a config you pasted being the config that runs — a
      // property of the design rather than a rule the code has to get right.
      // ---------------------------------------------------------------------

      // One flag, and it means what it says: a silent snippet is running. It used to be called
      // `configLoadInFlight` and belonged to the import button; auto-import and the live preview
      // borrowed it, and now that the button is gone they are the only users.
      let silentRunInFlight = false;

      /**
       * Does the open script declare fields that can be loaded from the file? Cheap parse only,
       * never resolveImports — this runs on every keystroke, same rule as the InfoPanel button.
       */
      function currentConfigBlock() {
        flushConfigSync();
        if (!scriptHasConfig || !parsedSections || !code || !code.getValue) return '';
        try {
          return extractConfigSection(code.getValue(), !!parsedSections.hasUIConfig) || '';
        } catch (e) {
          return '';
        }
      }

      /** The `@fromFile:` path an object-literal config block declares, or null. */
      function configBlockFromFilePath(content) {
        var match = /@fromFile:\s*([A-Za-z0-9_$.]+)/.exec(content || '');
        return match ? match[1] : null;
      }

      /** A run nobody sees: no console bridge, no notify, no InfoPanel. */
      function runSilentSnippet(snippet) {
        if (!window.CodeFigImports || typeof window.CodeFigImports.resolveImports !== 'function') return false;
        if (codefigJob.active || codefigRunSession.active || silentRunInFlight) return false;
        let resolved;
        try {
          resolved = processRuntimeImports(snippet);
        } catch (e) {
          return false;
        }
        silentRunInFlight = true;
        post('RUN', { code: resolved, silent: true });
        return true;
      }

      // ======================================================================
      // LIVE PREVIEW
      //
      // The InfoPanel is a results surface: it appears after a run and covers the UI, so it can
      // say what a run did and cannot say what changing a step to 3 would do. Judging a scale is
      // iterative, so the Configuration tab draws the same picture as you type.
      //
      // The preview runs one declared function rather than the script with writes disabled —
      // "disabled" would mean auditing every write path and trusting the audit. `rampPreviewHtml`
      // is pure, and a test asserts it contains no `figma.`.
      // ======================================================================

      let _previewTimer = null;
      let _previewSeq = 0;
      let _previewLastHtml = '';

      /** `// @PREVIEW: rampPreviewHtml` → the function name, or null. */
      function scriptPreviewFunction(code) {
        const match = /^[^\S\n]*\/\/[^\S\n]*@PREVIEW:[^\S\n]*([A-Za-z_$][\w$]*)/m.exec(code || '');
        return match ? match[1] : null;
      }

      /**
       * The snippet that renders a preview.
       *
       * It reuses the script's own `@import` lines verbatim. `@import` follows calls only within
       * one source file, so importing the preview function alone would ReferenceError on its first
       * library call — while the script's import list already covers everything it needs and is
       * already checked by `validateResolvedCalls`. One list, and it is not this one.
       */
      /** The mode tab the panel is showing, so a preview follows the tab rather than always the first. */
      function activeModeName() {
        var tab = document.querySelector('.config-ui-rows-tabs .config-ui-rows-tab.is-active');
        return tab ? tab.textContent : null;
      }

      /** `// @SUGGESTIONS: <fn>`, the same shape as `@PREVIEW:`. */
      function scriptSuggestionsFunction(code) {
        const match = /^[^\S\n]*\/\/[^\S\n]*@SUGGESTIONS:[^\S\n]*([A-Za-z_$][\w$]*)/m.exec(code || '');
        return match ? match[1] : null;
      }

      /**
       * The open script's own `@import` lines.
       *
       * One list, and it is the script's. Any snippet that calls a library function whose own calls
       * reach *another* library needs them, because `@import` is textual and follows calls only inside
       * one file. The script's list is already complete and already checked by `validateResolvedCalls`.
       */
      function scriptImportLines() {
        if (!currentScript || !window.CodeFigImports ||
            typeof window.CodeFigImports.findImports !== 'function') {
          return [];
        }
        return window.CodeFigImports.findImports(currentScript.code || '').map(function (imp) {
          return imp.statement;
        });
      }

      function buildPreviewSnippet(code, fn, config, domain, seq) {
        const suggestFn = scriptSuggestionsFunction(code);
        const imports = (window.CodeFigImports && typeof window.CodeFigImports.findImports === 'function')
          ? window.CodeFigImports.findImports(code).map(function (imp) { return imp.statement; })
          : [];
        return imports.concat([
          'window.codefigConfigLoadResult({',
          '  preview: ' + fn + '(' + JSON.stringify(config) + ', ' + JSON.stringify(domain) + ', ' +
            JSON.stringify(activeModeName()) + '),',
          // The suggestions section, when the script has one. Same run: two sections computed from one
          // config is one round trip, not two.
          (suggestFn
            ? '  suggestions: ' + suggestFn + '(' + JSON.stringify(config) + ', ' +
              JSON.stringify(domain) + ', ' + JSON.stringify(activeModeName()) + '),'
            : '  suggestions: null,'),
          '  previewSeq: ' + seq,
          '});'
        ]).join('\n');
      }

      /**
       * The mode names the config's own blocks carry.
       *
       * "Driven by the Mode picker in the block" comes to this: the blocks *are* the pickers, and their
       * `name` is what each one is pointing at. Read from the form rather than from the file, because a mode
       * the panel has no block for is deliberately not read.
       */
      function modeNamesInConfig() {
        var api = window.CodeFigConfigUI;
        if (!api || typeof api.parse !== 'function') return [];
        var schema;
        try { schema = api.parse(currentConfigBlock()); } catch (e) { return []; }
        var out = [];
        (schema && schema.rows ? schema.rows : []).forEach(function (row) {
          if (row.type !== 'field' || row.inputType !== 'rows' || !Array.isArray(row.value)) return;
          row.value.forEach(function (entry) {
            if (entry && typeof entry.name === 'string' && entry.name.trim()) out.push(entry.name.trim());
          });
        });
        return out;
      }

      /**
       * Which colour model the panel is on, read from the block rather than assumed.
       *
       * A hue is not one quantity across models — OKLCH's is a perceptual angle, HSL's is where the maximum
       * channel sits — and the fields differ too. Reading a collection without knowing the model fills every
       * anchor with a plausible-looking wrong number, which is worse than filling none.
       */
      function colorModelInConfig() {
        var api = window.CodeFigConfigUI;
        if (!api || typeof api.parse !== 'function') return 'oklch';
        var schema;
        try { schema = api.parse(currentConfigBlock()); } catch (e) { return 'oklch'; }
        var found = null;
        (schema && schema.rows ? schema.rows : []).forEach(function (row) {
          if (row.type === 'field' && row.name === 'colorModel') found = row.value;
        });
        return found === 'hsl' ? 'hsl' : 'oklch';
      }

      function configPreviewDomain() {
        const path = configBlockFromFilePath(currentConfigBlock()) || '';
        const match = /^domains\.([A-Za-z0-9_$]+)/.exec(path);
        return match ? match[1] : null;
      }

      function updateConfigPreviewVisibility() {
        const region = document.getElementById('configPreview');
        if (!region) return;
        // With a `@preview` row the section is inside the form, so the panel-level region stays hidden.
        if (document.querySelector('[data-preview-slot]')) {
          region.style.display = 'none';
          return;
        }
        const on = !!(currentScript && scriptPreviewFunction(currentScript.code || ''));
        region.style.display = on ? 'flex' : 'none';
        if (!on) {
          _previewLastHtml = '';
          const body = document.getElementById('configPreviewBody');
          if (body) body.innerHTML = '';
        }
      }

      function renderConfigPreview(html) {
        _previewLastHtml = html;
        // A `@preview` marker row means the block said where this belongs, so it goes there rather than
        // in the panel-level region below the form.
        const slots = [...document.querySelectorAll('[data-preview-slot]')];
        const region = document.getElementById('configPreview');

        // **One slot per row, when `@preview` is a column of a `@blocks` control.** Every Colors frame draws
        // the strip inside its own mode block, so one silent run has to fill several slots — and the preview
        // function says which is which with `data-preview-for`. Distributed by name rather than by position,
        // because a row can be added or removed between the run being asked for and its answer arriving.
        if (slots.length > 1) {
          const parsed = document.createElement('div');
          parsed.innerHTML = html || '';
          const byName = {};
          parsed.querySelectorAll('[data-preview-for]').forEach(function (part) {
            byName[part.getAttribute('data-preview-for')] = part.innerHTML;
          });
          slots.forEach(function (slot) {
            // A slot with no row name is the section-level one, which is where the panel-wide part goes —
            // the alignment banner. `__panel__` rather than the empty string, so an unnamed *mode* block
            // cannot collide with it.
            const name = slot.hasAttribute('data-preview-row')
              ? (slot.getAttribute('data-preview-row') || '')
              : '__panel__';
            var part = Object.prototype.hasOwnProperty.call(byName, name) ? byName[name] : '';
            slot.innerHTML = part;
            // **A slot with nothing in it takes no room.** The panel-level slot holds the OKLCH alignment
            // banner, which HSL has no equivalent of — so in HSL it drew an empty box the height of a
            // section, under a heading that was itself hidden. An empty preview is not a preview.
            slot.style.display = part ? '' : 'none';
          });
          if (region) region.style.display = 'none';
          return;
        }

        const slot = slots[0];
        if (slot) {
          slot.innerHTML = html;
          slot.style.display = html ? '' : 'none';
          if (region) region.style.display = 'none';
          return;
        }
        const body = document.getElementById('configPreviewBody');
        if (body) body.innerHTML = html;
      }

      function renderConfigSuggestions(html) {
        const slot = document.querySelector('[data-suggestions-slot]');
        if (!slot) return;
        slot.innerHTML = html || '';
      }

      /**
       * Apply a suggestion — **only on a click, and only to the mode you are looking at.**
       *
       * Two rules, both Márton's, and both about not doing more than was asked:
       *
       * The section recomputes on every keystroke, so nothing about *rendering* a card may write a
       * value. The arrow points fields → cards until a click points it back, which is why this is a
       * listener rather than anything the renderer does.
       *
       * And a card's badges say which other modes the pair would also divide cleanly — they are not a
       * promise to write them. Applying while standing in Desktop changes Desktop and nothing else;
       * getting it onto Tablet means going to Tablet. One gesture writing three modes is the kind of
       * thing you only notice afterwards.
       */
      function applySuggestion(card) {
        var margin = Number(card.getAttribute('data-suggestion-margin'));
        var gap = Number(card.getAttribute('data-suggestion-gap'));
        if (!isFinite(margin) || !isFinite(gap)) return;
        var api = window.CodeFigConfigUI;
        if (!api) return;

        var schema;
        try {
          schema = api.parse(currentConfigBlock());
        } catch (e) {
          return;
        }
        var row = (schema.rows || []).filter(function (r) {
          return r.type === 'field' && r.inputType === 'rows' && Array.isArray(r.value);
        })[0];
        if (!row) return;

        var wanted = activeModeName();
        var entries = row.value.map(function (entry) {
          var isTarget = wanted
            ? api.sameModeName(entry && entry.name, wanted)
            : row.value.indexOf(entry) === 0;
          if (!isTarget) return entry;
          var next = {};
          for (var key in entry) next[key] = entry[key];
          next.padding = margin;
          next.gap = gap;
          return next;
        });

        var values = {};
        values[row.name] = entries;
        // `writeConfigBlockText` re-projects the form, so the fields, the preview and the cards all
        // catch up from the one text — the same path a chip edit takes.
        writeConfigBlockText(api.serialize(schema, values), 'suggestion');
        scheduleConfigPreview();
      }

      /** Debounced: long enough that typing `12` never renders `1`. */
      function scheduleConfigPreview() {
        if (!currentScript || !scriptPreviewFunction(currentScript.code || '')) return;
        if (_previewTimer) clearTimeout(_previewTimer);
        _previewTimer = setTimeout(requestConfigPreview, 400);
      }

      /**
       * The file's own values for the set the panel is pointing at, `{ modeName: [hex, …] }`.
       *
       * **Session state, not a re-read.** A `@PREVIEW:` function is pure and runs in the UI, so the only way
       * the comparison strip can be live while anchors are being adjusted is for the values to already be
       * here. They ride the auto-import payload — the read that already happens on a Collection or Group
       * change — rather than costing a second round trip.
       *
       * Keyed by collection and group, so pointing the panel somewhere else cannot leave the previous set's
       * colours underneath the new one's ramp. Cleared rather than kept when the address changes and the new
       * address holds nothing.
       */
      var fileColorValues = { address: null, byMode: null };

      function fileColorsAddress(collection, group) {
        return String(collection || '') + '\u0000' + String(group == null ? '' : group);
      }

      function fileColorsFor(collection, group) {
        return (fileColorValues.address === fileColorsAddress(collection, group))
          ? fileColorValues.byMode : null;
      }

      /**
       * The curves recognition fitted, keyed the way the renderer addresses its curve controls.
       *
       * Cleared and rebuilt on every read, so a collection with no ramp leaves nothing behind for the next
       * one to offer — an *Estimated original* describing the previous collection would be worse than none.
       */
      let _curveBaselines = {};
      function rememberCurveBaselines(config) {
        _curveBaselines = {};
        if (!config) return;
        if (Array.isArray(config.curve) && config.curve.length) _curveBaselines.curve = config.curve.slice();
        // `modes[0].curve` — the path `buildRowsControl` builds its cell keys from.
        (Array.isArray(config.modes) ? config.modes : []).forEach(function (mode, i) {
          if (mode && Array.isArray(mode.curve) && mode.curve.length) {
            _curveBaselines['modes[' + i + '].curve'] = mode.curve.slice();
          }
        });
      }

      function rememberFileColors(collection, group, byMode) {
        fileColorValues = {
          address: fileColorsAddress(collection, group),
          byMode: (byMode && Object.keys(byMode).length) ? byMode : null
        };
      }

      /**
       * **The colours the bar beside each chart is drawn from**, keyed the way the renderer addresses its
       * curve controls — the same shape as `_curveBaselines`, published through the same call.
       *
       * The file's own hexes, in step order. The renderer places each at the value its curve puts it at, so
       * the bar is a picture of this ramp rather than of the channel in the abstract, and no colour maths
       * has to be inlined into the UI to draw it.
       *
       * The collection-scope curve is OKLCH's shared ladder, so it takes the first mode that has any: every
       * mode of it is generated from that one ladder, and in greyscale they agree by construction.
