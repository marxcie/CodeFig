<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/default.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/midnight.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <!-- INLINE_MARKED -->
    <!-- CodeFigUI CSS lives in src/ui.css (section 9), not here -->
    <style id="config-ui-css">/* Placeholder - actual styles in src/ui.css */</style>
    <script id="config-ui-stub">
      (function () {
        var g =
          (typeof self !== "undefined" && self) ||
          (typeof window !== "undefined" && window) ||
          (typeof global !== "undefined" && global) ||
          this;
        if (!g) return;
        g.CodeFigConfigUI = {
          parse: function () { return { sections: [] }; },
          serialize: function () { return ""; },
          render: function (schema, opts) {
            var c = opts && opts.container;
            if (c) {
              c.innerHTML = '<div class="config-ui-empty">CodeFigUI failed to load. Check figma-console.log for errors.</div>';
            }
            return {
              getValues: function () { return {}; },
              setValues: function () {},
              destroy: function () {}
            };
          }
        };
      })();
    </script>
    <script id="config-ui-js">/* generated at build time from src/config-ui/ - do not edit */</script>
    <script id="import-resolver-js">/* generated at build time from src/import-resolver.js - do not edit */</script>
    <style id="app-css">/* generated at build time from src/ui.css - do not edit */</style>
  </head>
  <body>
    <div class="resizable-container">
      <!-- Window resize handle (corner only) -->
      <div class="resize-handle resize-handle-corner" id="resizeHandleCorner"></div>
      <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
          <div class="sidebar-header">
            <div class="search-container">
              <input type="text" id="searchInput" class="search-input" placeholder="Search..." title="Search scripts (⌘/)">
            </div>
          </div>
          <div class="script-list" id="scriptList">
            <!-- Scripts will be populated here -->
          </div>
        </div>
        
        <!-- Resizer -->
        <div class="resizer" id="resizer"></div>
        
        <!-- Main Content -->
        <div class="main-content">
          <div class="editor-header">
            <div class="header-left">
              <div class="script-title" id="scriptTitle">Select a script</div>
              <div class="script-status" id="scriptStatus">Ready</div>
            </div>
            <div class="header-right">
              <div class="button-group">
                <button class="icon-btn" id="configLoadBtn" title="Import this file's config" style="display: none;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M12 3v11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <polyline points="7 9 12 14 17 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
                <button class="icon-btn" id="infoPanelBtn" title="Results & Information">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <polyline points="14,2 14,8 20,8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </div>
              <div class="action-buttons">
                <button class="btn danger" id="deleteBtn" disabled title="Delete script">Delete</button>
                <button class="btn primary" id="runBtn" title="Run script (⌘R)">Run</button>
              </div>
            </div>
          </div>
          
          <div class="editor-tabs" id="editorTabs">
            <button class="editor-tab" data-tab="docs" type="button">Documentation</button>
            <button class="editor-tab" data-tab="config" type="button">Configuration</button>
            <button class="editor-tab active" data-tab="script" type="button">Script</button>
          </div>
          
          <div class="editor-container">
            <div class="tab-content" id="tabDocs">
              <div id="docsRenderer" class="docs-rendered"></div>
            </div>
            <div class="tab-content" id="tabConfig">
              <div class="config-code-container" id="configCodeContainer">
                <textarea id="codeConfig" placeholder="// Configuration section"></textarea>
              </div>
              <div class="config-ui-container" id="configUIContainer" style="display: none;">
                <!-- Rendered when script uses // @UI_CONFIG_START … // @UI_CONFIG_END -->
              </div>
            </div>
            <div class="tab-content active" id="tabScript">
              <textarea id="code" placeholder="// Select a script from the sidebar or create a new one"></textarea>
            </div>
            
            <!-- Info Panel -->
            <div class="info-panel" id="infoPanel">
              <div class="info-panel-scroll">
                <div class="info-header">
                  <span class="info-title">Results & Information</span>
                </div>
                <div class="info-filtering" id="infoFiltering">
                  <!-- Filtering controls will be added here later -->
                </div>
                <div class="info-list" id="infoContent">
                  <div class="info-placeholder">
                    <p>No results yet. Run a script to see information here.</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>           

      <!-- Progress Indicator -->
      <div class="progress-indicator" id="progressIndicator" style="display: none;">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">Processing...</div>
      </div>
      
      <!-- Footer outside main container for full width -->
      <div class="plugin-footer">
        <div class="footer-left">
          <button class="btn secondary" id="newScript" title="Create new script (⌘N)">New script</button>
          <button type="button" class="bmc-btn" id="buyMeACoffeeBtn" title="Support CodeFig on Buy Me a Coffee (opens in browser)" aria-label="Buy me a coffee">
            <!-- INLINE_BMC_SVG -->
          </button>
        </div>
        <div class="footer-right">
          <button class="btn secondary" id="exportBtn" title="Export current script (⌘E)">Export script</button>
          <button class="btn secondary" id="exportAllBtn" title="Export all user scripts">Export all user scripts</button>
          <button class="btn secondary" id="importBtn" title="Import script (⌘I)">Import script</button>
        </div>
      </div>
    </div>

    <script>
      // Build flag injected by `build-scripts.js` (dev build allows localhost console forwarding)
      // In source it stays a string placeholder; build replaces it with "true"/"false".
      var CODEFIG_BUILD_IS_DEV = "__CODEFIG_BUILD_IS_DEV__" === "true";
      // Which build this running plugin came from. Reported with job results so the CLI can
      // say "reload the plugin" instead of leaving you to guess why an import vanished.
      var CODEFIG_BUILD_ID = "__CODEFIG_BUILD_ID__";

      // === Dev bridge (figma-console-server.js) ===
      // The ONE place this UI reaches localhost. Everything dev-only — console forwarding
      // and the job queue — goes through here, so the guard is in a single auditable spot
      // and tests/ui-dev-guard.test.js can assert no ungated path exists. A production
      // build also has no localhost entry in its manifest, so Figma blocks it regardless.
      var CODEFIG_BRIDGE_ORIGIN = 'http://localhost:8765';

      function _codefigBridgeFetch(pathname, options) {
        if (!CODEFIG_BUILD_IS_DEV) return Promise.resolve(null);
        try {
          return fetch(CODEFIG_BRIDGE_ORIGIN + (pathname || ''), options).catch(function () { return null; });
        } catch (e) {
          return Promise.resolve(null);
        }
      }

      // === UI debug: send to backend (shows in figma-console.log when npm run dev) ===
      var DEBUG_UI = false; // Set true for verbose logging; errors always forwarded
      function uiDebugLog() {
        const args = Array.prototype.slice.call(arguments);
        const message = args.map(function(a) {
          if (typeof a === 'object') try { return JSON.stringify(a); } catch(e) { return String(a); }
          return String(a);
        }).join(' ');
        if (!DEBUG_UI && message.indexOf('ERROR') === -1 && message.indexOf('error') === -1) return;
        try {
          if (window.parent && window.parent.postMessage) {
            window.parent.postMessage({ pluginMessage: { type: 'UI_DEBUG', message: message } }, '*');
          }
        } catch (e) {}
        _codefigBridgeFetch('', {
          method: 'POST',
          body: '[UI] ' + message + '\n',
          headers: { 'Content-Type': 'text/plain; charset=utf-8' }
        });
      }
      window.onerror = function(msg, url, line, col, err) {
        uiDebugLog('window.onerror:', msg, 'at', line + ':' + col, err ? err.stack : '');
        try {
          const payload = String(msg || 'Unknown UI error') + (err && err.stack ? '\n' + err.stack : '');
          _codefigAppendConsoleLine('error', '[UI] ' + payload);
          // Keep InfoPanel button visible when errors exist
          updateInfoPanelButtonVisibility();
          _codefigRenderConsoleBlock();
        } catch (_) {}
        return false;
      };
      window.onunhandledrejection = function (event) {
        try {
          const reason = event && event.reason;
          let payload = '';
          if (reason instanceof Error) payload = reason.name + ': ' + reason.message + (reason.stack ? '\n' + reason.stack : '');
          else payload = reason != null ? String(reason) : 'Unknown rejection reason';
          _codefigAppendConsoleLine('error', '[UI] Unhandled rejection: ' + payload);
          updateInfoPanelButtonVisibility();
          _codefigRenderConsoleBlock();
        } catch (_) {}
      };

      // === Internal "Error console" (last run) ===
      var _codefigLastRunConsole = [];
      var _codefigLastRunMaxLines = 2000;
      var _codefigConsoleDirty = false;

      function _codefigFormatTs(d) {
        try {
          const pad = (n, len) => String(n).padStart(len || 2, '0');
          return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + '.' + pad(d.getMilliseconds(), 3);
        } catch (_) {
          return '';
        }
      }

      function _codefigAppendConsoleLine(level, text) {
        const safeLevel = (level === 'error' || level === 'warn' || level === 'log') ? level : 'log';
        const line = {
          ts: Date.now(),
          level: safeLevel,
          text: text != null ? String(text) : ''
        };
        _codefigLastRunConsole.push(line);
        if (_codefigLastRunConsole.length > _codefigLastRunMaxLines) {
          _codefigLastRunConsole.splice(0, _codefigLastRunConsole.length - _codefigLastRunMaxLines);
        }
        _codefigConsoleDirty = true;
      }

      function _codefigResetConsole(opts) {
        var closePanel = !!(opts && opts.closePanel);
        _codefigLastRunConsole = [];
        _codefigConsoleDirty = true;
        // Keep the InfoPanel button visible if errors exist; after reset, visibility may change.
        try { updateInfoPanelButtonVisibility(); } catch (_) {}
        _codefigRenderConsoleBlock();
        if (closePanel) {
          try {
            if (typeof infoPanelOpen !== 'undefined' && infoPanelOpen) {
              toggleInfoPanel();
            }
          } catch (_) {}
        }
      }

      function _codefigShouldCapture(payload) {
        const s = payload != null ? String(payload) : '';
        // Script logs are already tagged by backend as "[Script]"
        if (s.indexOf('[Script]') !== -1) return true;
        // Backend errors are prefixed with "CodeFig:" and/or "Backend:"
        if (s.indexOf('CodeFig:') !== -1) return true;
        if (s.indexOf('Backend:') !== -1) return true;
        // UI debug helper prefixes with [UI]
        if (s.indexOf('[UI]') !== -1) return true;
        return false;
      }

      function _codefigGetConsoleText() {
        return _codefigLastRunConsole.map(function (l) {
          const d = new Date(l.ts);
          return '[' + _codefigFormatTs(d) + '] [' + String(l.level || 'log').toUpperCase() + '] ' + (l.text || '');
        }).join('\n');
      }

      function _codefigCopyTextToClipboard(text, notifyMessage) {
        if (!text) return;
        var notify = notifyMessage || 'Copied to clipboard';
        if (navigator && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text)
            .then(function () {
              try { post('NOTIFY', { message: notify }); } catch (_) {}
            })
            .catch(function () {});
          return;
        }
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', 'true');
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          ta.style.top = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          try { post('NOTIFY', { message: notify }); } catch (_) {}
        } catch (_) {}
      }

      function _codefigCopyConsoleToClipboard() {
        _codefigCopyTextToClipboard(_codefigGetConsoleText());
      }

      function _codefigEnsureConsoleContainer() {
        if (!infoContent) return null;
        let container = document.getElementById('codefigConsoleBlock');
        if (container) return container;
        container = document.createElement('div');
        container.id = 'codefigConsoleBlock';
        container.className = 'codefig-console-block';
        // Insert at top, before any other info content
        if (infoContent.firstChild) infoContent.insertBefore(container, infoContent.firstChild);
        else infoContent.appendChild(container);
        return container;
      }

      function _codefigEscapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function _codefigRenderConsoleBlock() {
        if (!infoContent) return;
        const container = _codefigEnsureConsoleContainer();
        if (!container) return;

        const lines = _codefigLastRunConsole.slice();
        const errorCount = lines.filter(function (l) { return l.level === 'error'; }).length;
        const warnCount = lines.filter(function (l) { return l.level === 'warn'; }).length;
        const total = lines.length;

        // Hide the block when empty to avoid visual noise
        if (!total) {
          container.style.display = 'none';
          container.innerHTML = '';
          return;
        }

        container.style.display = 'block';

        const titleBits = [];
        if (errorCount) titleBits.push(errorCount + ' error' + (errorCount === 1 ? '' : 's'));
        if (warnCount) titleBits.push(warnCount + ' warning' + (warnCount === 1 ? '' : 's'));
        if (!titleBits.length) titleBits.push(total + ' message' + (total === 1 ? '' : 's'));

        var consoleTitle = 'Script log';
        if (errorCount) {
          consoleTitle = 'Script error' + (errorCount === 1 ? '' : 's');
        } else if (warnCount) {
          consoleTitle = 'Script warning' + (warnCount === 1 ? '' : 's');
        }

        const header = [
          '<div class="codefig-console-header">',
            '<div class="codefig-console-title">' + consoleTitle + '</div>',
            '<div class="codefig-console-meta">' + titleBits.join(' · ') + '</div>',
            '<div class="codefig-console-actions">',
              '<button type="button" class="btn secondary codefig-console-btn" id="codefigConsoleCopyBtn" title="Copy to console">Copy to console</button>',
              '<button type="button" class="btn secondary codefig-console-btn" id="codefigConsoleClearBtn" title="Clear log">Clear log</button>',
            '</div>',
          '</div>'
        ].join('');

        var htmlLines = '';
        for (var i = 0; i < lines.length; i++) {
          var l = lines[i];
          var ts = _codefigFormatTs(new Date(l.ts));
          var lvl = String(l.level || 'log');
          var txt = _codefigEscapeHtml(l.text || '');
          htmlLines += '<div class="codefig-console-line codefig-console-line--' + lvl + '">'
            + '<span class="codefig-console-line__ts">[' + _codefigEscapeHtml(ts) + ']</span> '
            + '<span class="codefig-console-line__lvl">[' + _codefigEscapeHtml(lvl.toUpperCase()) + ']</span> '
            + '<span class="codefig-console-line__msg">' + txt.replace(/\n/g, '<br>') + '</span>'
            + '</div>';
        }

        const body = '<div class="codefig-console-body" id="codefigConsoleBody">' + htmlLines + '</div>';
        container.innerHTML = header + body;

        const copyBtn = document.getElementById('codefigConsoleCopyBtn');
        if (copyBtn) copyBtn.onclick = _codefigCopyConsoleToClipboard;
        const clearBtn = document.getElementById('codefigConsoleClearBtn');
        if (clearBtn) clearBtn.onclick = function () { _codefigResetConsole({ closePanel: true }); };

        _codefigConsoleDirty = false;
      }

      // Help scripts will be populated by the build process from HELP folder

      // Pre-built scripts
      // Prebuilt scripts will be loaded from backend at runtime
      let prebuiltScripts = [];
      uiDebugLog('Main script block started');

      // State
      let currentScript = null;
      let userScripts = [];
      let allScripts = [];
      let userGroups = new Map(); // Map of groupName -> {scripts: [], collapsed: false}
      let originalCode = '';
      let isResizing = false;
      let startX, startWidth; // Global scope for resizing
      let autosaveTimeout = null; // For debounced autosave
      let collapsedSections = new Set(); // Track collapsed sections
      let pendingBatchImportSummary = null; // { skipped, invalid } for import batch notifications
      
      // Window resizing state
      let isWindowResizing = false;
      let resizeType = null; // 'width', 'height', or 'both'
      let startWindowX, startWindowY, startWindowWidth, startWindowHeight;
      let lastResizeTime = 0;
      
      // Window memory state
      let windowMemory = {
        width: 1000,
        height: 600,
        x: 100,
        y: 100,
        displayWidth: window.screen.width,
        displayHeight: window.screen.height
      };

      // DOM elements
      const scriptList = document.getElementById('scriptList');
      const scriptTitle = document.getElementById('scriptTitle');
      const scriptStatus = document.getElementById('scriptStatus');
      const codeTextarea = document.getElementById('code');
      const codeConfigTextarea = document.getElementById('codeConfig');
      const editorTabsEl = document.getElementById('editorTabs');
      const tabScriptEl = document.getElementById('tabScript');
      const tabConfigEl = document.getElementById('tabConfig');
      const tabDocsEl = document.getElementById('tabDocs');
      const docsRendererEl = document.getElementById('docsRenderer');
      const buyMeACoffeeBtn = document.getElementById('buyMeACoffeeBtn');
      const newScriptBtn = document.getElementById('newScript');
      const runBtn = document.getElementById('runBtn');
      const deleteBtn = document.getElementById('deleteBtn');
      const exportBtn = document.getElementById('exportBtn');
      const importBtn = document.getElementById('importBtn');
      const infoPanelBtn = document.getElementById('infoPanelBtn');
      const infoPanel = document.getElementById('infoPanel');
      const infoContent = document.getElementById('infoContent');
      const exportAllBtn = document.getElementById('exportAllBtn');
      const resizer = document.getElementById('resizer');
      const sidebar = document.getElementById('sidebar');
      const searchInput = document.getElementById('searchInput');
      
      // Window resize handle (corner only)
      const resizeHandleCorner = document.getElementById('resizeHandleCorner');

      // Initialize CodeMirror (main script editor)
      const code = CodeMirror.fromTextArea(codeTextarea, {
        mode: 'javascript',
        theme: 'default',
        lineNumbers: true,
        indentUnit: 2,
        tabSize: 2,
        lineWrapping: true,
        autoCloseBrackets: true,
        matchBrackets: true,
        foldGutter: true,
        gutters: ['CodeMirror-linenumbers', 'CodeMirror-foldgutter'],
        scrollbarStyle: 'native'
      });

      // Initialize CodeMirror for config tab
      let configEditor = null;
      if (codeConfigTextarea) {
        configEditor = CodeMirror.fromTextArea(codeConfigTextarea, {
          mode: 'javascript',
          theme: 'default',
          lineNumbers: true,
          indentUnit: 2,
          tabSize: 2,
          lineWrapping: true,
          autoCloseBrackets: true,
          matchBrackets: true,
          gutters: ['CodeMirror-linenumbers'],
          scrollbarStyle: 'native'
        });
      }

      let configUIInstance = null;
      const configCodeContainer = document.getElementById('configCodeContainer');
      const configUIContainer = document.getElementById('configUIContainer');

      function initConfigUI(configCode) {
        if (!configUIContainer) return;
        if (configUIInstance) {
          configUIInstance.destroy();
          configUIInstance = null;
        }
        configUIContainer.innerHTML = '';
        if (typeof window.CodeFigConfigUI === 'undefined') {
          configUIContainer.innerHTML = '<div class="config-ui-empty">CodeFigUI failed to load. Reload the plugin.</div>';
          return;
        }
        var content = (configCode && configCode.trim()) || '';
        if (!content && parsedSections && code && code.getValue) {
          var useUI = !!parsedSections.hasUIConfig;
          content = extractConfigSection(code.getValue(), useUI).trim();
        }
        try {
          var schema = window.CodeFigConfigUI.parse(content);
          if (schema && ((schema.rows && schema.rows.length > 0) || (schema.sections && schema.sections.length > 0))) {
            configUIContainer.innerHTML = '';
            configUIInstance = window.CodeFigConfigUI.render(schema, {
              container: configUIContainer,
              onChange: function (values) { syncUIToCode(values); }
            });
          } else {
            configUIContainer.innerHTML = '<div class="config-ui-empty">No configuration options.</div>';
          }
        } catch (e) {
          configUIContainer.innerHTML = '<div class="config-ui-empty">Could not render configuration: ' + (e && e.message ? e.message : String(e)) + '</div>';
        }
      }

      function syncUIToCode(values) {
        if (!scriptHasConfig || typeof window.CodeFigConfigUI === 'undefined') return;
        try {
          if (scriptHasUIConfig) {
            // @UI_CONFIG: configEditor is not used; mergeConfigIntoMain parses from main code
            mergeConfigIntoMain();
          } else {
            if (!configEditor) return;
            const schema = window.CodeFigConfigUI.parse(configEditor.getValue());
            const newCode = window.CodeFigConfigUI.serialize(schema, values);
            configEditor.setValue(newCode);
            mergeConfigIntoMain();
          }
        } catch (err) {}
      }

      // Tab state for script sections (docs / config / script)
      let currentTab = 'script';
      let scriptHasDocs = false;
      let scriptHasConfig = false;
      let scriptHasUIConfig = false; // @UI_CONFIG_START → show UI; @CONFIG_START only → show code
      let parsedSections = null; // { docContent, configContent, hasUIConfig, configStartMarker, configEndMarker, ... }

      // Parse script into sections by @DOC_START/@DOC_END and @CONFIG_START/@CONFIG_END
      function hasSection(code, startMarker) {
        if (!code || typeof code !== 'string') return false;
        return code.indexOf('// ' + startMarker) !== -1 || code.indexOf('//' + startMarker) !== -1;
      }

      function extractSection(code, startMarker, endMarker) {
        if (!code || typeof code !== 'string') return '';
        const startPattern = new RegExp('^\\s*//\\s*' + startMarker.replace('@', '\\@') + '\\s*$', 'm');
        const endPattern = new RegExp('^\\s*//\\s*' + endMarker.replace('@', '\\@') + '\\s*$', 'm');
        const startMatch = code.match(startPattern);
        const endMatch = code.match(endPattern);
        if (!startMatch || !endMatch) return '';
        const startIdx = code.indexOf(startMatch[0]) + startMatch[0].length;
        const endIdx = code.indexOf(endMatch[0]);
        if (startIdx >= endIdx) return '';
        return code.slice(startIdx, endIdx).replace(/^\s*\n|\n\s*$/g, '');
      }

      function extractConfigSection(code, useUIConfig) {
        const start = useUIConfig ? '@UI_CONFIG_START' : '@CONFIG_START';
        const end = useUIConfig ? '@UI_CONFIG_END' : '@CONFIG_END';
        const content = extractSection(code, start, end);
        return content.replace(/^\s*\n|\n\s*$/g, '');
      }

      function extractDocContent(code) {
        const raw = extractSection(code, '@DOC_START', '@DOC_END');
        return raw.split('\n').map(line => {
          const m = line.match(/^\s*\/\/\s?(.*)$/);
          return m ? m[1] : line;
        }).join('\n').trim();
      }

      function nextLineStart(s, i) {
        const n = s.indexOf('\n', i);
        return n === -1 ? s.length : n + 1;
      }

      function parseScriptSections(fullCode) {
        const hasDocs = hasSection(fullCode, '@DOC_START');
        const hasUIConfig = hasSection(fullCode, '@UI_CONFIG_START');
        const hasCodeConfig = hasSection(fullCode, '@CONFIG_START');
        const hasConfig = hasUIConfig || hasCodeConfig;
        if (!hasDocs && !hasConfig) {
          return { hasDocs: false, hasConfig: false, hasUIConfig: false, fullCode: fullCode };
        }
        const docContent = hasDocs ? extractDocContent(fullCode) : '';
        const configContent = hasConfig ? extractConfigSection(fullCode, hasUIConfig) : '';
        const docStart = fullCode.indexOf('// @DOC_START');
        const docEnd = fullCode.indexOf('// @DOC_END');
        const configStartMarker = hasUIConfig ? '// @UI_CONFIG_START' : '// @CONFIG_START';
        const configEndMarker = hasUIConfig ? '// @UI_CONFIG_END' : '// @CONFIG_END';
        const configStart = fullCode.indexOf(configStartMarker);
        const configEnd = fullCode.indexOf(configEndMarker);
        let preDoc = '';
        let postDocPreConfig = '';
        let postConfig = '';
        if (hasConfig && configEnd !== -1) {
          postConfig = fullCode.slice(nextLineStart(fullCode, configEnd)).replace(/^\s*\n?/, '');
        }
        if (hasConfig && !hasDocs && configStart !== -1) {
          preDoc = fullCode.slice(0, configStart).replace(/\n\s*$/, '');
        } else if (hasDocs && docStart !== -1 && docEnd !== -1) {
          preDoc = fullCode.slice(0, docStart).replace(/\n\s*$/, '');
          if (hasConfig && configStart !== -1) {
            postDocPreConfig = fullCode.slice(nextLineStart(fullCode, docEnd), configStart).replace(/\n\s*$/g, '').replace(/^\s*\n?/, '');
          } else {
            postDocPreConfig = fullCode.slice(nextLineStart(fullCode, docEnd)).replace(/^\s*\n?/, '');
          }
        }
        return {
          hasDocs,
          hasConfig,
          hasUIConfig,
          configStartMarker,
          configEndMarker,
          fullCode,
          docContent,
          configContent,
          preDoc,
          postDocPreConfig,
          postConfig
        };
      }

      function mergeConfigIntoMain() {
        if (!scriptHasConfig || !parsedSections) return;
        const mainCode = code.getValue();
        const startMarker = parsedSections.configStartMarker || '// @CONFIG_START';
        const endMarker = parsedSections.configEndMarker || '// @CONFIG_END';
        const i = mainCode.indexOf(startMarker);
        const j = mainCode.indexOf(endMarker);
        if (i === -1 || j === -1 || j <= i) return;
        let configContent = '';
        if (scriptHasUIConfig && configUIInstance && window.CodeFigConfigUI) {
          const schema = window.CodeFigConfigUI.parse(mainCode.slice(i + startMarker.length, j));
          configContent = window.CodeFigConfigUI.serialize(schema, configUIInstance.getValues());
        } else {
          configContent = configEditor ? configEditor.getValue() : '';
        }
        const before = mainCode.slice(0, i + startMarker.length);
        const after = mainCode.slice(j);
        const trimmed = configContent.replace(/\n\s*$/, '');
        const newCode = before + '\n' + trimmed + '\n' + after;
        if (newCode === mainCode) return;

        // Only write merged config back into the main editor while the Configuration
        // tab is active (user is editing the form / split config editor). On Script or
        // Docs, the main editor is authoritative: applying merge here would replace
        // inline edits with stale CodeFigUI/config-editor state, make the buffer match
        // originalCode, and skip autosave — feeling like a revert to the last save.
        if (currentTab !== 'config') return;

        const startReplace = i + startMarker.length;
        const oldSegLen = j - startReplace;
        const newSegLen = newCode.length - before.length - after.length;
        const delta = newSegLen - oldSegLen;

        function mapOffset(pos) {
          if (pos < startReplace) return pos;
          if (pos >= j) return pos + delta;
          const rel = pos - startReplace;
          if (oldSegLen <= 0 || newSegLen <= 0) return startReplace;
          const mapped = Math.round((rel * newSegLen) / oldSegLen);
          return startReplace + Math.min(mapped, Math.max(0, newSegLen - 1));
        }

        const doc = code.getDoc();
        const scroll = code.getScrollInfo();
        const fromIdx = doc.indexFromPos(code.getCursor('from'));
        const toIdx = doc.indexFromPos(code.getCursor('to'));
        const newLen = newCode.length;
        const newFrom = Math.max(0, Math.min(mapOffset(fromIdx), newLen));
        const newTo = Math.max(0, Math.min(mapOffset(toIdx), newLen));

        code.setValue(newCode);
        code.setSelection(
          doc.posFromIndex(Math.min(newFrom, newTo)),
          doc.posFromIndex(Math.max(newFrom, newTo))
        );
        code.scrollTo(scroll.left, scroll.top);
      }

      function getFullCode() {
        if (scriptHasConfig) mergeConfigIntoMain();
        return code.getValue();
      }

      function getEffectiveContentLength() {
        if (currentTab === 'config' && scriptHasConfig) {
          if (scriptHasUIConfig && configUIInstance) return code.getValue().trim().length > 0;
          if (configEditor) return (code.getValue().trim().length > 0) || (configEditor.getValue().trim().length > 0);
        }
        return code.getValue().trim().length > 0;
      }

      function reconstructScriptFromSections(sections) {
        if (!sections.hasConfig && !sections.hasDocs) return sections.fullCode;
        let out = '';
        if (sections.preDoc) out += sections.preDoc + '\n\n';
        if (sections.hasDocs) {
          out += '// @DOC_START\n';
          out += (sections.docContent || '').split('\n').map(l => '// ' + (l || '')).join('\n') + '\n';
          out += '// @DOC_END\n\n';
        }
        if (sections.postDocPreConfig) out += sections.postDocPreConfig + '\n\n';
        if (sections.hasConfig) {
          out += (sections.configStartMarker || '// @CONFIG_START') + '\n';
          out += (sections.configContent || '') + '\n';
          out += (sections.configEndMarker || '// @CONFIG_END') + '\n\n';
        }
        if (sections.postConfig) out += sections.postConfig;
        return out;
      }

      function updateTabVisibility(tabs) {
        scriptHasDocs = tabs.indexOf('docs') !== -1;
        scriptHasConfig = tabs.indexOf('config') !== -1;
        const visible = scriptHasDocs || scriptHasConfig;
        if (editorTabsEl) editorTabsEl.classList.toggle('visible', visible);
        [].forEach.call(editorTabsEl ? editorTabsEl.querySelectorAll('.editor-tab') : [], btn => {
          const t = btn.getAttribute('data-tab');
          btn.style.display = tabs.indexOf(t) !== -1 ? 'block' : 'none';
        });
      }

      function switchTab(tabName) {
        currentTab = tabName;
        if (tabScriptEl) tabScriptEl.classList.toggle('active', tabName === 'script');
        if (tabConfigEl) tabConfigEl.classList.toggle('active', tabName === 'config');
        if (tabDocsEl) tabDocsEl.classList.toggle('active', tabName === 'docs');
        if (tabName === 'config' && scriptHasConfig) {
          if (scriptHasUIConfig) {
            if (configCodeContainer) configCodeContainer.style.display = 'none';
            if (configUIContainer) { configUIContainer.style.display = 'flex'; configUIContainer.style.flexDirection = 'column'; }
            const configContent = code && code.getValue ? extractConfigSection(code.getValue(), true) : (parsedSections && parsedSections.configContent) || '';
            initConfigUI(configContent || '');
          } else {
            if (configCodeContainer) configCodeContainer.style.display = 'block';
            if (configUIContainer) configUIContainer.style.display = 'none';
          }
        }
        [].forEach.call(editorTabsEl ? editorTabsEl.querySelectorAll('.editor-tab') : [], btn => {
          btn.classList.toggle('active', btn.getAttribute('data-tab') === tabName);
        });
        if (tabName === 'config' && scriptHasConfig && configEditor) {
          setTimeout(() => { configEditor.refresh(); configEditor.setSize(null, '100%'); }, 10);
        }
        if (tabName === 'script') {
          if (scriptHasConfig && configEditor) mergeConfigIntoMain();
          setTimeout(() => { code.refresh(); code.setSize(null, '100%'); }, 10);
        }
      }

      let structureSyncTimeout = null;

      function scheduleStructureSync() {
        if (structureSyncTimeout) clearTimeout(structureSyncTimeout);
        structureSyncTimeout = setTimeout(function () {
          structureSyncTimeout = null;
          syncScriptStructureFromEditor();
        }, 320);
      }

      /** Re-parse the main editor and refresh docs/config tabs when @DOC_ / @CONFIG_ / @UI_CONFIG_ markers are added or removed (no script re-select needed). */
      function syncScriptStructureFromEditor() {
        if (!code || typeof code.getValue !== 'function') return;

        const hadDocs = scriptHasDocs;
        const hadConfig = scriptHasConfig;
        const hadUI = scriptHasUIConfig;

        const fullCode = getFullCode();
        const next = parseScriptSections(fullCode);
        const nextHasDocs = next.hasDocs;
        const nextHasConfig = next.hasConfig;
        const nextHasUI = !!next.hasUIConfig;

        const structureChanged =
          hadDocs !== nextHasDocs || hadConfig !== nextHasConfig || hadUI !== nextHasUI;

        parsedSections = next;
        scriptHasDocs = nextHasDocs;
        scriptHasConfig = nextHasConfig;
        scriptHasUIConfig = nextHasUI;

        const tabs = [];
        if (nextHasDocs) tabs.push('docs');
        if (nextHasConfig) tabs.push('config');
        tabs.push('script');
        updateTabVisibility(tabs);

        if (structureChanged && nextHasDocs && docsRendererEl) {
          renderSimpleMarkdown(next.docContent || '');
        }

        if (structureChanged && nextHasConfig && configEditor && !nextHasUI) {
          configEditor.setValue(next.configContent || '');
        }

        if (structureChanged && nextHasUI && currentTab === 'config') {
          initConfigUI(next.configContent || '');
        }

        if (currentTab === 'docs' && !nextHasDocs) switchTab('script');
        else if (currentTab === 'config' && !nextHasConfig) switchTab('script');

        updateButtonStates();
      }

      function renderSimpleMarkdown(text) {
        if (!text || !docsRendererEl) return;
        if (typeof window.marked !== 'undefined') {
          try {
            docsRendererEl.innerHTML = window.marked.parse(text, { gfm: true });
            return;
          } catch (e) {
            console.warn('marked parse failed, using fallback', e);
          }
        }
        var escape = function(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
        var html = escape(text)
          .replace(/^### (.+)$/gm, '<h3>$1</h3>')
          .replace(/^## (.+)$/gm, '<h2>$1</h2>')
          .replace(/^# (.+)$/gm, '<h1>$1</h1>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.+?)\*/g, '<em>$1</em>')
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/^- (.+)$/gm, '<li>$1</li>')
          .replace(/(<li>.*?<\/li>\n?)+/g, '<ul>$&</ul>');
        var blocks = html.split(/\n\n+/);
        html = blocks.map(function(block) {
          var t = block.trim();
          if (!t) return '';
          if (t.startsWith('<h') || t.startsWith('<ul')) return t;
          return '<p>' + t.replace(/\n/g, ' ') + '</p>';
        }).join('\n');
        docsRendererEl.innerHTML = html;
      }

      function applyColorScheme() {
        const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = isDark ? 'midnight' : 'default';
        code.setOption('theme', theme);
        if (configEditor) configEditor.setOption('theme', theme);
      }

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyColorScheme);

      // Ensure CodeMirror fills the container properly
      setTimeout(() => {
        applyColorScheme();
        code.refresh();
        code.setSize(null, '100%');
        if (configEditor) { configEditor.refresh(); configEditor.setSize(null, '100%'); }
        
        // Initialize the app after CodeMirror is ready
        init();
      }, 100);

      function post(type, data = {}) {
        // Ensure the message type doesn't get overwritten by data.type
        const { type: dataType, ...cleanData } = data;
        const message = { pluginMessage: { type, ...cleanData } };
        debugLog('Posting message:', type, 'with data keys:', Object.keys(cleanData));
        debugLog('Full message being sent:', JSON.stringify(message, null, 2));
        parent.postMessage(message, '*');
      }

      // Debug logging functions to remove source references
      function debugLog(message, ...args) {
        // const log = console.log.bind(console);
        // setTimeout(() => log('%cCodeFig: ' + message, 'color: #0066cc; font-weight: bold;', ...args), 0);
      }

      function debugError(message, ...args) {
        const error = console.error.bind(console);
        setTimeout(() => error('%cCodeFig: ' + message, 'color: #cc0000; font-weight: bold;', ...args), 0);
      }

      // Update script list in sidebar
      function updateScriptList(searchTerm = '') {
        const filteredScripts = allScripts.filter(script =>
          script.name.toLowerCase().includes(searchTerm.toLowerCase()) &&
          !script.isTemporary // Don't show temporary scripts in the list
        );

        if (filteredScripts.length === 0 && searchTerm) {
          scriptList.innerHTML = '<div class="no-results">No scripts found</div>';
          return;
        }

        // Group scripts by type and sort alphabetically
        const helpScripts = filteredScripts.filter(s => s.type === 'help');
        const prebuiltScripts = filteredScripts.filter(s => s.type === 'prebuilt')
          .sort((a, b) => a.name.localeCompare(b.name));
        const userScripts = filteredScripts.filter(s => s.type === 'user' || s.type === 'library')
          .sort((a, b) => a.name.localeCompare(b.name));

        let html = '';

        // <system-scripts>
        if (helpScripts.length > 0 || prebuiltScripts.length > 0) {
          html += '<div class="system-scripts">';
          
          // Help scripts (no grouping)
          if (helpScripts.length > 0) {
            helpScripts.forEach(script => {
              const isActive = currentScript && currentScript.name === script.name;
              html += `
                <div class="script-item ${isActive ? 'active' : ''}" onclick="selectScript('${script.name}')">
                  <div class="name">${script.name}</div>
                </div>
              `;
            });
          }
          
          // Utility Scripts (with grouping)
          if (prebuiltScripts.length > 0) {
            html += createScriptsWithGroups(prebuiltScripts, 'prebuilt');
          }
          
          html += '</div>'; // Close system-scripts
        }
        
        // <divider>
        if ((helpScripts.length > 0 || prebuiltScripts.length > 0) && userScripts.length > 0) {
          html += '<div class="divider"></div>';
        }

        // <user-scripts>
        if (userScripts.length > 0) {
          html += '<div class="user-scripts">';
          html += createUserScriptsWithGroups(userScripts);
          html += '</div>'; // Close user-scripts
        }

        scriptList.innerHTML = html;
      }

      function createScriptSection(scripts, title, hideHeader = false) {
        let html = '';
        
        if (!hideHeader && title) {
          const headerClass = title === 'Utility Scripts' ? 'utility-scripts' : 'user-scripts';
          const sectionId = title.replace(/\s+/g, '-').toLowerCase();
          const isCollapsed = collapsedSections.has(sectionId);
          const toggleClass = isCollapsed ? 'collapsed' : '';
          
          // Check if any script in this section is selected
          const hasSelectedScript = scripts.some(s => currentScript && currentScript.name === s.name);
          const sectionHeaderClass = hasSelectedScript ? 'selected' : '';
          
          const expandedChevron = `<svg class="chevron-expanded" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 7.5L6 4.5L3 7.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" /></svg>`;
          const collapsedChevron = `<svg class="chevron-collapsed" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" /></svg>`;
          
          html += `
            <div class="section-header ${headerClass} ${sectionHeaderClass}" onclick="toggleSection('${sectionId}')">
              <div class="section-toggle ${toggleClass}">
                ${expandedChevron}
                ${collapsedChevron}
              </div>
              <span>${title}</span>
            </div>
          `;
          
          // Handle regular sections (Utility Scripts, etc.)
          {
            // Regular section for Utility Scripts
            const contentMaxHeight = isCollapsed ? '0' : `${scripts.length * 32 + 20}px`;
            const hasSelectedScript = scripts.some(s => currentScript && currentScript.name === s.name);
            const sectionContentClass = hasSelectedScript ? 'selected' : '';
            
            html += `<div class="section-content ${isCollapsed ? 'collapsed' : ''} ${sectionContentClass}" id="content-${sectionId}">`;
            
            // Use createScriptsWithGroups for proper grouping and alphabetical sorting
            html += createScriptsWithGroups(scripts, 'prebuilt');
            
            html += '</div>';
          }
        }
        
        // Don't add divider here - it's handled in updateScriptList
        
        return html;
      }
      
      function createScriptsWithGroups(scripts, scriptType) {
        let html = '';
        const ungroupedScripts = [];
        const groupedScripts = new Map();
        
        // Parse script names to extract groups and separate grouped/ungrouped scripts
        // Handle all slash variations: Test/Script, Test / Script, Test /Script, Test/ Script, etc.
        scripts.forEach(script => {
          const fullName = script.name;
          
          // Look for any slash (with or without spaces)
          const slashMatch = fullName.match(/^(.+?)\s*\/\s*(.+)$/);
          
          if (slashMatch) {
            // Script has group format - extract and normalize
            const groupName = slashMatch[1].trim();
            const scriptName = slashMatch[2].trim();
            
            // Normalize the full name to standard format "Group / Script"
            const normalizedFullName = `${groupName} / ${scriptName}`;
            
            if (!groupedScripts.has(groupName)) {
              groupedScripts.set(groupName, []);
            }
            groupedScripts.get(groupName).push({
              ...script,
              name: normalizedFullName, // Store normalized name
              displayName: scriptName,
              groupName: groupName
            });
          } else {
            // Ungrouped script
            ungroupedScripts.push({
              ...script,
              displayName: fullName,
              groupName: null
            });
          }
        });
        
        // Create a mixed array of ungrouped scripts and groups for alphabetical sorting
        const allItems = [];
        
        // Add ungrouped scripts
        ungroupedScripts.forEach(script => {
          allItems.push({
            type: 'script',
            name: script.displayName,
            script: script,
            sortKey: script.displayName
          });
        });
        
        // Add groups
        for (const [groupName, groupScripts] of groupedScripts) {
          allItems.push({
            type: 'group',
            name: groupName,
            scripts: groupScripts,
            sortKey: groupName
          });
        }
        
        // Sort all items alphabetically
        allItems.sort((a, b) => a.sortKey.localeCompare(b.sortKey));
        
        // Render items in sorted order
        allItems.forEach(item => {
          if (item.type === 'script') {
            // Render ungrouped script
            const script = item.script;
            const isActive = currentScript && currentScript.name === script.name;
            const scriptClass = scriptType === 'prebuilt' ? 'system-script' : 'user-script';
            html += `
              <div class="script-item ${scriptClass} ${isActive ? 'active' : ''}" onclick="selectScript('${script.name}')">
                <div class="name">${script.displayName}</div>
              </div>
            `;
          } else {
            // Render group
            const groupName = item.name;
            const scripts = item.scripts;
            const groupId = `group-${groupName.replace(/\s+/g, '-').toLowerCase()}`;
            const isGroupCollapsed = collapsedSections.has(groupId);
            const toggleClass = isGroupCollapsed ? 'collapsed' : '';
            const hasSelectedScript = scripts.some(s => currentScript && currentScript.name === s.name);
            const groupHeaderClass = hasSelectedScript ? 'selected' : '';
            const groupClass = hasSelectedScript ? 'selected' : '';
            const expandedChevron = `<svg class="chevron-expanded" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 7.5L6 4.5L3 7.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg>`;
            const collapsedChevron = `<svg class="chevron-collapsed" width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg>`;
            
            html += `
              <div class="script-group ${groupClass}">
                <div class="group-header ${groupHeaderClass}" onclick="toggleSection('${groupId}')">
                  <div class="section-toggle ${toggleClass}">
                    ${expandedChevron}
                    ${collapsedChevron}
                  </div>
                  <span>${groupName}</span>
                </div>
                <div class="group-content ${isGroupCollapsed ? 'collapsed' : ''}" id="content-${groupId}">
            `;
            
            scripts.forEach(script => {
              const isActive = currentScript && currentScript.name === script.name;
              const scriptClass = scriptType === 'prebuilt' ? 'system-script' : 'user-script';
              html += `
                <div class="script-item ${scriptClass} grouped ${isActive ? 'active' : ''}" onclick="selectScript('${script.name}')">
                  <div class="name">${script.displayName}</div>
                </div>
              `;
            });
            
            html += `
                </div>
              </div>
            `;
          }
        });
        
        return html;
      }
      
      // Legacy function for backward compatibility
      function createUserScriptsWithGroups(userScripts) {
        return createScriptsWithGroups(userScripts, 'user');
      }

      // Select script
      function selectScript(scriptName) {
        const script = allScripts.find(s => s.name === scriptName);
        if (script) {
          selectScriptDirectly(script);
        }
      }

      function selectScriptDirectly(script) {
        debugLog('Selecting script:', script);
        currentScript = script;
        const fullCode = script.code || '';
        
        parsedSections = parseScriptSections(fullCode);
        scriptHasDocs = parsedSections.hasDocs;
        scriptHasConfig = parsedSections.hasConfig;
        scriptHasUIConfig = !!parsedSections.hasUIConfig;
        
        const tabs = [];
        if (parsedSections.hasDocs) tabs.push('docs');
        // Show Configuration whenever @CONFIG_START exists — not only when @UI-style `var x =` rows parse to a form (object-literal configs use the code editor).
        if (parsedSections.hasConfig) tabs.push('config');
        tabs.push('script');
        updateTabVisibility(tabs);
        
        if (code && code.setValue) {
          code.setValue(fullCode);
          if (scriptHasConfig && configEditor && !scriptHasUIConfig) {
            configEditor.setValue(parsedSections.configContent || '');
          }
          if (scriptHasDocs && docsRendererEl) {
            renderSimpleMarkdown(parsedSections.docContent || '');
          }
          setTimeout(() => {
            code.refresh();
            code.setSize(null, '100%');
            if (configEditor) { configEditor.refresh(); configEditor.setSize(null, '100%'); }
          }, 10);
        }
        // First view: Configuration if script has config, otherwise Script
        const initialTab = scriptHasConfig ? 'config' : 'script';
        currentTab = initialTab;
        switchTab(initialTab);
        originalCode = fullCode;
        
        // Check if this script uses @InfoPanel
        infoPanelAvailable = checkInfoPanelAvailability(script.code || '');
        updateInfoPanelButtonVisibility();
        updateConfigLoadButtonVisibility();
        // Probe on the *annotation*, not on the button being visible: visibility now depends on
        // what the probe finds, so gating the probe on visibility meant it never ran.
        if (scriptHasFileFields(script.code || '')) probeFoundation();
        
        // The script name already contains the group info if it exists (Group / Script Name)
        scriptTitle.textContent = script.name;
        
        // Only show badge for Utility Scripts, hide for User Scripts
        if (script.type === 'prebuilt') {
          scriptStatus.textContent = 'Utility Script';
          scriptStatus.style.display = 'block';
          // Remove editable class for utility scripts
          scriptTitle.classList.remove('editable');
        } else if (script.type === 'help') {
          scriptStatus.textContent = 'Help';
          scriptStatus.style.display = 'block';
          // Remove editable class for help scripts
          scriptTitle.classList.remove('editable');
        } else {
          // Hide badge for user scripts (including new/temporary scripts)
          scriptStatus.style.display = 'none';
          // Add editable class for user scripts (but not temporary ones)
          if (!script.isTemporary) {
            scriptTitle.classList.add('editable');
          } else {
            scriptTitle.classList.remove('editable');
          }
        }
        
        // Save this as the last opened script (but not for temporary scripts)
        if (!script.isTemporary) {
          post('SET_LAST_OPENED', { name: script.name, scriptType: script.type });
        }
        
        updateButtonStates();
        updateScriptList(searchInput.value);
      }

      // Open the initial script based on last opened or default to Help
      function openInitialScript(lastOpenedScript) {
        let scriptToOpen = null;
        
        if (lastOpenedScript) {
          // Try to find the last opened script by name and type
          scriptToOpen = allScripts.find(s => 
            s.name === lastOpenedScript.name && 
            s.type === lastOpenedScript.type
          );
        }
        
        // If no last opened script or it doesn't exist, default to Help & Documentation
        if (!scriptToOpen) {
          scriptToOpen = allScripts.find(s => s.name === 'CodeFig - help & documentation');
        }
        
        // Fallback to first script if Help & Documentation doesn't exist
        if (!scriptToOpen && allScripts.length > 0) {
          scriptToOpen = allScripts[0];
        }
        
        if (scriptToOpen) {
          selectScriptDirectly(scriptToOpen);
        }
      }

      // Update button states
      function updateButtonStates() {
        const hasContent = !!getEffectiveContentLength();
        const isTemporary = currentScript && currentScript.isTemporary;
        const isPrebuilt = currentScript && (currentScript.type === 'prebuilt' || currentScript.type === 'help');
        const isLibrary = currentScript && currentScript.type === 'library';
        const isEmptyTemporary = isTemporary && !hasContent;

        // Run button: enabled if there's content and not a library (libraries are imported, not run)
        runBtn.disabled = !hasContent || isLibrary;
        runBtn.title = isLibrary ? 'Libraries are imported, not run directly.' : 'Run script (⌘R)';

        // Delete button: enabled for user scripts and libraries that aren't empty temporary scripts
        deleteBtn.disabled = isEmptyTemporary || !currentScript || (currentScript.type !== 'user' && currentScript.type !== 'library');

        // Hide Delete button for prebuilt scripts
        if (isPrebuilt) {
          deleteBtn.style.display = 'none';
        } else {
          deleteBtn.style.display = 'flex';
        }
      }

      // Info Panel functionality
      let infoPanelOpen = false;
      let infoPanelAvailable = false;

      function checkInfoPanelAvailability(scriptCode) {
        // Does the script actually import @InfoPanel? Asked through the shared resolver
        // rather than sniffed with a regex, so this agrees with what a run will do: an
        // @import inside a // @DOC_START block is documentation and does not count. The
        // HELP script used to show this button on the strength of its own import examples.
        //
        // findImports only — never resolveImports: this runs on every keystroke.
        //
        // A missing resolver hides the button instead of throwing. processRuntimeImports
        // is the loud one, on the path where a missing resolver actually breaks something;
        // taking out script loading over a button would be the wrong trade.
        const imports = window.CodeFigImports;
        if (!imports || typeof imports.findImports !== 'function') return false;
        return imports.findImports(scriptCode || '').some(function (imp) {
          return imp.scriptName.indexOf('InfoPanel') !== -1;
        });
      }

      // ---------------------------------------------------------------------
      // Load this file's config, on request
      //
      // The form never fills itself. Nothing here reads the document until the button is
      // pressed, which is what keeps a config you pasted being the config that runs — a
      // property of the design rather than a rule the code has to get right.
      // ---------------------------------------------------------------------

      const configLoadBtn = document.getElementById('configLoadBtn');
      let configLoadInFlight = false;
      let configLoadTimer = null;
      // What the file was last found to hold — the *only* remembered state, and it holds facts
      // rather than conclusions. Everything the button shows is derived from it on the spot by
      // CodeFigConfigUI.configImportState, because three cached booleans computed at three
      // different moments is how the dot ended up contradicting the click.
      let foundationProbe = { checked: false, hasRegistry: false, domains: {}, checkedAt: null };
      // A silent run posts its own CODEFIG_RUN_COMPLETE; without this a re-probe would trigger
      // a probe would trigger a re-probe.
      let skipProbeOnNextRunComplete = false;

      /**
       * Does the open script declare fields that can be loaded from the file? Cheap parse only,
       * never resolveImports — this runs on every keystroke, same rule as the InfoPanel button.
       */
      function currentConfigBlock() {
        if (!scriptHasConfig || !parsedSections || !code || !code.getValue) return '';
        try {
          return extractConfigSection(code.getValue(), !!parsedSections.hasUIConfig) || '';
        } catch (e) {
          return '';
        }
      }

      /** The `@fromFile:` path an object-literal config block declares, or null. */
      function configBlockFromFilePath(content) {
        var match = /@fromFile:\s*([A-Za-z0-9_$.]+)/.exec(content || '');
        return match ? match[1] : null;
      }

      /**
       * Does the open script declare anything loadable? Two spellings: a form field carrying
       * `@fromFile:`, or an object-literal block carrying one for the whole block — which is what
       * all five Design System Foundations scripts use today.
       *
       * Cheap parse only, never resolveImports: this runs on every keystroke, same rule as the
       * InfoPanel button.
       */
      function scriptHasFileFields(scriptCode) {
        if (!scriptHasConfig || !parsedSections) return false;
        var content = currentConfigBlock();
        return !!content && content.indexOf('@fromFile:') !== -1;
      }

      /** The one derived answer. Pure, tested in tests/config-load.test.js. */
      function configImportState() {
        if (!window.CodeFigConfigUI || typeof window.CodeFigConfigUI.configImportState !== 'function') {
          return { visible: false, dot: false, domain: null, reason: 'no-config-ui' };
        }
        return window.CodeFigConfigUI.configImportState(currentConfigBlock(), foundationProbe);
      }

      function configLoadDomain() {
        return configImportState().domain;
      }

      function updateConfigLoadButtonVisibility() {
        if (!configLoadBtn) return;
        // Shown only when there is something to import — never as a button that exists to tell
        // you it has nothing to do.
        const state = configImportState();
        configLoadBtn.style.display = state.visible ? 'flex' : 'none';
        configLoadBtn.classList.toggle('has-update', state.dot);
        if (!state.visible) return;
        configLoadBtn.title = "Import this file's config" +
          (foundationProbe.checkedAt ? ' (found ' + foundationProbe.checkedAt + ')' : '') +
          '. Imports into the editor; the file is unchanged until you run.';
      }

      /** A run nobody sees: no console bridge, no notify, no InfoPanel. */
      function runSilentSnippet(snippet) {
        if (!window.CodeFigImports || typeof window.CodeFigImports.resolveImports !== 'function') return false;
        if (codefigJob.active || codefigRunSession.active || configLoadInFlight) return false;
        let resolved;
        try {
          resolved = processRuntimeImports(snippet);
        } catch (e) {
          return false;
        }
        configLoadInFlight = true;
        post('RUN', { code: resolved, silent: true });
        return true;
      }

      /**
       * What this file has, cheaply: the registry entry, and which domains carry a set manifest.
       * Manifest keys come off each collection's shared plugin data — no variable is read, so
       * this is nothing like the full readFoundation walk the import itself does.
       */
      function probeFoundation() {
        // No once-per-session cache: it is one cheap read, and a CLI run can write a manifest
        // behind this UI's back at any moment. Re-read on script open and after every run.
        runSilentSnippet([
          '@import { parseRegistry, foundationNamespace, foundationRegistryKey } from "@Foundation"',
          '(async function () {',
          '  var ns = foundationNamespace();',
          '  var read = parseRegistry(figma.root.getSharedPluginData(ns, foundationRegistryKey()));',
          '  var collections = await figma.variables.getLocalVariableCollectionsAsync();',
          '  var domains = {};',
          '  for (var i = 0; i < collections.length; i++) {',
          '    var keys = collections[i].getSharedPluginDataKeys(ns) || [];',
          '    for (var k = 0; k < keys.length; k++) {',
          '      var parts = keys[k].split(":");',
          '      if (parts[0] === "set" && parts[1]) domains[parts[1]] = true;',
          '    }',
          '  }',
          '  window.codefigConfigLoadResult({',
          '    probe: true,',
          '    hasRegistry: !!(read.registry && read.registry.viewports.length),',
          '    domains: domains',
          '  });',
          '})();'
        ].join('\n'));
      }

      /** The one channel this UI has for saying something to the user. */
      function configLoadStatus(message) {
        try { post('NOTIFY', { message: message }); } catch (e) {}
      }

      function requestConfigLoad() {
        if (configLoadInFlight) return;
        // The path the block declares tells the sandbox which domain to bridge back into the
        // shape this script reads. No path means the form's own `@fromFile:` rows decide.
        const path = configBlockFromFilePath(currentConfigBlock());
        const domainMatch = /^domains\.([A-Za-z0-9_$]+)/.exec(path || '');
        const domain = domainMatch ? JSON.stringify(domainMatch[1]) : 'null';
        const started = runSilentSnippet([
          '@import { foundationConfigPayload, formatConfigBlock } from "@Foundation"',
          '(async function () {',
          '  var payload = await foundationConfigPayload(' + domain + ');',
          '  window.codefigConfigLoadResult({',
          '    payload: payload,',
          '    block: payload.config ? formatConfigBlock(payload.config) : null',
          '  });',
          '})();'
        ].join('\n'));
        if (!started) {
          configLoadStatus('CodeFig is busy running something — try again in a moment.');
          return;
        }
        configLoadBtn.classList.add('working');
        scriptStatus.textContent = "Importing this file's config…";
        configLoadTimer = setTimeout(function () {
          finishConfigLoad(null, 'Timed out reading this file. Nothing was imported.');
        }, 4000);
      }

      function finishConfigLoad(message, error) {
        configLoadInFlight = false;
        if (configLoadTimer) { clearTimeout(configLoadTimer); configLoadTimer = null; }
        if (configLoadBtn) configLoadBtn.classList.remove('working');
        if (error) {
          if (configLoadBtn) {
            configLoadBtn.classList.add('failed');
            configLoadBtn.classList.remove('has-update');
          }
          scriptStatus.textContent = 'Ready';
          configLoadStatus(error);
          return;
        }
        if (configLoadBtn) configLoadBtn.classList.remove('failed');
        scriptStatus.textContent = 'Ready';
        if (message) configLoadStatus(message);
      }

      /**
       * Apply a loaded config. One click, applied immediately; Cmd-Z takes it back.
       *
       * Two shapes to land in. A form (`var` rows with `@fromFile:`) takes values field by
       * field. An object-literal block takes the whole block, because there is nothing finer
       * to address — which also replaces the comments in it, so the summary says so.
       */
      /**
       * Which set an import came from — "Responsive System · Spacing".
       *
       * Named every time, not only when there is a choice: import behaviour does not change
       * shape with how many configs a file holds. A source is always chosen; with one it is
       * simply preselected. The selector that makes the choice visible belongs to phase 2.
       */
      function configSourceLabel(v1, domain) {
        const slice = (v1 && v1.domains && domain) ? v1.domains[domain] : null;
        const collection = (slice && slice.collection) || (v1 && v1.collection) || null;
        const group = (slice && slice.group) || (v1 && v1.group) || null;
        if (!collection) return null;
        return collection + (group ? ' · ' + group : '');
      }

      function applyLoadedConfig(data) {
        const payload = data && data.payload;
        const v1 = payload && payload.v1 ? payload.v1 : null;

        if (!v1) {
          finishConfigLoad(null, 'This file has no saved config to load. The form is unchanged.');
          return;
        }

        const path = configBlockFromFilePath(currentConfigBlock());

        // Object-literal config: replace the block wholesale, keeping the annotation that makes
        // the button exist at all — losing it would remove the button after one press.
        if (path && !scriptHasUIConfig) {
          if (!data.block) {
            finishConfigLoad(null, 'This file has no saved config for ' + path + '. The config is unchanged.');
            return;
          }
          if (!configEditor) {
            finishConfigLoad(null, 'The configuration editor is not open, so there is nowhere to load into.');
            return;
          }
          configEditor.setValue('  // @fromFile: ' + path + '\n' + data.block);
          mergeConfigIntoMain();
          updateConfigLoadButtonVisibility();
          const blockSource = configSourceLabel(v1, configLoadDomain());
          finishConfigLoad('Imported' + (blockSource ? ' from ' + blockSource : '') +
            '. Comments in the config block were replaced — Cmd-Z restores them. The file is unchanged until you run.');
          return;
        }

        if (!configUIInstance || !window.CodeFigConfigUI || typeof window.CodeFigConfigUI.applyFileConfig !== 'function') {
          finishConfigLoad(null, 'The configuration form is not open, so there is nowhere to load into.');
          return;
        }
        let schema;
        try {
          schema = window.CodeFigConfigUI.parse(currentConfigBlock());
        } catch (e) {
          finishConfigLoad(null, 'Could not read this script\'s config block.');
          return;
        }
        const result = window.CodeFigConfigUI.applyFileConfig(schema, configUIInstance.getValues(), v1);
        if (result.changes.length > 0) {
          configUIInstance.setValues(result.values);
          syncUIToCode(result.values);
        }
        updateConfigLoadButtonVisibility();
        const source = configSourceLabel(v1, configLoadDomain());
        finishConfigLoad((source ? 'Imported from ' + source + '. ' : '') + result.summary);
      }

      function updateInfoPanelButtonVisibility() {
        // Show the InfoPanel button when either:
        // - The current script uses @InfoPanel, OR
        // - We have captured console messages for the last run (so errors are always accessible)
        const hasConsoleMessages = !!(_codefigLastRunConsole && _codefigLastRunConsole.length);
        if (infoPanelAvailable || hasConsoleMessages) {
          infoPanelBtn.style.display = 'flex';
        } else {
          infoPanelBtn.style.display = 'none';
          // Also close panel if it's open
          if (infoPanelOpen) {
            infoPanelOpen = false;
            infoPanel.classList.remove('open');
            infoPanelBtn.classList.remove('active');
          }
        }
      }

      // Initialize button as hidden until a script is loaded
      function initializeInfoPanel() {
        infoPanelBtn.style.display = 'none';
      }

      function toggleInfoPanel() {
        infoPanelOpen = !infoPanelOpen;
        
        if (infoPanelOpen) {
          infoPanel.classList.add('open');
          infoPanelBtn.classList.add('active');
        } else {
          infoPanel.classList.remove('open');
          infoPanelBtn.classList.remove('active');
        }
        
        // Note: State saving would need to be done via message passing to backend
      }



      // Function to select nodes in Figma
      function selectNodes(nodeIds) {
        console.log('UI: selectNodes called with nodeIds:', nodeIds);
        
        // Send message to backend to select nodes
        parent.postMessage({
          pluginMessage: {
            type: 'SELECT_NODES',
            nodeIds: nodeIds
          }
        }, '*');
      }
      
      // Make selectNodes available globally for onclick handlers
      window.selectNodes = selectNodes;

      function displayInfoResults(data) {
        console.log('UI: displayInfoResults called with:', data);
        console.log('UI: Results array length:', data.results ? data.results.length : 'no results');
        
        const { title, results, type = 'info', grouping, showFilters = true, autoClose = false } = data;
        
        // Auto-open the InfoPanel when results are received (only for errors, not for success)
        if (!infoPanel.classList.contains('open') && !autoClose && type !== 'success') {
          console.log('UI: Auto-opening InfoPanel for results');
          toggleInfoPanel();
        }
        
        // Update main panel title (replace "Results & Information")
        const infoTitle = document.querySelector('.info-title');
        if (infoTitle && title) {
          infoTitle.textContent = title;
        }
        
        // Clear previous content
        infoContent.innerHTML = '';

        // Always render the internal error console block at the top (if it has content)
        _codefigRenderConsoleBlock();
        
        // Add filtering controls if grouping is enabled
        if (grouping && showFilters && grouping.modes && grouping.modes.length > 1) {
          const filterContainer = createFilterControls(grouping);
          infoContent.appendChild(filterContainer);
        }
        
        if (!results || results.length === 0) {
          const noResults = document.createElement('div');
          noResults.className = 'info-placeholder';
          noResults.innerHTML = '<p>No results found.</p>';
          infoContent.appendChild(noResults);
          return;
        }
        
        // Store data for filtering
        window.currentInfoData = data;
        
        // Display results (grouped or flat)
        if (grouping) {
          displayGroupedResults(results, grouping, type);
        } else {
          displayFlatResults(results, type);
        }
        
        // Auto-close panel after showing success message (only if panel was already open)
        if (autoClose && infoPanel.classList.contains('open')) {
          console.log('UI: Auto-closing InfoPanel after success message');
          setTimeout(() => {
            toggleInfoPanel();
          }, 2000); // Close after 2 seconds
        }
      }

      function createFilterControls(grouping) {
        const container = document.createElement('div');
        container.className = 'info-filter-controls';
        container.style.cssText = 'margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-light);';
        
        const label = document.createElement('span');
        label.textContent = 'Group by: ';
        label.style.cssText = 'font-size: 11px; color: #666; margin-right: 8px;';
        container.appendChild(label);
        
        grouping.modes.forEach((mode, index) => {
          const button = document.createElement('button');
          button.textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
          button.className = 'filter-btn';
          button.style.cssText = `
            font-size: 10px; 
            padding: 4px 8px; 
            margin-right: 4px; 
            border: 1px solid var(--border-color); 
            background: ${mode === grouping.default ? '#007AFF' : '#fff'}; 
            color: ${mode === grouping.default ? '#fff' : '#333'}; 
            border-radius: 4px; 
            cursor: pointer;
          `;
          
          button.addEventListener('click', () => {
            // Update active state
            container.querySelectorAll('.filter-btn').forEach(btn => {
              btn.classList.remove('active');
            });
            button.classList.add('active');
            
            // Re-render with new grouping
            if (window.currentInfoData) {
              const newGrouping = { ...window.currentInfoData.grouping, default: mode };
              displayGroupedResults(window.currentInfoData.results, newGrouping, window.currentInfoData.type);
            }
          });
          
          container.appendChild(button);
        });
        
        return container;
      }

      function displayFlatResults(results, type) {
        results.forEach(result => {
          const item = document.createElement('div');
          item.className = `info-result-item ${result.severity || type}`;
          
          // Handle custom HTML structure
          if (result.html) {
            item.innerHTML = result.html;
          } else {
            // Standard message/details structure
            const message = document.createElement('div');
            message.className = 'info-result-message';
            // Support HTML content if message contains HTML tags, otherwise use textContent
            if (typeof result.message === 'string' && (result.message.includes('<') || result.message.includes('&'))) {
              message.innerHTML = result.message;
            } else {
              message.textContent = result.message || result.toString();
            }
            item.appendChild(message);
          
          if (result.details) {
            const details = document.createElement('div');
            details.className = 'info-result-details';
            // Support HTML content if details contains HTML tags, otherwise use textContent
            if (typeof result.details === 'string' && (result.details.includes('<') || result.details.includes('&'))) {
              details.innerHTML = result.details;
            } else {
              details.textContent = result.details;
            }
            item.appendChild(details);
          }
          }

          if (result.copyText) {
            const copyRow = document.createElement('div');
            copyRow.className = 'info-copy-row';
            copyRow.style.cssText = 'margin-top: 8px; display: flex; gap: 8px; align-items: center;';
            const copyBtn = document.createElement('button');
            copyBtn.type = 'button';
            copyBtn.className = 'btn secondary';
            copyBtn.textContent = 'Copy to clipboard';
            copyBtn.addEventListener('click', function (e) {
              e.stopPropagation();
              _codefigCopyTextToClipboard(result.copyText);
            });
            copyRow.appendChild(copyBtn);
            item.appendChild(copyRow);
            const pre = document.createElement('pre');
            pre.className = 'info-copy-payload';
            pre.style.cssText = 'margin-top: 8px; max-height: 280px; overflow: auto; padding: 8px; background: var(--bg-secondary, #f5f5f5); border-radius: 4px; font-size: 10px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; user-select: all;';
            pre.textContent = result.copyText;
            item.appendChild(pre);
          }
          
          // Add click handler for node selection (single or multiple)
          if (result.nodeId || result.nodeIds) {
            item.style.cursor = 'pointer';
            item.addEventListener('click', () => {
              if (result.nodeIds && result.nodeIds.length > 0) {
                // Bulk selection
                parent.postMessage({
                  pluginMessage: { type: 'SELECT_NODES', nodeIds: result.nodeIds }
                }, '*');
              } else if (result.nodeId) {
                // Single selection
                parent.postMessage({
                  pluginMessage: { type: 'SELECT_NODE', nodeId: result.nodeId }
                }, '*');
              }
            });
          }
          
          infoContent.appendChild(item);
        });
      }

      function displayGroupedResults(results, grouping, type) {
        // Clear existing results (but keep filter controls)
        const existingResults = infoContent.querySelectorAll('.info-group, .info-result-item');
        existingResults.forEach(el => el.remove());
        
        const currentMode = grouping.default;
        
        // Group the results using built-in logic
        const grouped = groupResultsByMode(results, currentMode, grouping);
        
        // Display each group
        grouped.order.forEach(groupKey => {
          const group = grouped.groups[groupKey];
          
          // Create group header matching Figma design
          const groupHeader = document.createElement('div');
          groupHeader.className = 'info-group-header';
          groupHeader.style.cssText = `
