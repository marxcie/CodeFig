       */
      let _curveRamps = {};
      function rememberCurveRamps(config, byMode) {
        _curveRamps = {};
        if (!config || !byMode) return;
        var names = Array.isArray(config.modes)
          ? config.modes.map(function (m) { return m && m.name; }) : [];
        // Which step the seed sits on. A named placement is what the config says; otherwise it is the
        // step whose colour matches the seed hex, and `-1` when neither is true — an unringed chart is the
        // honest drawing of a collection with no seed in it.
        var steps = Array.isArray(config.tokens) ? config.tokens : [];
        function seedIndexFor(mode, hexes) {
          var placement = mode && mode.seed && mode.seed.placement;
          if (placement) {
            var named = steps.indexOf(String(placement).trim());
            if (named !== -1) return named;
          }
          var want = (mode && mode.seed && mode.seed.hex ? String(mode.seed.hex) : '')
            .trim().replace(/^#/, '').toUpperCase();
          if (!want) return -1;
          for (var h = 0; h < hexes.length; h++) {
            if (String(hexes[h]).replace(/^#/, '').toUpperCase() === want) return h;
          }
          return -1;
        }
        // Every curve in a mode's block draws the same tokens, because they are the same colours seen
        // through a different channel. Keyed per cell so each control can find its own.
        var cells = ['curve', 'chromaCurve', 'saturationCurve', 'hueCurve', 'hslHueCurve'];
        names.forEach(function (name, i) {
          var hexes = name && byMode[name];
          if (!Array.isArray(hexes) || hexes.length < 2) return;
          var entry = { hexes: hexes.slice(), seed: seedIndexFor(config.modes[i], hexes) };
          cells.forEach(function (cell) { _curveRamps['modes[' + i + '].' + cell] = entry; });
        });
        for (var n = 0; n < names.length; n++) {
          var lead = names[n] && byMode[names[n]];
          if (Array.isArray(lead) && lead.length > 1) {
            _curveRamps.curve = { hexes: lead.slice(), seed: seedIndexFor(config.modes[n], lead) };
            break;
          }
        }
      }

      // **There is no "has this been touched yet" flag, deliberately.**
      //
      // There was one, to keep the strip quiet on a fresh load, and it cost a flag, a snapshot, a clearing
      // path and a bug in each — the snapshot it compared against was reassigned before the comparison ran,
      // so a real edit never registered and every edit looked like it did nothing. The quiet load is a
      // *derived* fact now: a mode read out of a file arrives on the Original curve, which generates exactly
      // the file's values, so there is no difference to draw. Ask the question, do not store the answer —
      // the same conclusion the Apply banner reached.

      function requestConfigPreview() {
        _previewTimer = null;
        if (!currentScript) return;
        const fn = scriptPreviewFunction(currentScript.code || '');
        if (!fn) return;

        const readBlock = window.CodeFigConfigUI && window.CodeFigConfigUI.parseConfigBlockObject;
        const config = readBlock ? readBlock(currentConfigBlock()) : null;
        if (!config) {
          // Mid-edit text is unparseable constantly. Holding the last good render beats blinking
          // the picture out on every keystroke.
          if (!_previewLastHtml) renderConfigPreview(
            '<div style="font-size:11px;opacity:0.6;">Waiting for a config this can read.</div>');
          return;
        }

        // The file's values travel *in the config*, so the preview function stays pure: it receives
        // everything it draws and reaches for nothing. `existing` is absent when the panel is pointing at a
        // collection that holds nothing, and the strip then draws the generated ramp alone.
        const held = fileColorsFor(config.collectionName, config.group);
        const forPreview = held ? Object.assign({}, config, { existing: held }) : config;

        const seq = ++_previewSeq;
        const started = runSilentSnippet(
          buildPreviewSnippet(currentScript.code || '', fn, forPreview, configPreviewDomain(), seq));
        // Busy is not a failure: another silent run is in flight and the next edit will ask again.
        if (!started && _previewTimer === null) _previewTimer = setTimeout(requestConfigPreview, 400);
      }

      // ======================================================================
      // AUTO-IMPORT
      //
      // Replaces the import button. The question "is there a config where this panel is pointing"
      // is asked the moment Collection and Group point somewhere, rather than waiting for someone
      // to press an icon whose meaning had to be explained — and whose state was the source of
      // three bugs.
      //
      // **It never overwrites an edit.** It fills while the config is still untouched, and once
      // anything but Collection or Group has been edited it stops filling and offers instead.
      // Filling over typed values silently is the loss the whole import rewrite existed to remove.
      // ======================================================================

      var autoImportTimer = null;
      /** Why the last pristine check answered as it did — read back by `figma:ui readAutoImport`. */
      var lastPristine = { loadable: false, reason: 'not asked yet' };
      var autoImportSeq = 0;
      var fileModesTimer = null;
      // **Its own counter.** The mode-table read used to bump `autoImportSeq`, which is the number the
      // auto-import reply is checked against — so a table read starting while a fill was in flight
      // made the fill's answer look stale and it was dropped on arrival. The symptom was exact and
      // misleading: the chips got their ids (the table reply was fresh) and the config was never
      // filled, which reads as "recognition does not work" rather than "two requests are sharing a
      // sequence number".
      var fileModesSeq = 0;
      /**
       * What auto-import last did, for the bridge to read back.
       *
       * A silent run leaves no trace on purpose — no console bridge, no toast — which is right for
       * something that fires on every address change and wrong when it does not work. Then the only
       * symptom is a config that did not fill, and that has five possible causes: the request was
       * never made, it was refused because the channel was busy, the reply was discarded as stale, the
       * source was `none`, or the fill itself found nothing to do. This says which.
       */
      var lastAutoImport = { at: null, requested: false, refused: false, source: null,
        summary: null, note: null, seq: null };

      /**
       * Write the config block into the canonical text.
       *
       * The same splice `mergeConfigIntoMain` performs, without depending on which tab is showing —
       * because switching tabs to reach the editor is what rebuilt the form, and rebuilding the form
       * is what turned auto-import into a loop.
       */
      /**
       * The last few block writes, with who made them.
       *
       * "The order is wrong" has as many candidate causes as there are writers of this block — a fill,
       * a reorder, a chip edit, a suggestion, the form syncing itself — and from outside they are
       * indistinguishable. Recording the writer and the resulting mode order turns that into a reading.
       */
      var blockWrites = [];

      function writeConfigBlockText(text, by) {
        if (!scriptHasConfig || !parsedSections || !code) return;
        var mainCode = code.getValue();
        var startMarker = parsedSections.configStartMarker || '// @CONFIG_START';
        var endMarker = parsedSections.configEndMarker || '// @CONFIG_END';
        var i = mainCode.indexOf(startMarker);
        var j = mainCode.indexOf(endMarker);
        if (i === -1 || j === -1 || j <= i) return;
        var next = mainCode.slice(0, i + startMarker.length) + '\n' +
          text.replace(/\n\s*$/, '') + '\n' + mainCode.slice(j);
        if (next === mainCode) return;
        code.setValue(next);
        if (configEditor) configEditor.setValue(currentConfigBlock());

        // **And bring the form with it.** `mergeConfigIntoMain` treats the form as authoritative
        // while the Configuration UI tab is the view you are in — which is right for something you
        // typed, and wrong for text written behind the form's back. Auto-import filled the block
        // correctly and the very next merge (an autosave through `getFullCode`, a preview, any
        // change at all) serialised the form's *old* values straight back over it. The trace read
        // `filled: 1440, afterWrite: 1440, later: 1920` — the write landed and was undone.
        //
        // Here rather than in each caller: this is the only place that writes the block
        // programmatically, so this is the only place that can guarantee the two agree. Rendering
        // fires no change event, so it cannot start the load loop that a tab switch once did.
        blockWrites.push({
          by: by || 'unknown',
          at: new Date().toLocaleTimeString(),
          modes: (text.match(/name: "([^"]+)"/g) || []).map(function (m) {
            return m.slice(7, -1);
          }).join(' \u2192 ')
        });
        if (blockWrites.length > 8) blockWrites.shift();

        if (isConfigTab(currentTab) && configUIInstance) projectConfigIntoForm();

        // **And the preview with it.** The form was brought along; the strip was not, and it is the third
        // thing that has to agree with this text. Every *other* caller happens to pair its write with
        // `scheduleConfigPreview()`; auto-import — the one write nobody asks for — did not, so reading a
        // collection filled every field and left the ramp showing the pristine block: eleven placeholder
        // steps and a neutral grey, under a palette full of the file's own numbers. It caught up on the next
        // keystroke, which is what made this look like "the palette only loads when I edit it".
        //
        // Here for the same reason the projection is here: this is the only place that writes the block
        // programmatically, so it is the only place that can guarantee the three agree. Debounced, so the
        // callers that already ask cost nothing.
        scheduleConfigPreview();
      }

      /** The note under Group, which is where the answer belongs. */
      /**
       * Why an address came back with nothing, in one line.
       *
       * The recogniser already knows — a declined group, a mode the collection does not have, too few steps —
       * so this reads its record rather than guessing. A silent no-answer is indistinguishable from a
       * successful one that changed nothing, and the values on screen belong to wherever the panel pointed
       * last.
       */
      function nothingReadNote(found) {
        if (!found) return null;
        var recognition = found.recognition;
        if (recognition && recognition.declined) return recognition.declined;

        var where = String(found.collection || 'that collection');
        if (recognition && recognition.modes) {
          var reasons = [];
          Object.keys(recognition.modes).forEach(function (name) {
            var per = recognition.modes[name];
            if (per && per.found) return;
            var why = (per && per.notes && per.notes.length) ? per.notes[0] : null;
            reasons.push(why || ('Nothing read for ' + name + '.'));
          });
          if (reasons.length) {
            return 'Nothing read from ' + where + '. ' + reasons[0] +
              (reasons.length > 1 ? ' (' + (reasons.length - 1) + ' more.)' : '') +
              ' The values below are the ones already in the block.';
          }
        }
        if (found.candidates && found.candidates.length) return null;
        return 'Nothing read from ' + where +
          '. The values below are the ones already in the block.';
      }

      function setAutoImportNote(text) {
        var container = document.getElementById('configUIContainer');
        if (!container) return;
        var groupField = container.querySelector('[data-field="group"]');
        var wrap = groupField && groupField.closest ? groupField.closest('.config-ui-field') : null;
        var existing = document.getElementById('autoImportNote');
        if (!text) {
          if (existing) existing.remove();
          return;
        }
        var note = existing;
        if (!note) {
          note = document.createElement('div');
          note.id = 'autoImportNote';
          note.className = 'config-ui-field-note';
        }
        note.textContent = text;
        if (wrap && note.parentNode !== wrap) wrap.appendChild(note);
        else if (!wrap && note.parentNode !== container) container.appendChild(note);
      }

      function scheduleAutoImport() {
        if (autoImportTimer) clearTimeout(autoImportTimer);
        autoImportTimer = setTimeout(requestAutoImport, 350);
      }

      /**
       * Read the file's modes for the address the panel is already showing.
       *
       * **Opening a panel has to do this**, and it took the plugin to notice. Auto-import fires only
       * when Collection or Group *changes* — the rule that stopped it rebuilding the form in a loop —
       * so opening Grid on a file whose collection already exists read no mode table at all. Every
       * chip then carried no `modeId`, and the first rename was an add with the real mode orphaned:
       * precisely the failure the ids exist to prevent.
       *
       * Safe to do on render, because it **writes nothing**. The loop came from applying a *fill*,
       * which rewrote the config and re-rendered the form; this only asks what modes the collection
       * has. Retried rather than dropped when the channel is busy: the preview's debounce owns that
       * slot about half the time on script open, and one silent run may be in flight.
       */
      function scheduleFileModes(attempt) {
        if (fileModesTimer) clearTimeout(fileModesTimer);
        fileModesTimer = setTimeout(function () {
          fileModesTimer = null;
          if (!scriptHasConfig || !configUIInstance) return;
          if (!configUIContainer || !configUIContainer.querySelector('[data-chips-field]')) return;
          var collection = configUIInstance.getValues().collectionName;
          if (!collection || !String(collection).trim()) return;
          if (fileModes.collection === collection && fileModes.found &&
              fileModes.document === currentDocumentId) {
            return;
          }
          // An auto-import is already queued, and it brings the table with it. Asking again would be
          // a second read of the same thing and a second thing to sequence.
          if (autoImportTimer) return;

          var seq = ++fileModesSeq;
          var started = runSilentSnippet([
            '@import { foundationCollectionModes } from "@Foundation"',
            '(async function () {',
            '  var modes = await foundationCollectionModes(' + JSON.stringify(collection) + ');',
            '  window.codefigConfigLoadResult({ fileModes: modes, fileModesSeq: ' + seq + ' });',
            '})();'
          ].join('\n'));
          if (!started && (attempt || 0) < 4) scheduleFileModes((attempt || 0) + 1);
        }, 400);
      }

      /**
       * Ask what is at this address.
       *
       * `detectOnly` asks the read-only half of the question: where a grid *is*, and what modes the
       * collection has. It exists because **opening a panel is not an address change**, and detection
       * lived inside the fill — so finding the group required changing the very field detection was
       * meant to fill.
       *
       * It deliberately does not fill. Auto-import's safety property is entirely in its trigger:
       * choosing a Collection or Group is the instruction, and nothing else fills over what you have.
       * Opening a script is not that instruction, and Márton's own description of the flow — *"when I
       * open CodeFig and select Grid, of course it shows the default selection"* — is the behaviour to
       * keep. So opening may *move the address* when the address points at nothing, announce it, and
       * let the ordinary rule do the loading.
       */
      /**
       * Put the panel back to this script's defaults, keeping only the address that was just chosen.
       *
       * **Clear first, read second.** Márton's rule, and symptom 3 is what it is for: pointing the panel at
       * a different collection fired a read, the read returned nothing, and the previous collection's
       * modes, curves, anchors and steps stayed on screen. That is the difference between *this collection
       * has no ramp* and *here is someone else's ramp*, and the panel was saying the second. Values read
       * from one set of variables mean nothing against another.
       *
       * Defaults come from `originalCode` — the script exactly as it was opened — rather than from the block
       * on screen. A prebuilt script never autosaves, so for the shipped panels that is the shipped source;
       * for a user's own script it is their saved version, which is the right default for them.
       *
       * Runs inside the auto-import debounce rather than on the change itself: typing a group name is one
       * address change per keystroke, and rebuilding the form under the caret on each of them would make the
       * field impossible to type into.
       */
      /**
       * The pristine block for an address — **computed, not written**.
       *
       * It used to write immediately, before the read went out, so that a read finding nothing left an empty
       * panel. The end state was right and the route to it was two writes: pristine, then the fill. Two
       * writes are two form rebuilds, and because pristine clears the token list, the first one *collapses*
       * every section gated on it and the second expands them again. That is the layout jump.
       *
       * So the text is prepared here and applied once, when the answer arrives — filled onto if there is
       * something to fill, written bare if there is not. Same end state, one rebuild, no collapse.
       */
      function pristineConfigForAddress(collection, group) {
        var api = window.CodeFigConfigUI;
        if (!api || !originalCode || !parsedSections) return null;
        var pristine = '';
        try {
          pristine = extractConfigSection(originalCode, !!parsedSections.hasUIConfig) || '';
        } catch (e) {
          return false;
        }
        if (!pristine) return null;
        var filled = api.fillConfigBlock(pristine, {
          collectionName: collection,
          group: group == null ? '' : group
        });
        if (!filled || !filled.text) return null;
        // Already at defaults for this address — the first collection anyone picks, or a retry. Nothing to
        // apply, so the caller keeps whatever is on screen.
        if (filled.text.trim() === currentConfigBlock().trim()) return null;
        return filled.text;
      }

      /** The collection the last real read was for, so a change of collection can drop a stale group. */
      var lastReadCollection = null;
      /** The pristine block for the address being read, applied when the answer lands. */
      var pendingPristine = null;

      function requestAutoImport(attempt, detectOnly) {
        autoImportTimer = null;
        if (!scriptHasConfig || !configUIInstance) return;
        var values = configUIInstance.getValues();
        var collection = values.collectionName;
        var group = values.group;
        // Both have to point somewhere. Half an address is not a question worth asking.
        if (!collection || typeof collection !== 'string' || !collection.trim()) {
          setAutoImportNote(null);
          return;
        }
        var domain = configPreviewDomain();
        if (!domain) return;

        // **A group belongs to the collection it was typed for.** Point the panel somewhere else and the
        // old group name is a path into a collection that no longer applies: it reads nothing, and the panel
        // reports a miss for an address nobody asked about.
        //
        // Cleared *here* rather than on the change itself, because this is already the one place that
        // rewrites the block for a new address — doing it in `onChange` cost a second write and a second
        // form rebuild, outside the debounce this function exists to sit inside.
        if (!detectOnly && collection !== lastReadCollection) group = '';
        if (!detectOnly) lastReadCollection = collection;

        // **A real read answers the group probe too, so it does not run a second one.**
        //
        // `scheduleGroupDetection` fires on every form render and, on a pristine block, asks for a *full*
        // import — which for one collection selection is the whole cycle twice: reset, fill, rebuild, reset,
        // fill, rebuild. It already dedupes by address, so the fix is for the ordinary load to claim the
        // address it is about to read. (Claiming it here rather than on the way out because the probe is
        // scheduled by the form rebuild this read causes, which happens before any result arrives.)
        if (!detectOnly) detectedFor[collection + '\u0000' + (group == null ? '' : group)] = true;

        // Before the read, never after: a read that finds nothing has to leave an empty panel. `detectOnly`
        // is the group-detection probe, which asks a question about an address the panel is already on and
        // must not throw away what is there.
        pendingPristine = detectOnly ? null : pristineConfigForAddress(collection, group);

        var seq = ++autoImportSeq;
        lastAutoImport = { at: new Date().toLocaleTimeString(), requested: true, refused: false,
          detectOnly: !!detectOnly, source: null, summary: null, note: null, seq: seq };
        // **One read, two answers.** The recorded config and the collection's live mode table are
        // both needed the moment the address resolves, and only one silent run may be in flight —
        // two snippets would mean the second is refused about half the time.
        //
        // The script's own `@import` lines come first, the same way `buildPreviewSnippet` does it, and
        // for the same reason: `@import` follows calls only *within* one source file, so a library
        // function that calls into another library resolves in its **consumer's** context.
        // `gridRecognise` calls `calculateColumnWidth` from `@Core Library`; the open script already
        // imports it and is checked by `validateResolvedCalls`. Hand-listing it here would be a second
        // list to forget — and the failure is a `ReferenceError` swallowed by a caller's try/catch,
        // seen as "recognition does nothing".
        // **Colours asks a different function, and passes the modes it wants.** A COLOR variable has a value
        // per mode, so there is no one answer for a collection — and the modes worth reading are the ones the
        // panel has blocks for. A collection mode with no block is the alignment report's business.
        //
        // Its own function rather than a branch inside `foundationAutoImport`, because extraction follows a
        // function's calls within its own file: a colours branch in there dragged `@OKLCH` into every
        // consumer, Grid's spec included, and the validator caught it as an unresolvable call.
        var colourModes = (domain === 'colors') ? modeNamesInConfig() : [];
        var importLine = domain === 'colors'
          ? '@import { foundationColorsAutoImport, foundationCollectionModes } from "@Foundation"'
          : '@import { foundationAutoImport, foundationCollectionModes } from "@Foundation"';
        var call = domain === 'colors'
          ? '  var found = await foundationColorsAutoImport(' +
            JSON.stringify(collection) + ', ' + JSON.stringify(group == null ? '' : group) + ', ' +
            JSON.stringify(colourModes) + ', ' + JSON.stringify(colorModelInConfig()) + ');'
          : '  var found = await foundationAutoImport(' +
            JSON.stringify(collection) + ', ' + JSON.stringify(group == null ? '' : group) + ', ' +
            JSON.stringify(domain) + ');';

        var started = runSilentSnippet(scriptImportLines().concat([
          importLine,
          '(async function () {',
          call,
          '  var modes = await foundationCollectionModes(' + JSON.stringify(collection) + ');',
          '  window.codefigConfigLoadResult({',
          '    autoImport: found, fileModes: modes, autoImportSeq: ' + seq + ',',
          '    detectOnly: ' + (detectOnly ? 'true' : 'false'),
          '  });',
          '})();'
        ]).join('\n'));
        // **Refused is not the same as failed, and it used to look the same.** One silent run may be
        // in flight, and the live preview is debounced 50ms behind this — so a fill could simply be
        // dropped on the floor whenever the preview got there first. Retried rather than lost.
        if (!started) {
          lastAutoImport.refused = true;
          if ((attempt || 0) < 4) {
            autoImportTimer = setTimeout(function () {
              autoImportTimer = null;
              requestAutoImport((attempt || 0) + 1, detectOnly);
            }, 400);
          }
        }
      }

      /**
       * The file's modes for the chosen collection: the moment ids enter the panel.
       *
       * Re-seeding the id list from names is right **here and only here** — a config that has just
       * been read from the file, or is about to be, agrees with the file by definition, so matching by
       * name is sound. Everywhere after this the link is positional and travels with the operation,
       * because a renamed chip no longer matches the name the file has for its mode.
       *
       * A different collection is a different question: whatever was going to be removed from the old
       * one is not going to be removed from this one.
       */
      function applyFileModes(table) {
        var next = table && Array.isArray(table.modes)
          ? table
          : { document: null, collection: null, collectionId: null, modes: [], found: false };
        if (next.document) currentDocumentId = next.document;
        // A different collection *or* a different one wearing the same name: either way, whatever was
        // going to be removed from the old one is not going to be removed from this — and a mode
        // somebody asked for *there* is not a mode they asked for *here*. Both intents belong to an
        // address, so both are dropped when the address changes.
        var changedCollection = next.collection !== fileModes.collection ||
          next.document !== fileModes.document ||
          next.collectionId !== fileModes.collectionId;
        fileModes = next;
        if (changedCollection) {
          removedModeIds = [];
          addedModeNames = [];
        }

        chipModeIds = window.CodeFigConfigUI.matchModeIds(configModeEntries(), fileModes.modes);
        syncChipsToPanelState();
      }

      /**
       * Put the config's modes in the collection's order, and write it if that changed anything.
       *
       * Called after a load rather than during one, because a fill inserts entries in the *incoming*
       * config's order — so reordering first would be undone by the fill that follows. Both load paths
       * end here.
       *
       * Writing the block on load is deliberate and bounded: it happens only when the order actually
       * differs, `writeConfigBlockText` returns early when the text is unchanged, and the reorder is
       * idempotent — so this cannot become the rebuild loop that auto-import once was.
       */
      var lastOrdering = null;

      /**
       * The same block text, with its modes in the collection's order.
       *
       * **Takes the text rather than reading it**, and that is the whole point. This used to be a step
       * that ran after a fill and re-read the block for itself — and it read the block as it was
       * *before* the fill: `entries: 3, from "desktop → tablet → mobile", changed: false`, recorded in
       * the same second as a write of five modes in the wrong order. Two writers and one stale read.
       *
       * Now the caller hands over the text it is about to write, this returns the ordered version, and
       * **one write** carries both. There is no window between them to lose.
       */
      function orderedModesInBlock(text) {
        var api = window.CodeFigConfigUI;
        var answer = { text: text, changed: false };
        // Cleared on the way in, so an early exit cannot leave the previous call's answer standing for
        // the caller to report as this one's.
        lastInsertedModes = [];
        lastDroppedModes = [];
        function record(extra) {
          lastOrdering = { at: new Date().toLocaleTimeString() };
          for (var k in extra) lastOrdering[k] = extra[k];
        }
        if (!api || !api.alignModesToFile) { record({ skipped: 'no config-ui' }); return answer; }
        if (!fileModes.found) { record({ skipped: 'no file modes' }); return answer; }

        var wrap = configUIContainer && configUIContainer.querySelector('[data-chips-field]');
        var field = (wrap && wrap.getAttribute('data-chips-field')) || 'modes';
        var schema;
        try {
          schema = api.parse(text);
        } catch (e) {
          record({ skipped: 'block does not parse' });
          return answer;
        }
        var row = (schema.rows || []).filter(function (r) {
          return r.type === 'field' && r.name === field && Array.isArray(r.value);
        })[0];
        // Every exit records something. The bug above hid *because* the early exits recorded nothing,
        // so a stale success from an earlier call was the answer the instrument gave.
        if (!row) { record({ skipped: 'no "' + field + '" array in the block' }); return answer; }

        // Both intents travel with it, and they have to: neither "I took that one out" nor "I asked for
        // that one" can be read off a config, and each one's absence turns into the panel undoing
        // something a moment after it was done.
        var out = api.alignModesToFile(row.value, chipModeIds, fileModes.modes, {
          removedIds: removedModeIds, addedNames: addedModeNames
        });
        chipModeIds = out.ids;
        record({
          entries: row.value.length,
          from: row.value.map(function (e) { return e && e.name; }).join(' \u2192 '),
          to: out.entries.map(function (e) { return e && e.name; }).join(' \u2192 '),
          inserted: (out.inserted || []).join(', '),
          dropped: (out.dropped || []).join(', '),
          changed: out.changed
        });
        lastInsertedModes = out.inserted || [];
        lastDroppedModes = out.dropped || [];
        if (!out.changed) return answer;

        var values = {};
        values[field] = out.entries;
        answer.text = api.serialize(schema, values);
        answer.changed = true;
        return answer;
      }

      /**
       * `A`, `A and B`, `A, B and C` — a list a person reads rather than one a loop produced.
       *
       * `join(' and ')` was fine while every note named one or two modes and wrong the moment a
       * collection had three: *"Desktop and Pad and Mobile had no settings here"*, which is the sort of
       * sentence that makes the rest of a panel look unfinished.
       */
      function nameList(names) {
        var list = (names || []).filter(function (name) { return name; });
        if (list.length === 0) return '';
        if (list.length === 1) return String(list[0]);
        return list.slice(0, -1).join(', ') + ' and ' + list[list.length - 1];
      }

      /**
       * What the panel added to itself, in one line.
       *
       * Said out loud because it is a write nobody asked for, and because the numbers in a new block are
       * a **copy of a neighbouring mode**, not a reading of the file — a tab that appears with plausible
       * values on it and no explanation is worse than one that appears with a sentence under it.
       */
      function insertedModesNote(names, gone) {
        var added = names || [];
        var removed = gone || [];
        if (!added.length && !removed.length) return null;
        var where = fileModes.collection || 'this collection';
        var parts = [where + ' has ' + fileModes.modes.length + ' modes.'];
        if (added.length) {
          parts.push(nameList(added) + ' had no settings here, so ' +
            (added.length === 1 ? 'a block was' : 'blocks were') +
            ' added from the nearest mode — the values are a starting point, not this file’s.');
        }
        // **Named, always.** A dropped block takes settings with it, and a removal nobody can see is the
        // one thing this area has repeatedly got wrong. Saying which mode it was is also the only way
        // someone can tell residue from a config they pasted for a different collection.
        if (removed.length) {
          parts.push(nameList(removed) +
            (removed.length === 1 ? ' is not a mode' : ' are not modes') + ' of it, so ' +
            (removed.length === 1 ? 'that block was' : 'those blocks were') +
            ' removed — nothing is created for a mode this collection does not have.');
        }
        return parts.join(' ');
      }

      /**
       * For a load that brought no config of its own: align what the block already holds to the file.
       *
       * → what the alignment added and dropped, for the caller to say something about. The note is the
       * caller's because the two callers have different things to say: the read-only probe has only
       * this to report, while a load that found nothing has to say that first.
       */
      function orderConfigModesToFile() {
        var out = orderedModesInBlock(currentConfigBlock());
        var moved = { added: lastInsertedModes.slice(), dropped: lastDroppedModes.slice() };
        if (out.changed) {
          writeConfigBlockText(out.text,
            moved.added.length || moved.dropped.length ? 'order+modes' : 'order');
        } else {
          syncChipsToPanelState();
        }
        return moved;
      }

      /** The config's per-mode array, or [] — read from the block, which is the truth. */
      function configModeEntries() {
        if (!window.CodeFigConfigUI) return [];
        var wrap = configUIContainer && configUIContainer.querySelector('[data-chips-field]');
        var field = (wrap && wrap.getAttribute('data-chips-field')) || 'modes';
        try {
          var schema = window.CodeFigConfigUI.parse(currentConfigBlock());
          var row = (schema.rows || []).filter(function (r) {
            return r.type === 'field' && r.name === field;
          })[0];
          return row && Array.isArray(row.value) ? row.value : [];
        } catch (e) {
          return [];
        }
      }

      /**
       * What this run should do to the collection's modes, or null when there is nothing to say.
       *
       * Sent with the run rather than written into the config, because a `modeId` must never end up in
       * text someone pastes into another file.
       */
      function currentModeIntents() {
        if (!window.CodeFigConfigUI || !window.CodeFigConfigUI.modeIntents) return null;
        if (!configUIContainer || !configUIContainer.querySelector('[data-chips-field]')) return null;
        if (!fileModes.found) return null;
        var intents = window.CodeFigConfigUI.modeIntents(
          fileModes.collection, configModeEntries(), chipModeIds, fileModes.modes, removedModeIds
        );
        if (!intents.renames.length && !intents.removals.length) return null;
        return intents;
      }

      /**
       * Apply what auto-import found, or offer it.
       *
       * Filling goes through `fillConfigBlock`, the same path the import button used: values
       * substituted in place, comments and key order kept, entries inserted and removed with what
       * was written for them. So an auto-import is as non-destructive as a manual one was.
       */
      /**
       * Groups this panel has already been sent to, so it can never be sent to one twice.
       *
       * The guard, not a cache. Adopting a group triggers a fresh load at the new address; if that
       * address also came back empty, adopting again would be a loop with a document read in it.
       */
      var groupsAdopted = {};
      /** Addresses this panel has already asked about, so opening a script asks once and not again. */
      var detectedFor = {};

      /**
       * Ask where the grid is, once per address, when the panel opens on one.
       *
       * Bounded on purpose. The original loop was *fill* → re-render → fill; this asks a read-only
       * question, and the one thing it may write — the Group field — is guarded twice: once here, and
       * once by `groupsAdopted` inside the offer.
       */
      function scheduleGroupDetection() {
        if (!scriptHasConfig || !configUIInstance) return;
        if (!configUIContainer || !configUIContainer.querySelector('[data-chips-field]')) return;
        var values = configUIInstance.getValues();
        var collection = values.collectionName;
        if (!collection || !String(collection).trim()) return;
        var key = collection + '\u0000' + (values.group == null ? '' : values.group);
        if (detectedFor[key]) return;
        detectedFor[key] = true;
        if (autoImportTimer) clearTimeout(autoImportTimer);
        // **An untouched block loads the set; an edited one is left alone.**
        //
        // A full import overwrites the block, which is why opening a script only ever ran the read-only
        // half — and the consequence was that a file with a recorded set showed the *shipped defaults*
        // instead. Ten typography token names over the four the file holds, and a Spacing manifest naming
        // desktop/tablet/mobile while the panel drew the starter mode.
        //
        // The missing distinction is whether there is anything to overwrite, and that is derivable: the
        // script's own embedded source is the pristine block, so a block equal to it — bar the address,
        // which choosing is what got us here — has nothing in it anybody typed. Load into that, and leave
        // an edited block for the person who edited it.
        // **Asked when the timer fires, not when it is set.** Scheduling happens during the render of the
        // script being opened, and `originalCode` can still be the *previous* script's at that moment — so
        // the check compared this block against that source and reported keys neither of them shares
        // (`edited: extensionColumns, spacings` — one Grid's, one Spacing's). Four hundred milliseconds
        // later everything has settled, which is the whole reason the delay is there.
        autoImportTimer = setTimeout(function () {
          requestAutoImport(0, !configBlockIsPristine());
        }, 400);
      }

      /**
       * Has anybody typed anything into this block, or is it still the script's own defaults?
       *
       * **Compared as values, not as text.** Three things edit the block before this question is ever
       * asked — the address, and the mode list, which is reordered and renamed to match the collection the
       * moment a panel opens. A text comparison therefore calls every block in every real file "edited"
       * and loads nothing, which is exactly what it did.
       *
       * So the address is ignored, and each mode is compared to the **shipped starter mode** with the name
       * left out: a file with three modes all still carrying the starter's settings has had nothing typed
       * into it, whatever those three modes are called. Everything else must match outright.
       */
      function configBlockIsPristine() {
        // Why it decided what it decided, for `figma:ui readAutoImport`. Every `false` here is a panel
        // quietly not loading a set that exists, and from outside they all look identical.
        lastPristine = { loadable: false, reason: null };
        function no(reason) { lastPristine.reason = reason; return false; }

        var api = window.CodeFigConfigUI;
        if (!api || !api.parseConfigBlockObject) return no('no parser');
        if (!originalCode || !parsedSections) return no('no source yet');
        var pristineText = '';
        try {
          pristineText = extractConfigSection(originalCode, !!parsedSections.hasUIConfig) || '';
        } catch (e) {
          return no('source unreadable');
        }
        if (!pristineText) return no('no config block in the source');

        var shipped = api.parseConfigBlockObject(pristineText);
        var current = api.parseConfigBlockObject(currentConfigBlock());
        if (!shipped) return no('shipped block did not parse');
        if (!current) return no('current block did not parse');

        var ignore = { collectionName: true, group: true, modes: true };
        var keys = {};
        Object.keys(shipped).forEach(function (k) { keys[k] = true; });
        Object.keys(current).forEach(function (k) { keys[k] = true; });
        var changed = Object.keys(keys).filter(function (k) {
          if (ignore[k]) return false;
          return JSON.stringify(shipped[k]) !== JSON.stringify(current[k]);
        });
        if (changed.length) return no('edited: ' + changed.join(', '));

        var starter = Array.isArray(shipped.modes) && shipped.modes.length ? shipped.modes[0] : null;
        var have = Array.isArray(current.modes) ? current.modes : [];
        function withoutName(mode) {
          var out = {};
          Object.keys(mode || {}).sort().forEach(function (k) { if (k !== 'name') out[k] = mode[k]; });
          return JSON.stringify(out);
        }
        if (!starter) {
          if (have.length) return no('modes added to a block that ships none');
          lastPristine.loadable = true;
          return true;
        }
        var want = withoutName(starter);
        var off = have.filter(function (mode) { return withoutName(mode) !== want; });
        if (off.length) {
          return no('mode edited: ' + withoutName(off[0]) + ' vs shipped ' + want);
        }
        lastPristine.loadable = true;
        return true;
      }

      /**
       * Nothing where the panel is pointing, but a grid is somewhere in this collection.
       *
       * **One candidate: go there.** Márton's point is that a numbered column series *is* a grid, so
       * finding it is a search rather than a question, and a panel that sits on an empty default while
       * the answer is one field away is being coy. The Group field is the address, so this changes the
       * address and lets the ordinary load happen — no second loading path.
       *
       * **More than one: say so and touch nothing.** Two grids in a collection means the choice is
       * real, and picking the bigger one would be a guess dressed as help.
       */
      function offerGridGroup(found) {
        var candidates = (found && found.candidates) || [];
        if (!candidates.length) return false;

        var where = fileModes.collection || '';
        if (candidates.length > 1) {
          setAutoImportNote('No ' + configPreviewDomainLabel() + ' set under this group. This ' +
            'collection has one under ' +
            nameList(candidates.map(function (c) { return c.group || '(no group)'; })) +
            ' — set Group to the one you want.');
          return true;
        }

        var target = candidates[0].group;
        var key = where + '\u0000' + target;
        if (groupsAdopted[key]) return false;
        groupsAdopted[key] = true;

        var api = window.CodeFigConfigUI;
        if (!api) return false;
        var schema;
        try {
          schema = api.parse(currentConfigBlock());
        } catch (e) {
          return false;
        }
        var groupRow = (schema.rows || []).filter(function (r) {
          return r.type === 'field' && r.name === 'group';
        })[0];
        if (!groupRow) return false;

        writeConfigBlockText(api.serialize(schema, { group: target }), 'group-detected');
        setAutoImportNote('No ' + configPreviewDomainLabel() + ' set under that group. This ' +
          'collection has one under ' + (target || 'no group') + ' (' + candidates[0].columns +
          ' columns), so Group was set to it.');
        // The address changed, so ask again — the ordinary load, at the new address.
        scheduleAutoImport();
        return true;
      }

      function applyAutoImport(found) {
        lastAutoImport.source = found ? found.source : 'no-answer';

        // **Remembered whatever the answer was, including nothing.** The comparison strip must not keep
        // drawing the last collection's colours under the new one's ramp, and a declined or empty answer is
        // exactly when that would happen — so this runs before the early return rather than after it.
        if (found && found.collection !== undefined) {
          rememberFileColors(found.collection, found.group, found.existing);
          rememberCurveRamps(found.config, found.existing);
          scheduleConfigPreview();
        }

        if (!found || !found.config ||
            (found.source !== 'recorded' && found.source !== 'recognised')) {
          if (offerGridGroup(found)) return;
          // **The modes are still read, because they were never the manifest's to give.** This branch used
          // to return here, and choosing a collection from the dropdown is exactly what reaches it — so a
          // five-mode collection with no recorded set left the panel on the script's three modes, and the
          // only pass that aligned them was the probe that runs when a script opens. Two paths, one of
          // which quietly did less than the other.
          var onMiss = orderConfigModesToFile();
          // **Say that nothing was read.** Clearing the note leaves the panel pointing at one collection while
          // showing another's numbers, with no sign of it — which is how every mismatch this panel has had
          // stayed hidden. Pointing at `color - moss` with blocks named Granite and Moss read nothing, changed
          // nothing, and said nothing; the steps and the ladder still described the collection before it.
          //
          // Both sentences, in that order: the settings were not read, *and* here is what the modes did. One
          // without the other is a half-answer, and the half that goes missing is whichever was written last.
          // Nothing to fill, so the prepared defaults *are* the result — this is the write that used to
          // happen before the read went out.
          if (pendingPristine) {
            writeConfigBlockText(pendingPristine, 'address-reset');
            pendingPristine = null;
          }
          var missNote = nothingReadNote(found);
          var addedNote = insertedModesNote(onMiss.added, onMiss.dropped);
          setAutoImportNote(
            missNote && addedNote ? missNote + ' ' + addedNote : (addedNote || missNote)
          );
          return;
        }
        var where = found.collection + (found.group ? ' \u00b7 ' + found.group : '');

        // No untouched rule and no offer. Loading overwrites, because choosing an address is the
        // instruction — and the note that said "clear them to load it" told someone to do something
        // the panel gave them no way to do.

        // **The estimate, kept before the block is written over.** Recognition fits a curve to the ramp
        // the file already holds, and those coordinates arrive here inside `found.config` — the collection's
        // in OKLCH, one per mode in HSL. The form needs them so its preset dropdown can offer *Estimated
        // original*, and it cannot re-derive them: the fit is a function of the collection's colours, which
        // live out here and not in the renderer.
        //
        // Read from the payload rather than recomputed, so the option can never describe a different curve
        // from the one the block was filled with.
        rememberCurveBaselines(found.config);

        var fill = window.CodeFigConfigUI && window.CodeFigConfigUI.fillConfigBlock;
        if (!fill) return;
        // **Onto the prepared defaults, not onto what is on screen.** Filling over the previous address's
        // block leaves behind every key the payload does not mention; that is what the pre-read reset was
        // for, and doing it here means one write instead of two.
        var base = pendingPristine || currentConfigBlock();
        pendingPristine = null;
        var filled = fill(base, found.config);
        // One write: the fill's text, already in the collection's mode order. A second write that
        // re-read the block is what raced with this one.
        var ordered = orderedModesInBlock(filled.text);
        // Captured next to the call. `writeConfigBlockText` below reprojects the form and schedules a
        // preview, and reading a one-turn variable after all that is how a report comes to describe the
        // call after the one it is reporting on.
        var onLoad = { added: lastInsertedModes.slice(), dropped: lastDroppedModes.slice() };
        // Straight into the canonical text, with no tab switching. Switching to Configuration code and
        // back was what rebuilt the form, and a rebuild is what made this loop.
        //
        // Traced, because "the fill reported success and the block did not change" has two very
        // different causes — the write not landing, or something overwriting it a moment later — and
        // they are indistinguishable from outside. `later` is read after the current task and the
        // debounces have run, which is when an overwrite would have happened.
        // Length, not content: every domain's block is different and none of them is this code's
        // business. Three numbers are enough to tell the two failures apart — a write that never
        // landed (`afterWrite` equals `before`) from one that was undone (`later` equals `before`
        // while `afterWrite` did not).
        function blockSize(text) { return (text || '').length; }
        lastAutoImport.trace = {
          before: blockSize(currentConfigBlock()),
          filled: blockSize(filled.text)
        };
        writeConfigBlockText(ordered.text, 'auto-import:' + found.source +
          (ordered.changed ? '+ordered' : ''));
        lastAutoImport.trace.afterWrite = blockSize(currentConfigBlock());
        // **The object, not the variable.** `lastAutoImport` is reassigned by the next auto-import, so a
        // timer that reads it 800ms later can find a fresh one with no `trace` on it yet — an uncaught
        // TypeError, from diagnostic code, landing in the log where real errors are looked for. Holding the
        // trace it was measuring means a second import cannot make the first one's timer throw.
        var trace = lastAutoImport.trace;
        setTimeout(function () {
          trace.later = blockSize(currentConfigBlock());
          trace.stuck = trace.later === trace.afterWrite;
        }, 800);

        var summary = filled.summary && filled.summary.indexOf('Nothing to fill') === -1
          ? ' ' + filled.summary : '';
        // What was done about that different order, said by the thing that did it.
        if (ordered.changed) summary += ' The modes now follow this file\'s order.';
        // A recorded set can still cover fewer modes than the collection has — it records the modes it
        // was run for, and the collection gained one since. Those get a block here too, and the sentence
        // that explains where their numbers came from has to come along.
        var addedNoteOnLoad = insertedModesNote(onLoad.added, onLoad.dropped);
        if (addedNoteOnLoad) summary += ' ' + addedNoteOnLoad;

        lastAutoImport.summary = filled.summary || null;
        if (found.source === 'recorded') {
          lastAutoImport.note = 'As this Collection and Group combination contains a ' +
            configPreviewDomainLabel() + ' set, it was imported automatically.' + summary;
        } else {
          lastAutoImport.note = recognitionNote(found, where) + summary;
        }
        setAutoImportNote(lastAutoImport.note);

        // **And say it out loud, once.** The note under Group is the full account — where it came from,
        // whether running would change anything, what could not be recovered — and it is easy to miss
        // when the thing that changed is further down the panel. A toast is one line and it is the only
        // moment the settings under your cursor were replaced by something read from the file.
        //
        // Only on a load that happened. Every keystroke in Group asks a question, and the ones that
        // find nothing say nothing.
        post('NOTIFY', {
          message: (found.source === 'recorded' ? 'Loaded the saved ' : 'Read the ') +
            configPreviewDomainLabel() + ' settings from ' + where +
            (found.source === 'recorded' ? '.' : ' variables.')
        });
      }

      /**
       * What recognition actually did, in one line, without overstating it.
       *
       * Three separate claims, and collapsing them is the failure mode Márton named: a recovery that
       * quietly leaves two flags at their defaults while implying it read everything costs an
       * afternoon later.
       *
       *   1. **Where it came from.** Not a record CodeFig kept — the variables themselves, read by
       *      name. Worth saying, because it means the answer is a reading of your file rather than of
       *      our bookkeeping.
       *   2. **Whether it agrees.** The recognised config is used to recompute every `col-N`. All
       *      matching means running changes nothing; any mismatch is what a run would overwrite, and
       *      it is named with a number rather than hinted at.
       *   3. **What could not come back.** `generateOverview` was never a variable, and Extra columns
       *      is inferred from the length of the `col-*` series rather than read.
       */
      function recognitionNote(found, where) {
        var r = found.recognition || {};
        var parts = ['No ' + configPreviewDomainLabel() +
          ' set is recorded for ' + where + ', so the settings were read from the variables there.'];

        var wrong = (r.mismatched || []).length;
        if (r.checked) {
          if (!wrong) {
            parts.push('All ' + r.checked + ' column values match what this config generates, ' +
              'so running would change none of them.');
          } else {
            var first = r.mismatched[0];
            parts.push(wrong + ' of ' + r.checked + ' column values differ from what this config ' +
              'generates — running would change them, starting with ' + first.name + ' in ' +
              first.mode + ' (' + first.stored + ' \u2192 ' + Math.round(first.wouldBe * 100) / 100 + ').');
          }
        }

        var couldNot = [];
        if ((r.missing || []).indexOf('generateOverview') !== -1) {
          couldNot.push('Generate overview is not a variable, so it stays off');
        }
        if (r.extensionColumnsInferred) {
          couldNot.push('Extra columns is inferred from how many col-* variables there are');
        }
        if (couldNot.length) parts.push(couldNot.join('; ') + '.');
        return parts.join(' ');
      }

      /** The domain, as a person would name it. */
      function configPreviewDomainLabel() {
        var domain = configPreviewDomain();
        if (domain === 'radius') return 'Corner radius';
        if (!domain) return 'config';
        return domain.charAt(0).toUpperCase() + domain.slice(1);
      }

      function updateInfoPanelButtonVisibility() {
        // Show the InfoPanel button when either:
        // - The current script uses @InfoPanel, OR
        // - We have captured console messages for the last run (so errors are always accessible)
        const hasConsoleMessages = !!(_codefigLastRunConsole && _codefigLastRunConsole.length);
        if (infoPanelAvailable || hasConsoleMessages) {
          infoPanelBtn.style.display = 'flex';
        } else {
          infoPanelBtn.style.display = 'none';
          // Also close panel if it's open
          if (infoPanelOpen) {
            infoPanelOpen = false;
            infoPanel.classList.remove('open');
            infoPanelBtn.classList.remove('active');
          }
        }
      }

      // Initialize button as hidden until a script is loaded
      function initializeInfoPanel() {
        infoPanelBtn.style.display = 'none';
      }

      function toggleInfoPanel() {
        infoPanelOpen = !infoPanelOpen;
        
        if (infoPanelOpen) {
          infoPanel.classList.add('open');
          infoPanelBtn.classList.add('active');
        } else {
          infoPanel.classList.remove('open');
          infoPanelBtn.classList.remove('active');
        }
        
        // Note: State saving would need to be done via message passing to backend
      }



      // Function to select nodes in Figma
      function selectNodes(nodeIds) {
        console.log('UI: selectNodes called with nodeIds:', nodeIds);
        
        // Send message to backend to select nodes
        parent.postMessage({
          pluginMessage: {
            type: 'SELECT_NODES',
            nodeIds: nodeIds
          }
        }, '*');
      }
      
      // Make selectNodes available globally for onclick handlers
      window.selectNodes = selectNodes;

      /** The script whose run filled the InfoPanel, or null if nothing has. */
      let _infoPanelScript = null;

      /**
       * Say when the panel is showing someone else's results.
       *
       * Clearing on every script switch is the other option, and it is worse: results you were
       * comparing against vanish because you looked at another script. Naming the source keeps
       * them and removes the ambiguity, which is the actual complaint.
       */
      function updateInfoPanelOwnership() {
        const existing = document.getElementById('info-stale-note');
        if (existing) existing.remove();
        if (!_infoPanelScript || !currentScript) return;
        if (_infoPanelScript === currentScript.name) return;
        if (!infoContent || !infoContent.firstChild) return;

        const note = document.createElement('div');
        note.id = 'info-stale-note';
        note.className = 'info-stale-note';
        note.textContent = 'Showing results from ' + _infoPanelScript +
          '. You are now on ' + currentScript.name + ' — run it to replace these.';
        infoContent.insertBefore(note, infoContent.firstChild);
      }

      function displayInfoResults(data) {
        console.log('UI: displayInfoResults called with:', data);
        console.log('UI: Results array length:', data.results ? data.results.length : 'no results');
        
        const { title, results, type = 'info', grouping, showFilters = true, autoClose = false } = data;
        // A script can refuse the auto-open outright. The panel still fills, and the button still
        // shows there is something in it — a result you have to go and look at is a different thing
        // from no result. Only `false` counts, so every existing caller keeps the old behaviour.
        const autoOpen = data.autoOpen !== false;

        // Auto-open the InfoPanel when results are received (only for errors, not for success)
        if (autoOpen && !infoPanel.classList.contains('open') && !autoClose && type !== 'success') {
          console.log('UI: Auto-opening InfoPanel for results');
          toggleInfoPanel();
        }
        
        // Update main panel title (replace "Results & Information")
        const infoTitle = document.querySelector('.info-title');
        if (infoTitle && title) {
          infoTitle.textContent = title;
        }
        
        // Whose results these are. The panel outlives the script that filled it, so without this
        // switching scripts leaves you reading the last one's output under the new one's name.
        _infoPanelScript = currentScript ? currentScript.name : null;

        // Clear previous content
        infoContent.innerHTML = '';

        // Always render the internal error console block at the top (if it has content)
        _codefigRenderConsoleBlock();
        
        // Add filtering controls if grouping is enabled
        if (grouping && showFilters && grouping.modes && grouping.modes.length > 1) {
          const filterContainer = createFilterControls(grouping);
          infoContent.appendChild(filterContainer);
        }
        
        if (!results || results.length === 0) {
          const noResults = document.createElement('div');
          noResults.className = 'info-placeholder';
          noResults.innerHTML = '<p>No results found.</p>';
          infoContent.appendChild(noResults);
          return;
        }
        
        // Store data for filtering
        window.currentInfoData = data;
        
        // Display results (grouped or flat)
        if (grouping) {
          displayGroupedResults(results, grouping, type);
        } else {
          displayFlatResults(results, type);
        }
        
        // Auto-close panel after showing success message (only if panel was already open)
        if (autoClose && infoPanel.classList.contains('open')) {
          console.log('UI: Auto-closing InfoPanel after success message');
          setTimeout(() => {
            toggleInfoPanel();
          }, 2000); // Close after 2 seconds
        }
      }

      function createFilterControls(grouping) {
        const container = document.createElement('div');
        container.className = 'info-filter-controls';
        container.style.cssText = 'margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-light);';
        
        const label = document.createElement('span');
        label.textContent = 'Group by: ';
        label.style.cssText = 'font-size: 11px; color: #666; margin-right: 8px;';
        container.appendChild(label);
        
        grouping.modes.forEach((mode, index) => {
          const button = document.createElement('button');
          button.textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
          button.className = 'filter-btn';
          button.style.cssText = `
            font-size: 10px; 
            padding: 4px 8px; 
            margin-right: 4px; 
            border: 1px solid var(--border-color); 
            background: ${mode === grouping.default ? '#007AFF' : '#fff'}; 
            color: ${mode === grouping.default ? '#fff' : '#333'}; 
            border-radius: 4px; 
            cursor: pointer;
          `;
          
          button.addEventListener('click', () => {
            // Update active state
            container.querySelectorAll('.filter-btn').forEach(btn => {
              btn.classList.remove('active');
            });
            button.classList.add('active');
            
            // Re-render with new grouping
            if (window.currentInfoData) {
              const newGrouping = { ...window.currentInfoData.grouping, default: mode };
              displayGroupedResults(window.currentInfoData.results, newGrouping, window.currentInfoData.type);
            }
          });
          
          container.appendChild(button);
        });
        
        return container;
      }

      function displayFlatResults(results, type) {
        results.forEach(result => {
          const item = document.createElement('div');
          item.className = `info-result-item ${result.severity || type}`;
          
          // Handle custom HTML structure
          if (result.html) {
            item.innerHTML = result.html;
          } else {
            // Standard message/details structure
            const message = document.createElement('div');
            message.className = 'info-result-message';
            // Support HTML content if message contains HTML tags, otherwise use textContent
            if (typeof result.message === 'string' && (result.message.includes('<') || result.message.includes('&'))) {
              message.innerHTML = result.message;
            } else {
              message.textContent = result.message || result.toString();
            }
            item.appendChild(message);
          
          if (result.details) {
            const details = document.createElement('div');
            details.className = 'info-result-details';
            // Support HTML content if details contains HTML tags, otherwise use textContent
            if (typeof result.details === 'string' && (result.details.includes('<') || result.details.includes('&'))) {
              details.innerHTML = result.details;
            } else {
              details.textContent = result.details;
            }
            item.appendChild(details);
          }
          }

          if (result.copyText) {
            const copyRow = document.createElement('div');
            copyRow.className = 'info-copy-row';
            copyRow.style.cssText = 'margin-top: 8px; display: flex; gap: 8px; align-items: center;';
            const copyBtn = document.createElement('button');
            copyBtn.type = 'button';
            copyBtn.className = 'btn secondary';
            copyBtn.textContent = 'Copy to clipboard';
            copyBtn.addEventListener('click', function (e) {
              e.stopPropagation();
              _codefigCopyTextToClipboard(result.copyText);
            });
            copyRow.appendChild(copyBtn);
            item.appendChild(copyRow);
            const pre = document.createElement('pre');
            pre.className = 'info-copy-payload';
            pre.style.cssText = 'margin-top: 8px; max-height: 280px; overflow: auto; padding: 8px; background: var(--bg-secondary, #f5f5f5); border-radius: 4px; font-size: 10px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; user-select: all;';
            pre.textContent = result.copyText;
            item.appendChild(pre);
          }
          
          // Add click handler for node selection (single or multiple)
          if (result.nodeId || result.nodeIds) {
            item.style.cursor = 'pointer';
            item.addEventListener('click', () => {
              if (result.nodeIds && result.nodeIds.length > 0) {
                // Bulk selection
                parent.postMessage({
                  pluginMessage: { type: 'SELECT_NODES', nodeIds: result.nodeIds }
                }, '*');
              } else if (result.nodeId) {
                // Single selection
                parent.postMessage({
                  pluginMessage: { type: 'SELECT_NODE', nodeId: result.nodeId }
                }, '*');
              }
            });
          }
          
          infoContent.appendChild(item);
        });
      }

      function displayGroupedResults(results, grouping, type) {
        // Clear existing results (but keep filter controls)
        const existingResults = infoContent.querySelectorAll('.info-group, .info-result-item');
        existingResults.forEach(el => el.remove());
        
        const currentMode = grouping.default;
        
        // Group the results using built-in logic
        const grouped = groupResultsByMode(results, currentMode, grouping);
        
        // Display each group
        grouped.order.forEach(groupKey => {
          const group = grouped.groups[groupKey];
          
          // Create group header matching Figma design
          const groupHeader = document.createElement('div');
          groupHeader.className = 'info-group-header';
          groupHeader.style.cssText = `
            font-size: 12px; 
            font-weight: 600; 
            color: #333; 
            margin: 16px 0 8px 0; 
            padding: 0 0 4px 0; 
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            transition: color 0.2s ease;
          `;
          
          groupHeader.classList.add('info-group-header-interactive');
          
          groupHeader.innerHTML = `${group.title} (${group.count})`;
          
          // Add bulk selection functionality
          groupHeader.addEventListener('click', () => {
            const nodeIds = group.results.map(result => result.nodeId).filter(id => id);
            if (nodeIds.length > 0) {
              parent.postMessage({
                pluginMessage: { type: 'SELECT_NODES', nodeIds: nodeIds }
              }, '*');
              
              // Visual feedback
              groupHeader.classList.add('clicked');
              setTimeout(() => {
                groupHeader.classList.remove('clicked');
              }, 200);
            }
          });
          
          infoContent.appendChild(groupHeader);
          
          // Create group container
          const groupContainer = document.createElement('div');
          groupContainer.className = 'info-group';
          groupContainer.style.cssText = 'margin-bottom: 12px;';
          
          // Add results list matching Figma design
          group.results.forEach((result, index) => {
            const item = document.createElement('div');
            item.className = 'info-result-item info-variable-item';
            
            // Property type (main text) - extracted from variable name
            const propertyDisplay = document.createElement('div');
            propertyDisplay.className = 'info-variable-name';
            
            // Extract property type from variable name (e.g., "Typography/4xl/letter-spacing" -> "letter-spacing")
            let displayText = result.property || 'Unknown Property';
            if (result.variableName && result.variableName.includes('/')) {
              const parts = result.variableName.split('/');
              displayText = parts[parts.length - 1]; // Get the last part (property type)
            }
            propertyDisplay.textContent = displayText;
            item.appendChild(propertyDisplay);
            
            // Node info (secondary text)
            const nodeInfo = document.createElement('div');
            nodeInfo.className = 'info-variable-details';
            nodeInfo.textContent = 'in ' + (result.nodeName || 'Unknown Node');
            item.appendChild(nodeInfo);
            
            // Add click handler for individual node selection
            if (result.nodeId) {
              item.addEventListener('click', (e) => {
                e.stopPropagation(); // Prevent group selection
                parent.postMessage({
                  pluginMessage: { type: 'SELECT_NODE', nodeId: result.nodeId }
                }, '*');
                
                // Visual feedback
                item.classList.add('clicked');
                setTimeout(() => {
                  item.classList.remove('clicked');
                }, 200);
              });
            }
            
            groupContainer.appendChild(item);
          });
          
          infoContent.appendChild(groupContainer);
        });

        // Auto-open panel if not already open — and the second place that decides it, which is why
        // it asks the same question rather than carrying its own answer: a grouped result set used to
        // open the panel unconditionally, so `autoOpen: false` would have held for a flat list and
        // quietly not for a grouped one. Re-render on a filter change goes through here too, and
        // must not open a panel the user closed.
        if (!infoPanelOpen && !(window.currentInfoData && window.currentInfoData.autoOpen === false)) {
          toggleInfoPanel();
        }
      }

      function groupResultsByMode(results, mode, grouping) {
        var groups = {};
        var groupOrder = [];
        
        for (var i = 0; i < results.length; i++) {
          var result = results[i];
          var groupKey = getGroupKeyByMode(result, mode);
          
          if (!groups[groupKey]) {
            groups[groupKey] = {
              title: getGroupTitleByMode(groupKey, result, mode, grouping),
              results: [],
              count: 0
            };
            groupOrder.push(groupKey);
          }
          
          groups[groupKey].results.push(result);
          groups[groupKey].count++;
        }
        
        return {
          groups: groups,
          order: groupOrder
        };
      }

      function getGroupKeyByMode(result, mode) {
        if (mode === 'property') {
          // Group by variable name prefix (e.g., "Typography/4xl/letter-spacing" -> "Typography/4xl")
          if (result.variableName && result.variableName.includes('/')) {
            var parts = result.variableName.split('/');
            if (parts.length >= 2) {
              // For "Typography/4xl/letter-spacing" -> "Typography/4xl"
              // For "grey/900" -> "grey"
              return parts.slice(0, 2).join('/');
            }
          }
          
          // Fallback to property-based grouping for variables without clear naming
          if (result.property && ['fontSize', 'fontWeight', 'fontFamily', 'lineHeight', 'letterSpacing'].includes(result.property)) {
            return 'Typography Properties';
          }
          if (result.property === 'fills') {
            return 'Fill Properties';
          }
          
          return result.property || 'Other Variables';
        } else if (mode === 'node') {
          // Group by node name
          return result.nodeName || 'Unknown Node';
        }
        return 'other';
      }

      function getGroupTitleByMode(groupKey, result, mode, grouping) {
        if (mode === 'property') {
          // For variable name prefixes, use them directly as titles
          if (groupKey.includes('/')) {
            return groupKey; // e.g., "Typography/4xl" or "grey/900"
          }
          
          // Convert property names to readable titles
          if (grouping.propertyTitles && grouping.propertyTitles[groupKey]) {
            return grouping.propertyTitles[groupKey];
          }
          
          // Default property title mapping for fallback cases
          var propertyTitles = {
            'Typography Properties': 'Typography Properties',
            'Fill Properties': 'Fill Properties',
            'fontSize': 'Font Size',
            'fontWeight': 'Font Weight',
            'fontFamily': 'Font Family',
            'lineHeight': 'Line Height',
            'letterSpacing': 'Letter Spacing'
          };
          
          return propertyTitles[groupKey] || (groupKey.charAt(0).toUpperCase() + groupKey.slice(1) + ' Properties');
        } else if (mode === 'node') {
          // Show node type in parentheses if available
          var nodeType = '';
          if (result.nodeType) {
            nodeType = ' (' + result.nodeType + ')';
          }
          return groupKey + nodeType;
        }
        return groupKey;
      }

      // Create new script
      function createNewScript() {
        debugLog('Creating new script...');
        
        const newScript = {
          name: 'Untitled',
          type: 'user',
          code: '',
          isTemporary: true
        };
        
        debugLog('Created script:', newScript);
        
        // Don't add to allScripts yet - will be added when it gets content
        selectScriptDirectly(newScript);
        
        // Focus the editor
        setTimeout(() => {
          code.focus();
        }, 100);
        
        post('NOTIFY', { message: 'Created new script - start typing to save it!' });
      }
      

      // Auto-save current script (silent, no prompts)
      function autoSaveCurrentScript() {
        debugLog('autoSaveCurrentScript called');
        
        if (!currentScript || currentScript.type !== 'user') {
          debugLog('autoSaveCurrentScript - no current script or not user script');
          return;
        }
        
        const scriptCode = getFullCode();
        debugLog('autoSaveCurrentScript - script code length:', scriptCode.length);
        debugLog('autoSaveCurrentScript - script code preview:', scriptCode.substring(0, 50) + '...');
        
        // Don't save if there's no content
        if (!scriptCode.trim()) {
          debugLog('autoSaveCurrentScript - no content to save');
          return;
        }
        
        // Don't save if no changes
        if (scriptCode === originalCode) {
          debugLog('autoSaveCurrentScript - no changes detected');
          return;
        }
        
        debugLog('autoSaveCurrentScript - before update, currentScript.code length:', currentScript.code ? currentScript.code.length : 'undefined');
        debugLog('autoSaveCurrentScript - currentScript.isTemporary:', currentScript.isTemporary);
        
        // Update current script code first
        currentScript.code = scriptCode;
        originalCode = scriptCode;
        
        debugLog('autoSaveCurrentScript - after update, currentScript.code length:', currentScript.code.length);
        
        // If this is a temporary script that now has content, activate it
        if (currentScript.isTemporary) {
          debugLog('autoSaveCurrentScript - activating temporary script');
          activateUntitledScript();
        }
        
        const scriptData = {
          name: currentScript.name,
          code: scriptCode,
          type: 'user'
        };
        
        debugLog('autoSaveCurrentScript - about to save scriptData:', {
          name: scriptData.name,
          codeLength: scriptData.code.length,
          type: scriptData.type,
          group: scriptData.group
        });
        
        post('SAVE', scriptData);
        updateButtonStates();
        updateScriptList(searchInput.value);
      }

      // Activate an untitled script when it gets content
      function activateUntitledScript() {
        if (!currentScript || !currentScript.isTemporary) {
          debugLog('activateUntitledScript - no current script or not temporary');
          return;
        }
        
        debugLog('Activating untitled script with code length:', currentScript.code ? currentScript.code.length : 'undefined');
        debugLog('Activating untitled script with code preview:', currentScript.code ? currentScript.code.substring(0, 50) + '...' : 'undefined');
        
        // Generate a simple sequential name
        const generatedName = generateUntitledName();
        
        debugLog('Generated name:', generatedName);
        
        // Update the script immediately
        currentScript.name = generatedName;
        currentScript.isTemporary = false;
        
        debugLog('Updated script name to:', currentScript.name, 'isTemporary:', currentScript.isTemporary);
        
        // Update UI immediately
        scriptTitle.textContent = generatedName;
        scriptTitle.classList.add('editable');
        
        // Add to allScripts if not already there
        if (!allScripts.includes(currentScript)) {
          allScripts.push(currentScript);
          debugLog('Added script to allScripts. Total scripts:', allScripts.length);
        } else {
          debugLog('Script already in allScripts');
        }
