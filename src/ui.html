            // is a no-op in the DOM, so this arrived as "the field went empty" — which made the whole
            // create path, on both pickers, undrivable from the terminal and therefore unverifiable.
            // The sentinel itself is a NUL-prefixed string and cannot travel through a shell, so the
            // gesture is named by what it does rather than by the value it sets.
            var pickerNew = tag === 'select' && target.classList &&
              (target.classList.contains('config-ui-collection-select') ||
                target.classList.contains('config-ui-mode-select'))
              ? Array.prototype.filter.call(target.options, function (o) {
                  return o.value && o.value.charCodeAt(0) === 0;
                })[0]
              : null;
            var wanted = a.value == null ? '' : String(a.value);
            var alreadyListed = Array.prototype.some.call(target.options || [], function (o) {
              return o.value === wanted;
            });
            if (pickerNew && wanted && !alreadyListed) {
              return actAndSettle(function () {
                target.value = pickerNew.value;
                target.dispatchEvent(new Event('change', { bubbles: true }));
                var typed = uiControlTarget(a.name, 'new', a.index);
                if (!typed) throw new Error('That picker revealed no name input');
                typed.value = wanted;
                typed.dispatchEvent(new Event('input', { bubbles: true }));
                typed.dispatchEvent(new Event('change', { bubbles: true }));
              }).then(function (how) {
                return { settled: how, text: currentConfigBlock() };
              });
            }

            // Set the value, then dispatch what a keystroke dispatches, and let the existing
            // listeners do the work. Calling `getValues` or a handler directly would pass while the
            // control stayed broken, which is the whole point of driving the real event path.
            return actAndSettle(function () {
              if (target.type === 'checkbox' || target.type === 'radio') {
                // **A radio takes its option by value, not only by `part`.** `uiControlTarget` falls back to
                // the *first* input of a group when nothing matches `part`, and the value is then read as a
                // boolean — so `name=colorModel value=oklch` unchecked HSL, selected nothing, and reported
                // success. The panel then previewed HSL while the terminal believed it was on OKLCH, which is
                // exactly the class of "verified against the wrong state" this tool exists to stop. So a
                // string that names one of the group's options is honoured as the option.
                // **The flat lookup must not run when the option is already resolved.** A radio inside a
                // `@rows` cell is addressed `cellKey:option`; re-resolving on the bare value looks for a
                // *cell* called `bezier`, finds nothing, and falls through to `checked = false` — so the
                // command unchecked the option it had just found and still reported `settled: change`.
                // Same silent-success shape as the wrapper bug above, arriving from the other direction.
                var named = !rowRadioOption && target.type === 'radio' && a.value != null &&
                  a.value !== true && a.value !== 'true' && a.value !== false && a.value !== 'false'
                  ? uiControlTarget(a.name, String(a.value), a.index)
                  : null;
                if (named && named.value !== String(a.value)) {
                  throw new Error('"' + a.name + '" has no option called "' + a.value + '"');
                }
                if (named) target = named;
                target.checked = (named || rowRadioOption) ? true : (a.value === true || a.value === 'true');
              } else {
                target.value = a.value == null ? '' : String(a.value);
              }
              if (tag === 'select' || target.type === 'checkbox' || target.type === 'radio') {
                target.dispatchEvent(new Event('change', { bubbles: true }));
              } else {
                target.dispatchEvent(new Event('input', { bubbles: true }));
                target.dispatchEvent(new Event('change', { bubbles: true }));
              }
            }).then(function (how) {
              return { settled: how, text: currentConfigBlock() };
            });
          }

          case 'clickControl': {
            if (!a.name || !a.part) throw new Error('clickControl needs { name, part }');
            // Parts of a config control only. There is deliberately no way to reach Run, or anything
            // else that writes to the document: `figma:run` is the path for that, and it carries the
            // filename guard a UI click would bypass.
            // An allow-list, and it stays one: a click that can reach anything the UI does not regard
            // as part of a config control is a click that can eventually reach Run. `chip-remove` is
            // here because removing a mode is a click; renaming and adding are not — they are three
            // events, so they go through `setField` as a whole gesture.
            // `cell:shape` and `cell:middle` reach the curve editor's two buttons. Named suffixes rather
            // than a free-form selector, for the reason the whole addressing scheme exists: a command that
            // can build its own selector is a short step from one that can reach Run.
            var curveButton = /:(shape|middle)$/.test(String(a.part || ''));
            if (!curveButton && ['add', 'remove', 'tab', 'chip-remove', 'card'].indexOf(a.part) === -1) {
              throw new Error('clickControl accepts part add, remove, tab, chip-remove, card, ' +
                '<cell>:shape or <cell>:middle — not "' + a.part + '"');
            }
            var clickable = uiControlTarget(a.name, a.part, a.index);
            if (!clickable) throw new Error('No "' + a.part + '" on control "' + a.name + '"');
            return actAndSettle(function () {
              clickable.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
            }).then(function (how) {
              return { settled: how, text: currentConfigBlock() };
            });
          }

          case 'readForm':
            // The **rendered** form, read out of the DOM rather than out of the schema. Reading the
            // schema would only prove the parser agrees with itself; the question worth asking is
            // whether the control the parser asked for is the control that exists, holding the
            // value it should. `@rows` shipped with its parse half tested ten ways and its render
            // half untested, which is what this closes.
            return Promise.resolve(readRenderedForm());

          case 'readTabs': {
            var shown = [];
            [].forEach.call(document.querySelectorAll('.editor-tab'), function (btn) {
              if (btn.style.display !== 'none') shown.push(btn.getAttribute('data-tab'));
            });
            var note = document.getElementById('configStaleNote');
            var noForm = document.getElementById('configNoForm');
            return Promise.resolve({
              current: currentTab,
              shown: shown,
              hasDocs: !!scriptHasDocs,
              hasConfig: !!scriptHasConfig,
              hasUiConfig: !!scriptHasUIConfig,
              formReadOnly: !!configFormReadOnly,
              staleNote: note && note.style.display !== 'none' ? note.textContent : null,
              noFormNote: noForm && noForm.style.display !== 'none' ? noForm.textContent : null
            });
          }

          // What a Run would do to the collection's modes. **Read-only** — it derives the answer and
          // hands it back, from the same call `runCurrentScript` makes, and touches nothing. Without
          // it the one thing worth verifying about chips is invisible from outside: whether a rename
          // is going to be a rename.
          case 'readAutoImport':
            return Promise.resolve({
              autoImport: lastAutoImport, pristine: lastPristine,
              ordering: lastOrdering, writes: blockWrites
            });

          case 'readModeIntents':
            return Promise.resolve({
              intents: currentModeIntents(),
              fileModes: fileModes,
              chipModeIds: chipModeIds,
              removedModeIds: removedModeIds,
              addedModeNames: addedModeNames
            });

          default:
            throw new Error('Unknown UI command "' + command + '". Known: ' +
              _codefigUiCommandNames().join(', '));
        }
      }

      /** What the form actually rendered: every control, its type, and what it holds. */
      function readRenderedForm() {
        var container = document.getElementById('configUIContainer');
        var shown = !!(container && container.style.display !== 'none');
        var fields = [];

        function rowVisible(el) {
          if (!el.closest) return true;
          // Both, because visibility is set on whichever wrapper carries the rule: `@showWhen` marks
          // the field *and* its row, and a mode picker with nothing to decide hides the row alone —
          // reporting that one as visible would say the panel shows a control it does not.
          var field = el.closest('.config-ui-field');
          var row = el.closest('.config-ui-row');
          if (field && field.style.display === 'none') return false;
          if (row && row.style.display === 'none') return false;
          return true;
        }

        if (container) {
          // The collection picker. Its parts deliberately carry no `data-field` — the flat collector
          // would report the "create a new one" sentinel as the value — so without a branch here it
          // was simply absent from the report, which reads identically to "it did not render".
          container.querySelectorAll('[data-collection-field]').forEach(function (wrap) {
            var select = wrap.querySelector('.config-ui-collection-select');
            var newName = wrap.querySelector('.config-ui-collection-new');
            var note = wrap.querySelector('.config-ui-collection-note');
            fields.push({
              name: wrap.getAttribute('data-collection-field'),
              control: 'collection',
              value: window.CodeFigConfigUI && window.CodeFigConfigUI.readCollectionControl
                ? window.CodeFigConfigUI.readCollectionControl(wrap)
                : null,
              options: select ? Array.prototype.map.call(select.options, function (o) {
                return o.textContent;
              }) : [],
              creating: !!(newName && newName.style.display !== 'none'),
              note: note && note.style.display !== 'none' ? note.textContent : null,
              visible: rowVisible(wrap)
            });
          });

          // The mode picker, for the same reason: its parts carry no `data-field` either, and it has
          // one state no other control has — hidden because the collection has a single mode, which
          // is a rendering decision worth being able to observe from the terminal.
          container.querySelectorAll('[data-mode-field]').forEach(function (wrap) {
            var select = wrap.querySelector('.config-ui-mode-select');
            var newName = wrap.querySelector('.config-ui-mode-new');
            var note = wrap.querySelector('.config-ui-mode-note');
            fields.push({
              name: wrap.getAttribute('data-mode-field'),
              control: 'mode',
              value: window.CodeFigConfigUI && window.CodeFigConfigUI.readModeControl
                ? window.CodeFigConfigUI.readModeControl(wrap)
                : null,
              collection: wrap.getAttribute('data-mode-collection') || '',
              options: select ? Array.prototype.map.call(select.options, function (o) {
                return o.textContent;
              }) : [],
              creating: !!(newName && newName.style.display !== 'none'),
              note: note && note.style.display !== 'none' ? note.textContent : null,
              visible: rowVisible(wrap)
            });
          });

          container.querySelectorAll('[data-rows-field]').forEach(function (wrap) {
            var rows = [];
            var layout = null;
            wrap.querySelectorAll('.config-ui-rows-item').forEach(function (rowEl) {
              var row = {};
              rowEl.querySelectorAll('[data-row-field]').forEach(function (cell) {
                var key = cell.getAttribute('data-row-field');
                if (cell.getAttribute('data-row-radio')) {
                  // A radio group holds its value in whichever input is checked, and the group is what
                  // carries the field name. Reading `.value` off the group gives `undefined`, so
                  // `scaleType` was simply absent from every row this reported — an instrument lying by
                  // omission, which is worse than one that fails, because the row still looked complete.
                  var on = cell.querySelector('input:checked');
                  row[key] = on ? on.value : null;
                  return;
                }
                var curveHeld = cell.getAttribute('data-curve-value');
                if (curveHeld !== null) {
                  // A curve keeps its value on the wrapper, so `.value` is `undefined` — the same
                  // lying-by-omission a radio group used to do here. Reported as the coordinates plus
                  // what the panel calls them, because "is it the preset I chose" is the question a
                  // reader has and four decimals do not answer it.
                  var presetEl = cell.querySelector('.config-ui-curve__preset');
                  var textEl = cell.querySelector('.config-ui-curve__text');
                  row[key] = {
                    points: curveHeld,
                    preset: presetEl ? presetEl.value : null,
                    text: textEl ? textEl.value : null
                  };
                } else {
                  row[key] = cell.type === 'checkbox' ? cell.checked : cell.value;
                }
                // Whether the cell is on screen, because a hidden cell's value is not this mode's
                // setting — `ratio` reads `1.067` in a metric mode purely because a select must show
                // something.
                if (cell.closest('.config-ui-rows-cell') &&
                    cell.closest('.config-ui-rows-cell').style.display === 'none') {
                  row[key] = { hidden: row[key] };
                }
              });
              rows.push(row);
              // Measured from the first row only: design feedback is about layout, and a control
              // list without geometry cannot answer "is that gap 8px or 20px". Read rather than
              // asserted — nothing here compares against a number, because a pixel assertion would
              // break on a font change.
              if (!layout) {
                var cells = [];
                rowEl.querySelectorAll('.config-ui-rows-cell').forEach(function (cellEl) {
                  var input = cellEl.querySelector('[data-row-field]');
                  cells.push({
                    key: input ? input.getAttribute('data-row-field') : null,
                    left: Math.round(cellEl.offsetLeft),
                    width: Math.round(cellEl.offsetWidth),
                    inputWidth: input ? Math.round(input.offsetWidth) : null,
                    inputHeight: input ? Math.round(input.offsetHeight) : null
                  });
                });
                var gaps = [];
                for (var g = 1; g < cells.length; g++) {
                  gaps.push(cells[g].left - (cells[g - 1].left + cells[g - 1].width));
                }
                // Buttons are measured too: "make them line up with the inputs" is a claim about
                // heights, and nudging padding until it looks close is what breaks on the next font
                // change.
                var buttons = [];
                var addBtn = wrap.querySelector('.config-ui-rows-add');
                var removeBtn = rowEl.querySelector('.config-ui-rows-remove');
                if (removeBtn) buttons.push({ kind: 'remove', height: Math.round(removeBtn.offsetHeight) });
                if (addBtn) buttons.push({ kind: 'add', height: Math.round(addBtn.offsetHeight) });

                var labelEl = wrap.closest ? wrap.closest('.config-ui-field') : null;
                var labelText = labelEl ? labelEl.querySelector('.config-ui-field__label') : null;

                layout = {
                  rowWidth: Math.round(rowEl.offsetWidth),
                  buttons: buttons,
                  controlHeight: Math.round(wrap.offsetHeight),
                  labelAlign: labelText ? {
                    height: Math.round(labelText.offsetHeight),
                    top: Math.round(labelText.getBoundingClientRect().top),
                    controlTop: Math.round(wrap.getBoundingClientRect().top),
                    controlBottom: Math.round(wrap.getBoundingClientRect().bottom)
                  } : null,
                  cells: cells,
                  gapsBetweenCells: gaps,
                  cssColumnGap: window.getComputedStyle(rowEl).columnGap
                };
              }
            });
            var tabs = [];
            wrap.querySelectorAll('.config-ui-rows-tab').forEach(function (tab) {
              tabs.push({ label: tab.textContent, active: tab.classList.contains('is-active') });
            });
            fields.push({
              name: wrap.getAttribute('data-rows-field'),
              control: 'rows',
              tabs: tabs.length > 0 ? tabs : null,
              rows: rows,
              layout: layout,
              visible: rowVisible(wrap)
            });
          });

          container.querySelectorAll('[data-field]').forEach(function (el) {
            if (el.classList.contains('config-ui-multiselect-cb')) return;
            var name = el.getAttribute('data-field');
            // How the label sits against its control. The shared alignment rule changed for **every**
            // form in the plugin, and "does a label look centred" is not something a control list can
            // answer — so it is measured. Reported, never asserted against a number here: a pixel
            // assertion would break on a font change.
            var fieldWrap = el.closest ? el.closest('.config-ui-field') : null;
            var labelEl = fieldWrap ? fieldWrap.querySelector('.config-ui-field__label') : null;
            var align = null;
            if (labelEl) {
              var lb = labelEl.getBoundingClientRect();
              var cb = el.getBoundingClientRect();
              // The rule is "centred on the control's **first input-height band**", not on the whole
              // control — so the measure is where the label's centre sits relative to the control's
              // *top*. For an aligned label that is half its own height, whatever the control's height.
              // Measuring against the control's centre reported every textarea as 28px out when it was
              // correct, which is a broken instrument rather than a broken layout.
              align = {
                labelHeight: Math.round(lb.height),
                controlHeight: Math.round(cb.height),
                centreFromControlTop: Math.round((lb.top + lb.height / 2 - cb.top) * 10) / 10,
                // Half the **band** the control occupies, not half the label: a control shorter than a
                // band centres inside it, so its own top is already inset. Corrected twice now, and both
                // times the layout was right and the measure was wrong — a metric that has to be
                // explained after every reading is not yet a metric.
                expected: Math.round((Math.min(cb.height, lb.height) / 2) * 10) / 10
              };
            }
            var control = el.tagName.toLowerCase();
            if (control === 'input') control = el.type;
            if (el.classList.contains('config-ui-multiselect')) control = 'multiselect';
            var entry = { name: name, control: control, visible: rowVisible(el) };
            if (control === 'multiselect') {
              entry.value = [];
              el.querySelectorAll('.config-ui-multiselect-cb:checked').forEach(function (cb) {
                entry.value.push(cb.value);
              });
            } else if (el.type === 'checkbox' || el.type === 'radio') {
              entry.value = el.checked;
              if (el.type === 'radio') entry.option = el.value;
            } else {
              entry.value = el.value;
            }
            if (el.tagName.toLowerCase() === 'select') {
              entry.options = Array.prototype.map.call(el.options, function (o) { return o.value; });
            }
            if (align) entry.align = align;
            fields.push(entry);
          });

          // Collection modes, as chips.
          container.querySelectorAll('[data-chips-field]').forEach(function (wrap) {
            var chips = [];
            wrap.querySelectorAll('.config-ui-chip').forEach(function (chip) {
              chips.push({
                name: chip.getAttribute('data-chip-name'),
                // The link to the file. Reported because "this rename will be a rename" and "this
                // rename will orphan the mode" look identical without it — which is how a missing
                // mode-table read survived being reasoned about twice.
                modeId: chip.getAttribute('data-mode-id'),
                placeholder: chip.classList.contains('config-ui-chip--placeholder'),
                removable: !!chip.querySelector('.config-ui-chip-remove'),
                draggable: chip.getAttribute('draggable') === 'true'
              });
            });
            var removalRow = wrap.closest ? wrap.closest('.config-ui-row') : null;
            var removalNote = removalRow ? removalRow.querySelector('.config-ui-chips-removal') : null;
            fields.push({
              name: wrap.getAttribute('data-chips-field'),
              control: 'chips',
              chips: chips,
              pending: removalNote ? removalNote.textContent : null,
              placeholder: wrap.getAttribute('data-placeholder') === 'true',
              editing: !!wrap.querySelector('.config-ui-chip-input'),
              visible: rowVisible(wrap)
            });
          });

          // Fields no control can hold. Reported because "the form dropped it" and "the form has
          // no control for it" look identical from outside otherwise.
          container.querySelectorAll('[data-readonly-field]').forEach(function (el) {
            fields.push({
              name: el.getAttribute('data-readonly-field'),
              control: 'unsupported',
              value: el.textContent,
              visible: rowVisible(el)
            });
          });
        }

        // A catch-all for composites nobody has taught this function about yet.
        //
        // Three times now a new control has been invisible here — the collection picker, the chips,
        // and `@rows` before them — because a composite carries `data-<kind>-field` rather than
        // `data-field`, and absent reads identically to "it did not render". Reporting the class
        // rather than the instance means the next composite is at worst under-described, never
        // missing.
        if (container) {
          var seen = {};
          fields.forEach(function (f) { seen[f.name] = true; });
          container.querySelectorAll('*').forEach(function (el) {
            if (!el.attributes) return;
            for (var a = 0; a < el.attributes.length; a++) {
              var match = /^data-([a-z]+)-field$/.exec(el.attributes[a].name);
              if (!match || match[1] === 'row' || match[1] === 'readonly') continue;
              var name = el.attributes[a].value;
              if (!name || seen[name]) continue;
              seen[name] = true;
              fields.push({
                name: name,
                control: match[1],
                undescribed: true,
                text: el.innerText ? el.innerText.slice(0, 200) : '',
                visible: rowVisible(el)
              });
            }
          });
        }

        // Auto-import's answer, reported because it *is* the behaviour: "it was imported
        // automatically" is a claim, and a claim nothing can read is one nobody can check.
        var autoNote = document.getElementById('autoImportNote');
        // The two edges that have to be the same line: the first tab's and the first row's.
        var firstTab = document.querySelector('.editor-tab');
        var firstRow = container ? container.querySelector('.config-ui-row') : null;
        var edges = null;
        if (firstTab && firstRow) {
          edges = {
            tabLeft: Math.round(firstTab.getBoundingClientRect().left),
            rowContentLeft: Math.round(firstRow.getBoundingClientRect().left +
              parseFloat(window.getComputedStyle(firstRow).paddingLeft || '0'))
          };
        }

        return {
          shown: shown,
          script: currentScript ? currentScript.name : null,
          edges: edges,
          hasUiConfig: !!scriptHasUIConfig,
          autoImportNote: autoNote ? autoNote.textContent : null,
          // Gone with the untouched rule: loading overwrites, and the safety lives entirely in the
          // trigger — only an address change asks.
          autoImportTriggers: ['collectionName', 'group'],
          fields: fields
        };
      }

      function _codefigUiReport(id, payload) {
        _codefigBridgeFetch('/ui/' + id + '/result', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      }

      var _codefigUiBusy = false;

      function _codefigUiPoll() {
        if (!CODEFIG_BUILD_IS_DEV) return;
        // Never while a run is in flight: selecting a script under a running script is not a
        // question anyone wants answered.
        if (_codefigUiBusy || codefigJob.active || codefigRunSession.active) return;
        _codefigBridgeFetch('/ui/next')
          .then(function (res) { return res && res.status === 200 ? res.json() : null; })
          .then(function (cmd) {
            if (!cmd) return;
            _codefigUiBusy = true;
            var buildId = CODEFIG_BUILD_ID;
            var running;
            try {
              running = handleUiCommand(cmd.command, cmd.args);
            } catch (e) {
              running = Promise.reject(e);
            }
            return Promise.resolve(running)
              .then(function (result) {
                _codefigUiReport(cmd.id, { ok: true, result: result, buildId: buildId });
              })
              .catch(function (e) {
                _codefigUiReport(cmd.id, {
                  ok: false, error: (e && e.message) ? e.message : String(e), buildId: buildId
                });
              })
              .then(function () { _codefigUiBusy = false; });
          })
          .catch(function () { _codefigUiBusy = false; });
      }

      if (CODEFIG_BUILD_IS_DEV) {
        setInterval(_codefigUiPoll, CODEFIG_JOB_POLL_MS);
      }

      function _codefigQueuePoll() {
        if (!CODEFIG_BUILD_IS_DEV) return;
        // Never interleave with a run the user started, or with another job.
        if (codefigJob.active || codefigRunSession.active) return;
        // No bridge listening is the normal case outside `npm run dev`, hence the null checks.
        _codefigBridgeFetch('/jobs/next')
          .then(function (res) { return res && res.status === 200 ? res.json() : null; })
          .then(function (job) { if (job) _codefigQueueStart(job); })
          .catch(function () {});
      }

      if (CODEFIG_BUILD_IS_DEV) {
        setInterval(_codefigQueuePoll, CODEFIG_JOB_POLL_MS);
      }

      function hideProgressBarOnly() {
        var progressIndicator = document.getElementById('progressIndicator');
        var progressFill = document.getElementById('progressFill');
        if (progressIndicator) progressIndicator.style.display = 'none';
        if (progressFill) progressFill.classList.remove('indeterminate');
        window.progressStartTime = null;
      }

      function showIndeterminateProgress(label) {
        var progressIndicator = document.getElementById('progressIndicator');
        var progressFill = document.getElementById('progressFill');
        var progressText = document.getElementById('progressText');
        if (!progressIndicator || !progressFill || !progressText) return;
        if (!codefigRunSession.active) return;
        codefigRunSession.mode = 'indeterminate';
        if (!window.progressStartTime) window.progressStartTime = Date.now();
        progressIndicator.style.display = 'flex';
        progressFill.classList.add('indeterminate');
        progressFill.style.width = '';
        progressText.textContent = label || 'Running script…';
      }

      function updateProgress(operation, processed, total, percentage) {
        var progressIndicator = document.getElementById('progressIndicator');
        var progressFill = document.getElementById('progressFill');
        var progressText = document.getElementById('progressText');

        if (!progressIndicator || !progressFill || !progressText) return;

        if (codefigRunSession.active) {
          codefigRunSession.mode = 'determinate';
        }
        if (!window.progressStartTime) window.progressStartTime = Date.now();

        progressIndicator.style.display = 'flex';
        progressFill.classList.remove('indeterminate');

        var pct = percentage != null ? percentage : (total > 0 ? Math.round((processed / total) * 100) : 0);
        var progressBarContainer = progressIndicator.querySelector('.progress-bar');
        var containerWidth = progressBarContainer.clientWidth;

        if (containerWidth === 0) {
          progressBarContainer.offsetHeight;
          containerWidth = progressBarContainer.clientWidth;
        }

        if (containerWidth === 0) {
          progressFill.style.width = pct + '%';
        } else {
          var fillWidth = Math.round((containerWidth * pct) / 100);
          progressFill.style.width = fillWidth + 'px';
        }

        var elapsed = Date.now() - (window.progressStartTime || Date.now());
        var estimated = processed > 0 && total > processed ? Math.round((elapsed / processed) * (total - processed)) : 0;
        var message = operation + ': ' + processed + '/' + total + ' (' + pct + '%)';
        if (estimated > 0) {
          var formatTime = function (ms) {
            if (ms < 1000) return ms + 'ms';
            if (ms < 60000) return Math.round(ms / 1000) + 's';
            return Math.round(ms / 60000) + 'm ' + Math.round((ms % 60000) / 1000) + 's';
          };
          message += ' - ETA: ' + formatTime(estimated);
        }
        progressText.textContent = message;
      }

      function hideProgress() {
        endRunSession();
        hideProgressBarOnly();
        var progressFill = document.getElementById('progressFill');
        if (progressFill) {
          progressFill.classList.remove('indeterminate');
          progressFill.style.width = '0';
          progressFill.style.marginLeft = '';
        }
      }

      function showProgress(operation, processed, total) {
        if (!window.progressStartTime) window.progressStartTime = Date.now();
        var percentage = total > 0 ? Math.round((processed / total) * 100) : 0;
        updateProgress(operation, processed, total, percentage);
      }

      /** Exposed for optional completion from UI-side helpers */
      window.codefigRunSessionIsIndeterminate = function () {
        return codefigRunSession.active && codefigRunSession.mode === 'indeterminate';
      };

      // Initialize everything
      function init() {
        uiDebugLog('init() started');
        uiDebugLog('CodeFigConfigUI available:', typeof window.CodeFigConfigUI !== 'undefined');
        uiDebugLog('prebuiltScripts.length (before):', prebuiltScripts.length);
        
        // Load window memory from backend FIRST, before any UI rendering
        parent.postMessage({
          pluginMessage: {
            type: 'LOAD_WINDOW_MEMORY'
          }
        }, '*');
        
        // Initialize info panel button as hidden initially
        initializeInfoPanel();
        
        // Load collapsed sections state
        loadCollapsedSections();
        
        // Populate initial scripts (build process includes all scripts in prebuiltScripts)
        allScripts = [...prebuiltScripts];
        updateScriptList();
        uiDebugLog('allScripts.length after prebuilt:', allScripts.length);
        
        // Initialize features
        initResizing();
        initWindowResizing();
        initKeyboardShortcuts();
        initTitleEditing();
        initWindowResize();
        initInfoPanel();
        
        
        // Save window memory when page is about to unload
        window.addEventListener('beforeunload', () => {
          saveWindowMemory();
        });
        
        // Read scripts from embedded script tag and send to backend
        const scriptsScript = document.getElementById('scripts-data');
        if (scriptsScript) {
          uiDebugLog('scripts-data element found, length:', (scriptsScript.textContent || '').length);
          try {
            // Get the base64 encoded content
            const scriptsBase64 = scriptsScript.textContent || scriptsScript.innerText || '';
            // Decode from base64 with proper UTF-8 handling
            const binaryString = atob(scriptsBase64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
              bytes[i] = binaryString.charCodeAt(i);
            }
            const scriptsText = new TextDecoder('utf-8').decode(bytes);
            const scripts = JSON.parse(scriptsText);
            uiDebugLog('Parsed embedded scripts count:', scripts.length);
            post('SET_SCRIPTS', { scripts: scripts });
            uiDebugLog('Posted SET_SCRIPTS with', scripts.length, 'scripts');
          } catch (e) {
            uiDebugLog('ERROR parsing scripts-data:', e.message, e.stack);
            console.error('Failed to parse scripts from UI HTML:', e);
          }
        } else {
          uiDebugLog('ERROR: scripts-data element NOT FOUND in DOM');
          console.error('Scripts script tag not found in HTML');
        }
        
        // Load utility scripts and user scripts
        uiDebugLog('Posting LOAD_EXAMPLE_SCRIPTS and LIST');
        post('LOAD_EXAMPLE_SCRIPTS');
        post('LIST');
        
        uiDebugLog('init() finished');
      }

      // Init is now called after CodeMirror is ready (see above)
    </script>
  </body>
</html>
